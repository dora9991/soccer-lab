<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サッカー分析ラボ</title>
<meta name="description" content="サッカーの試合動画にタグを付けるだけで、個人成績・xG・ショットマップ・得点/失点シーンのハイライト動画・アドバイスを自動で作るブラウザアプリ">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffffff' stroke='%23222' stroke-width='3'/%3E%3Cpath d='M32 20l10 7-4 12H26l-4-12z' fill='%23222'/%3E%3Cpath d='M32 20V8M42 27l11-4M38 39l7 10M26 39l-7 10M22 27L11 23' stroke='%23222' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
/* サッカー分析ラボ - スタイル */
:root {
  --bg: #0b101b;
  --bg2: #101727;
  --panel: #151d31;
  --panel2: #1a2440;
  --line: #27324f;
  --line2: #34436b;
  --text: #e8eefb;
  --muted: #9aa9c8;
  --dim: #6f7fa3;
  --accent: #2fd27f;
  --accent2: #8ff0bb;
  --home: #4c8dff;
  --away: #ff6b6b;
  --good: #3ddc97;
  --warn: #ffd166;
  --bad: #ff6b6b;
  --info: #5ad1ff;
  --radius: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  --font: system-ui, -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Noto Sans JP', 'Meiryo', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(1200px 600px at 20% -10%, #1a2748 0%, transparent 60%), var(--bg); color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.3; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
kbd { display: inline-block; min-width: 1.5em; padding: 0 0.42em; margin: 0 1px; font: 700 0.82em/1.6 ui-monospace, 'SF Mono', Menlo, monospace; text-align: center; color: #dfe7fb; background: #26324f; border: 1px solid #3a4a75; border-bottom-width: 2px; border-radius: 5px; }
b { font-weight: 700; }
.dim { color: var(--dim); }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.grow { flex: 1; }
.row { display: flex; align-items: center; }
.row.gap, .gap { gap: 8px; }
.row.wrap, .wrap { flex-wrap: wrap; }
.center { justify-content: center; }
.spacer { flex: 1; }
[hidden] { display: none !important; }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--line2); background: #1d2846; color: var(--text); border-radius: 9px; font-weight: 600; white-space: nowrap; transition: background 0.15s, border-color 0.15s, transform 0.05s; }
.btn:hover { background: #263559; border-color: #4a5d92; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #45e090, #22b866); border-color: #45e090; color: #032414; }
.btn.primary:hover { background: linear-gradient(180deg, #6af0a8, #2fd27f); }
.btn.accent { background: linear-gradient(180deg, #3ddc97, #23b878); border-color: #3ddc97; color: #04241a; }
.btn.danger { background: #3a1c26; border-color: #74303f; color: #ffb4bd; }
.btn.danger:hover { background: #4d2431; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: #1a2440; color: var(--text); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.disabled, .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.btn.resume { background: #14324a; border-color: #2f6e9e; color: #bfe6ff; }
.btn.pulse, .pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(47, 210, 127, 0.7); } 50% { box-shadow: 0 0 0 12px rgba(47, 210, 127, 0); } }
.ricon { width: 26px; height: 26px; display: inline-grid; place-items: center; padding: 0; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 7px; font-size: 12px; }
.ricon:hover { background: #26324f; color: var(--text); }

/* ---------- ヘッダー ---------- */
.app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #131b30, #0f1626); flex-wrap: wrap; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { font-size: 26px; filter: drop-shadow(0 2px 6px rgba(47, 210, 127, 0.5)); }
.brand-text b { display: block; font-size: 16px; letter-spacing: 0.02em; }
.brand-text small { color: var(--dim); font-size: 11px; }
.title-input { flex: 1 1 180px; min-width: 140px; max-width: 280px; padding: 7px 11px; background: #0d1424; border: 1px solid var(--line); border-radius: 9px; }
.title-input:focus, .numinput:focus, .nameinput:focus, select:focus, input[type=text]:focus, input[type=number]:focus { outline: 2px solid #4a76d8; outline-offset: 0; }
.mode-chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line2); background: #1a2440; color: var(--muted); }
.mode-chip.sample { background: #3a2a10; border-color: #7a5a1c; color: #ffd28a; }
.mode-chip.user { background: #10321f; border-color: #2a7a4a; color: #a6f0c6; }
.top-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* ---------- レイアウト ---------- */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(420px, 46%) minmax(0, 1fr); gap: 14px; padding: 14px; }
.layout > * { min-width: 0; }
.left { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; padding-right: 2px; }
.right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; background: var(--panel2); scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; background: transparent; color: var(--muted); font-weight: 600; border-radius: 10px 10px 0 0; white-space: nowrap; border-bottom: 3px solid transparent; }
.tab:hover { color: var(--text); background: #223058; }
.tab.active { color: #fff; background: var(--panel); border-bottom-color: var(--accent); }
.tab .ti { font-size: 15px; }
.panels { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; scroll-behavior: auto; container-type: inline-size; container-name: panels; }
@container panels (max-width: 640px) {
  .shot-layout { grid-template-columns: 1fr; }
  .advice-cols { grid-template-columns: 1fr; }
  .ff-row { grid-template-columns: 1fr; }
}
.panel { display: none; }
.panel.active { display: block; animation: fadein 0.18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ---------- ステージ ---------- */
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #04060c; border-radius: 12px; overflow: hidden; flex: none; border: 1px solid var(--line); box-shadow: var(--shadow); }
.stage video, .stage canvas#simCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
.stage[data-kind='file'] video { display: block; }
.stage[data-kind='sim'] canvas#simCanvas { display: block; }
.stage-empty { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 18px; background: radial-gradient(600px 300px at 50% 0%, #1b2a55, #0a0f1d); }
.stage.empty .stage-empty { display: flex; }
.stage-empty h2 { font-size: 20px; }
.stage-empty p { margin: 0 0 6px; color: var(--muted); }
.se-icon { font-size: 40px; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.scorebug { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: rgba(8, 12, 24, 0.82); border-radius: 10px; font-size: 13px; backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.08); }
.sb-team { font-weight: 700; padding-left: 8px; border-left: 4px solid var(--tc); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-pt { font-size: 18px; font-variant-numeric: tabular-nums; }
.scorebug i { color: var(--dim); font-style: normal; }
.sb-q { font-style: normal; font-weight: 700; color: var(--warn); margin-left: 4px; font-size: 12px; }
.cliptag { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 20px); padding: 8px 14px 8px 0; background: rgba(8, 12, 24, 0.86); border-radius: 10px; overflow: hidden; }
.cliptag i { width: 6px; align-self: stretch; }
.cliptag b { font-size: 15px; }
.cliptag em { font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; }
.stage-toasts { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.stoast { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(8, 12, 24, 0.88); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 999px; font-size: 13px; animation: slidein 0.22s ease; transition: opacity 0.4s, transform 0.4s; }
.stoast i { width: 10px; height: 10px; border-radius: 50%; }
.stoast em { font-style: normal; color: var(--muted); font-size: 11.5px; }
.stoast.out { opacity: 0; transform: translateX(10px); }
@keyframes slidein { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.keyflash { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(6px); display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(8, 12, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; opacity: 0; transition: opacity 0.15s, transform 0.15s; }
.keyflash.on { opacity: 1; transform: translateX(-50%); }
.keyflash kbd { font-size: 17px; padding: 2px 9px; background: #8ff0bb; color: #032414; border-color: #2fd27f; }
.keyflash span { margin-left: 6px; font-size: 13px; color: #dfe7fb; }
.drop-hint { display: none; position: absolute; inset: 8px; border: 3px dashed var(--accent); border-radius: 10px; background: rgba(47, 210, 127, 0.15); align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #d0f7e2; pointer-events: none; }
.stage.drag .drop-hint { display: flex; }
.stage:not(.empty) { cursor: pointer; }

/* ---------- 再生コントロール ---------- */
.transport { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; flex: none; }
.tbtn { min-width: 36px; height: 34px; padding: 0 8px; border: 1px solid transparent; background: transparent; border-radius: 9px; font-size: 16px; color: var(--text); }
.tbtn:hover { background: #26324f; }
.tbtn.play { background: #26324f; min-width: 44px; font-size: 18px; }
.timecode { font: 600 13px ui-monospace, 'SF Mono', Menlo, monospace; color: #cfd9f2; margin-left: 8px; }
.speed { background: #0d1424; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

/* ---------- タイムライン ---------- */
.timeline-box { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 8px; flex: none; }
.tl-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
.tl-title { font-weight: 700; color: var(--text); }
.tl-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: -1px; }
.lg-made { background: #4c8dff; }
.lg-miss { border: 2px solid #4c8dff; }
.lg-tov { background: #ff6b6b; border-radius: 2px !important; }
.lg-foul { background: #ffd166; border-radius: 2px !important; }
.zbtn { padding: 2px 9px; border: 1px solid var(--line2); background: transparent; color: var(--muted); border-radius: 7px; font-size: 12px; }
.zbtn:hover { color: var(--text); background: #223058; }
.zbtn.on { background: #2a3a66; color: #fff; border-color: #4a5d92; }
#timeline { display: block; width: 100%; height: 122px; cursor: crosshair; touch-action: none; }
.tl-tip { position: absolute; z-index: 5; pointer-events: none; padding: 6px 10px; background: #0b1120; border: 1px solid var(--line2); border-radius: 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; }

/* ---------- 共通の部品 ---------- */
.card { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #18223b; margin-bottom: 12px; }
.card.info { border-left: 4px solid var(--info); }
.card.good { border-left: 4px solid var(--good); }
.card.warn { border-left: 4px solid var(--warn); }
.card.bad { border-left: 4px solid var(--bad); }
.sect { margin-bottom: 18px; }
.sect > h4, .sect > h4.row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 8px; color: #d6e0f8; letter-spacing: 0.02em; }
.pane-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.ph { font-size: 16px; }
.empty-note { padding: 14px; color: var(--dim); text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.callout { padding: 9px 12px; margin: 8px 0; border-radius: 10px; background: #1a2848; border: 1px solid #2e4278; font-size: 13px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.callout.bad { background: #341c26; border-color: #6d3040; }
.callout.warn { background: #3a3012; border-color: #7a6220; }
.note-card { padding: 10px 12px; border-radius: 10px; background: #131c33; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.note-card p { margin: 6px 0 0; }
.note-card > b, .note-card > h4 { color: var(--text); }
.q { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #2a3a66; color: #b8c8ee; font-size: 10px; font-weight: 700; cursor: help; vertical-align: 1px; }
.inl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
select, input[type=text], input[type=number], input[type=date] { background: #0d1424; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--text); }
select { padding-right: 4px; }
input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line2); border-radius: 8px; background: none; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
.seggroup { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg { padding: 5px 11px; border: 0; background: #131c33; color: var(--muted); font-size: 13px; font-weight: 600; border-right: 1px solid var(--line); }
.seg:last-child { border-right: 0; }
.seg:hover { background: #1e2b4d; color: var(--text); }
.seg.on { background: #2b3c6b; color: #fff; }
.seg.team.on { background: color-mix(in srgb, var(--tc, #4c8dff) 55%, #101828); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #223058; font-size: 12px; }
.scoreline { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; }
.scoreline b { font-size: 24px; font-variant-numeric: tabular-nums; }
.scoreline i { color: var(--dim); font-style: normal; }
.sl-team { font-weight: 700; padding-left: 8px; border-left: 4px solid var(--tc); }

/* ---------- テーブル ---------- */
.box-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #121a2e; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid #1f2a47; }
.tbl th { position: sticky; top: 0; background: #1a2440; color: var(--muted); font-size: 12px; font-weight: 700; user-select: none; }
.tbl th[data-act='sort'] { cursor: pointer; }
.tbl th[data-act='sort']:hover { color: #fff; }
.tbl th.sorted { color: var(--accent2); }
.tbl .l, .tbl th.l { text-align: left; }
.tbl tbody tr:hover { background: #18233f; }
.tbl small { display: block; color: var(--dim); font-size: 10.5px; font-weight: 400; line-height: 1.2; }
.tbl th small { display: inline; margin-left: 2px; }
.tbl .pnum { text-align: center; width: 34px; color: var(--muted); }
.tbl .pname { text-align: left; font-weight: 600; max-width: 8em; overflow: hidden; text-overflow: ellipsis; }
.tbl td.top { color: var(--accent2); font-weight: 800; }
.tbl td.warn { color: var(--warn); font-weight: 700; }
.tbl td.pos { color: var(--good); }
.tbl td.neg { color: var(--bad); }
.tbl .teamrow td { color: var(--dim); font-style: italic; }
.tbl .totrow td { font-weight: 800; background: #182240; border-top: 2px solid var(--line2); }
.tbl .act { width: 30px; text-align: center; padding: 2px; }
.tbl tr.grp td { background: #16203a; }
.tbl.scenes td.l small { max-width: 16em; white-space: normal; }
.demo-glow { animation: glow 0.9s ease-in-out 3; outline: 2px solid var(--accent); outline-offset: 1px; }
@keyframes glow { 0%, 100% { background: rgba(47, 210, 127, 0.05); } 50% { background: rgba(47, 210, 127, 0.35); } }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bar { position: relative; height: 8px; background: #1d2846; border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #5a7fd8, #7fb2ff); border-radius: 4px; }
.ppp { white-space: nowrap; }
.ppp .bar { display: inline-block; width: 70px; vertical-align: middle; margin-right: 8px; }
.ppp.good .bar > i { background: linear-gradient(90deg, #23b878, #3ddc97); }
.ppp.bad .bar > i { background: linear-gradient(90deg, #d24a55, #ff6b6b); }
.ppp.good b { color: var(--good); }
.ppp.bad b { color: var(--bad); }
.secondrow td { background: #141e38; }

/* ---------- タグ付けタブ ---------- */
.team-switch { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.team-btn { flex: 1; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 2px solid var(--line); background: #131c33; border-radius: 12px; font-weight: 700; color: var(--muted); text-align: left; }
.team-btn i { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: none; }
.team-btn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-btn em { font-style: normal; font-size: 11px; padding: 0 6px; border-radius: 6px; background: #223058; color: var(--muted); }
.team-btn.on { border-color: var(--tc); color: #fff; background: color-mix(in srgb, var(--tc) 22%, #131c33); }
.vkey { flex: none; }
.pending { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 46px; padding: 8px 12px; border: 1px dashed var(--line2); border-radius: 12px; margin-bottom: 10px; background: #111a30; color: var(--muted); }
.pending.active { border-style: solid; border-color: var(--accent); background: #0f2c20; color: #d3fbe6; }
.pd-num, .pd-ev { padding: 3px 12px; border-radius: 9px; font-weight: 800; font-size: 16px; background: #123a28; color: #b9f5d6; }
.pd-ev { background: #14324a; color: #bfe6ff; }
.pd-plus { color: var(--dim); font-style: normal; }
.pd-hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.caret { display: inline-block; width: 2px; height: 1em; background: currentColor; margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.followbar { padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; background: #12324a; border: 1px solid #2f6e9e; animation: slidedown 0.2s ease; }
.followbar.sub { background: #3a2a10; border-color: #8a6420; }
@keyframes slidedown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.followbar .fq { margin-bottom: 6px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.roster { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.pbtn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border: 1px solid var(--line2); background: #172140; border-radius: 10px; color: var(--text); }
.pbtn b { min-width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--tc, #2a3a66); color: #fff; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.pbtn span { font-size: 12.5px; max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbtn:hover { background: #22305a; border-color: #4a5d92; }
.pbtn.on { border-color: var(--accent); background: #123a28; box-shadow: 0 0 0 2px rgba(47, 210, 127, 0.35); }
.pbtn.sm { padding: 3px 8px 3px 4px; }
.pbtn.sm b { min-width: 24px; height: 24px; font-size: 13px; }
.pbtn.team b { background: #46506b; }
.addp { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; }
.numinput { width: 70px; padding: 5px 8px; }

/* ---------- 集計 ---------- */

.qtbl th, .qtbl td { text-align: center; }
.matrix td { text-align: center; min-width: 40px; }
.matrix th { text-align: center; }
.matrix th.l { text-align: left; }
.bd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

/* ---------- ショット ---------- */

/* ---------- アドバイス ---------- */
.card.summary { padding: 14px 16px; background: linear-gradient(135deg, #1b2a52, #17223f); border: 1px solid #34487f; }

.sum-head { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.sum-list { margin: 6px 0 10px; padding-left: 18px; color: #d3def5; }

.fchips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #223058; font-size: 12.5px; }

.acard.bad { border-left-color: var(--bad); }

.evid { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.evid .ev { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 8px; border-radius: 6px; background: #0f1830; border: 1px solid var(--line); font-size: 12px; }

/* ---------- ハイライト ---------- */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
.preset { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 10px; border: 1px solid var(--line2); background: #151e38; border-radius: 10px; }

.preset:hover { background: #1f2b4f; }

.hl-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }

.progress i { display: block; height: 100%; background: linear-gradient(90deg, #23b878, #3ddc97); transition: width 0.2s; }
.result .resvid { width: 100%; max-height: 260px; margin-top: 8px; border-radius: 10px; background: #000; }
.result a.btn { text-decoration: none; }
.cliplist { display: flex; flex-direction: column; gap: 6px; }
.clip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: #131c33; }

.cn { width: 22px; text-align: center; color: var(--dim); font-weight: 700; font-size: 12px; }
.cdot { width: 8px; height: 30px; border-radius: 4px; flex: none; }
.cmain { flex: 1; min-width: 0; }
.clabel { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ctools { display: flex; align-items: center; gap: 2px; flex: none; }
.trim { display: inline-flex; align-items: center; margin: 0 2px; border: 1px solid var(--line); border-radius: 8px; }
.trim small { color: var(--dim); font-size: 10.5px; }

/* ---------- 失点シーンの見直し ---------- */
.preset.feature { border-color: #7a3a4a; background: #2a1822; }
.preset.feature b::before { content: '★ '; color: var(--warn); }
.preset.feature:hover { background: #351f2b; }
.preset.feature.on { border-color: var(--accent); background: #123a28; }
.cd-summary { padding: 12px 14px; border: 1px solid #6d3040; border-radius: 12px; background: #24161f; margin-bottom: 12px; }
.cd-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cd-rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
.cd-row { display: grid; grid-template-columns: minmax(150px, 1.3fr) 2fr 48px 104px; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; background: #171f37; text-align: left; color: var(--text); }
.cd-row:hover { background: #202a4a; }

.cd-l { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.cd-l i { width: 10px; height: 10px; border-radius: 3px; background: var(--cc); flex: none; }
.cd-bar { height: 9px; background: #0f1830; border-radius: 5px; overflow: hidden; }
.cd-bar i { display: block; height: 100%; background: var(--cc); border-radius: 5px; opacity: 0.9; }
.cd-row b, .cd-line b { text-align: right; }
.cd-row small, .cd-line small { color: var(--dim); font-size: 11.5px; }
.cd-lines { display: flex; flex-direction: column; gap: 5px; }
.cd-line { display: grid; grid-template-columns: minmax(150px, 1.3fr) 2fr 48px 96px 28px; gap: 10px; align-items: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 9px; background: #131c33; }
.cd-line .bar i { background: var(--cc); }
.cchip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #101522; background: var(--cc); }
.pts-badge { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 6px; background: #4a1d28; color: #ff9aa8; font-weight: 800; font-size: 12px; }
.ctext { color: #c9d6f5; }
.clip { flex-direction: column; align-items: stretch; gap: 6px; }
.crow1 { display: flex; align-items: center; gap: 8px; }
.crow2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-left: 32px; }

}

/* ---------- フォーム・設定 ---------- */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
.fgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.fgrid label.wide { grid-column: 1 / -1; }
.fgrid input, .fgrid select { width: 100%; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.teamcfg { padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #121a2e; }
.tnameinput { flex: 1; font-weight: 700; }
.rosterbl td, .rosterbl th { padding: 3px 6px; }
.rosterbl .nameinput { width: 100%; }
.rosterbl { margin: 8px 0; }
.periods { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; gap: 8px; }
.prow b { width: 34px; }
.logtbl td { padding: 4px 8px; }
.logtbl td.l { max-width: 20em; overflow: hidden; text-overflow: ellipsis; }

/* ---------- ダイアログ ---------- */
dialog.dlg { border: 1px solid var(--line2); border-radius: 16px; background: #141c33; color: var(--text); padding: 0; width: min(560px, calc(100vw - 24px)); box-shadow: var(--shadow); }
dialog.dlg::backdrop { background: rgba(3, 6, 14, 0.66); backdrop-filter: blur(2px); }
.dlg-body { padding: 18px 20px; }
.dlg-body h3 { margin-bottom: 10px; font-size: 17px; }
.dlg-msg { color: #ccd7f2; margin: 6px 0 14px; }
.dlg-actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 18px; margin-top: 10px; font-size: 13px; }
.help-grid > div { display: flex; align-items: center; gap: 10px; }
.hk { min-width: 5.6em; display: inline-flex; gap: 2px; }

/* ---------- 通知 ---------- */
.toast-zone { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 9px 16px; background: #0b1120; border: 1px solid var(--line2); border-left: 4px solid var(--info); border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; max-width: min(560px, 92vw); transition: opacity 0.45s, transform 0.45s; animation: slidedown 0.2s ease; }
.toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(-6px); }

/* ---------- 自動デモ ---------- */
.demo-layer { position: fixed; inset: 0; z-index: 9400; pointer-events: none; }
.ghost-cursor { position: fixed; left: 0; top: 0; width: 30px; height: 30px; margin: -3px 0 0 -3px; opacity: 0; z-index: 9500; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)); transition: left 0.75s cubic-bezier(0.45, 0, 0.2, 1), top 0.75s cubic-bezier(0.45, 0, 0.2, 1), opacity 0.3s, transform 0.15s; }

<div class="app" id="app">

<script>
/* サッカー分析ラボ - 共通ユーティリティ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = (SL.util = {});

  U.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  U.$ = (sel, root) => (root || document).querySelector(sel);
  U.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  U.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  U.sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);

  /** 秒 → "m:ss" / "h:mm:ss"（tenth=true で 0.1 秒まで） */
  U.fmtTime = (sec, tenth) => {
    if (!isFinite(sec)) sec = 0;
    sec = Math.max(0, sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const base = (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
    return tenth ? base + '.' + Math.floor((sec % 1) * 10) : base;
  };

  /** "1:23.4" / "83.4" / "1:02:03" → 秒。読めなければ NaN */
  U.parseTime = (str) => {
    const s = String(str || '').trim();
    if (!s) return NaN;
    const parts = s.split(':').map(Number);
    if (parts.some((n) => !isFinite(n))) return NaN;
    return parts.reduce((acc, n) => acc * 60 + n, 0);
  };

  U.pct = (n, d, dp) => (d > 0 ? ((100 * n) / d).toFixed(dp == null ? 1 : dp) + '%' : '—');
  U.fix = (v, dp) => (v == null || !isFinite(v) ? '—' : v.toFixed(dp == null ? 1 : dp));
  U.ratio = (n, d) => (d > 0 ? n / d : null);

  /** シード付き乱数（mulberry32） */
  U.rng = (seed) => {
    let a = seed >>> 0;
    return () => {
      a += 0x6d2b79f5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  U.debounce = (fn, ms) => {
    let timer = null;
    const wrapped = (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), ms);
    };
    wrapped.flush = (...args) => {
      clearTimeout(timer);
      fn(...args);
    };
    return wrapped;
  };

  /** 次のアニメーションフレームで1回だけ実行する */
  U.rafOnce = (fn) => {
    let queued = false;
    return () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        fn();
      });
    };
  };

  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  U.download = (data, filename, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  };

  U.csvCell = (v) => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };

  U.today = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /** 画面右下の小さな通知 */
  U.toast = (msg, kind) => {
    if (typeof document === 'undefined') return;
    let zone = document.getElementById('toastZone');
    if (!zone) {
      zone = document.createElement('div');
      zone.id = 'toastZone';
      zone.className = 'toast-zone';
      document.body.appendChild(zone);
    }
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    zone.appendChild(el);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3100);
  };
})();

  C.sceneShort = (id) => C.sceneOf(id).short;
  C.isSetPiece = (id) => !!C.sceneOf(id).set;

  /* ---------- ボールロスト／ファウル／体の部位 ---------- */
  C.TOV_TYPES = [

  C.tovLabel = (id) => (C.TOV_TYPES.find((t) => t.id === id) || C.TOV_TYPES[C.TOV_TYPES.length - 1]).label;
  C.FOUL_TYPES = [
    { id: 'contact', label: '接触・タックル', drill: 'discipline' },
    { id: 'hold', label: '押す・引っ張る', drill: 'discipline' },
    { id: 'trip', label: '足をかける・遅れて入る', drill: 'oneonone' },
    { id: 'hand', label: 'ハンド', drill: 'boxdef' },
    { id: 'danger', label: '危険なプレー', drill: 'discipline' },
    { id: 'other', label: 'その他・不明', drill: 'discipline' },
  ];
  C.foulLabel = (id) => (C.FOUL_TYPES.find((t) => t.id === id) || C.FOUL_TYPES[C.FOUL_TYPES.length - 1]).label;
  C.BODY = [
    { id: 'foot', label: '足' },
    { id: 'head', label: 'ヘディング' },
  ];

  /* ---------- ピッチと座標 ----------
   * ピッチ座標 (px, py)：m。px = 自陣ゴールライン→敵ゴールライン (0〜105)、
   * py = 攻める向きに対して左端→右端 (0〜68)。どちらのチームも「右へ攻める」向きにそろえる。
   * シュート座標 (sx, sy)：sx = ゴール中央からの横ずれ (負=左)、sy = ゴールラインからの距離。 */
  C.PITCH = { L: 105, W: 68, boxD: 16.5, boxHalf: 20.16, sixD: 5.5, sixHalf: 9.16, spot: 11, goalHalf: 3.66, arcR: 9.15 };
  C.toShot = (px, py) => ({ sx: py - C.PITCH.W / 2, sy: C.PITCH.L - px });
  C.fromShot = (sx, sy) => ({ px: C.PITCH.L - sy, py: sx + C.PITCH.W / 2 });
  /** イベントのシュート位置 {sx, sy}（無ければ null） */
  C.shotPos = (e) => {
    if (e.px != null && e.py != null) return C.toShot(e.px, e.py);
    return null;
  };

  /* ---------- シュートゾーン ---------- */
  C.ZONES = [
    { id: 'six', label: 'ゴールエリア内', grp: 'box' },
    { id: 'boxC', label: 'PA内・正面', grp: 'box' },
    { id: 'boxL', label: 'PA内・左', grp: 'box' },
    { id: 'boxR', label: 'PA内・右', grp: 'box' },
    { id: 'edgeC', label: 'PA外・正面（〜25m）', grp: 'edge' },
    { id: 'edgeL', label: 'PA外・左', grp: 'edge' },
    { id: 'edgeR', label: 'PA外・右', grp: 'edge' },
    { id: 'wideL', label: 'サイド・左（角度なし）', grp: 'wide' },
    { id: 'wideR', label: 'サイド・右（角度なし）', grp: 'wide' },
    { id: 'far', label: 'ロングシュート（25m〜）', grp: 'far' },
  ];
  C.ZONE_GROUPS = [
    { id: 'box', label: 'ペナルティエリア内' },
    { id: 'edge', label: 'PAの外〜25m' },
    { id: 'wide', label: 'サイドの深い位置（角度が狭い）' },
    { id: 'far', label: 'ロングシュート（25m以遠）' },
  ];
  C.zoneLabel = (id) => (C.ZONES.find((z) => z.id === id) || { label: '位置未入力' }).label;
  C.zoneGroup = (id) => (C.ZONES.find((z) => z.id === id) || {}).grp || null;
  C.zoneFor = (sx, sy) => {
    const P = C.PITCH;
    const ax = Math.abs(sx);
    if (sy > 25) return 'far';
    if (ax > P.boxHalf) return sx < 0 ? 'wideL' : 'wideR';
    if (sy <= P.boxD) {
      if (ax <= P.sixHalf) return sy <= P.sixD ? 'six' : 'boxC';
      return sx < 0 ? 'boxL' : 'boxR';
    }
    if (ax <= P.sixHalf) return 'edgeC';
    return sx < 0 ? 'edgeL' : 'edgeR';
  };

  /* ---------- 場所（ボールロスト・ファウルなど） ---------- */
  C.FIELD_ZONES = [
    { id: 'ownBox', label: '自陣ペナルティエリア内', short: '自陣PA内' },
    { id: 'def3', label: '自陣ゴール前（〜3分の1）', short: '自陣' },
    { id: 'mid3', label: '中盤', short: '中盤' },
    { id: 'att3', label: '敵陣（最終ライン付近まで）', short: '敵陣' },

  /* ---------- 前半・後半 ---------- */

  /* ---------- レベル別の目安（参考値・1チーム90分あたり） ---------- */
  C.LEVELS = {
    pro: { name: 'プロ・社会人トップ級', shotAcc: 0.34, conv: 0.1, xgShot: 0.11, fouls90: 12, yc90: 1.9, off90: 2.2, corner90: 5, farMax: 0.35, setGoal: 0.28 },

  };

  /* ---------- 初期状態 ---------- */
  SL.defaultState = () => ({
    v: 1,
    title: '',
    date: U.today(),
    video: { name: '', size: 0, duration: 0 },

      H: { name: '自チーム', color: '#3d7bff', roster: [] },
      A: { name: '相手チーム', color: '#ff5a5a', roster: [] },
    },
    periods: [{ q: 1, start: 0 }],
    events: [],
    notes: {}, // ハイライトのクリップごとのコメント（key → 文字）
    nextId: 1,
    cfg: { level: 'club', pre: 8, post: 4, delay: 1.0, targetSec: 0, halfMin: 45, possH: null },
  });
  const CFG_DEFAULT = () => SL.defaultState().cfg;

  /* ---------- ストア ---------- */
  const KEY_USER = 'sll.user.v1';
  const KEY_BACKUP = 'sll.backup.v1';
  const idNum = (id) => parseInt(String(id).slice(1), 10) || 0;

  const store = (SL.store = {
    state: null,
    mode: 'user', // 'user' | 'sample'
    hist: [],
    fut: [],
    _l: new Set(),
    _saveTimer: null,

    on(fn) {
      this._l.add(fn);
      return () => this._l.delete(fn);
    },
    emit(kind) {
      this._l.forEach((fn) => {
        try {
          fn(kind || 'all');
        } catch (e) {
          console.error(e);
        }
      });
    },

    /* --- 永続化 --- */
    readUser() {
      try {
        const raw = typeof localStorage !== 'undefined' && localStorage.getItem(KEY_USER);
        if (!raw) return null;
        return store.normalize(JSON.parse(raw));
      } catch (e) {
        return null;
      }
    },
    hasUserWork() {
      const s = store.readUser();
      return !!(s && (s.events.length || s.teams.H.roster.length || s.video.name));
    },
    save() {
      if (store.mode !== 'user') return;
      clearTimeout(store._saveTimer);
      store._saveTimer = setTimeout(store.saveNow, 250);
    },
    saveNow() {
      if (store.mode !== 'user') return;
      try {
        localStorage.setItem(KEY_USER, JSON.stringify(store.state));
      } catch (e) {
        console.warn('保存できませんでした', e);
        if (!store._warnedSave && typeof document !== 'undefined') {
          store._warnedSave = true;
          U.toast('このブラウザの設定では自動保存ができません。「設定」タブの「分析データを保存（JSON）」で保存してください', 'bad');
        }
      }
    },
    backupUser() {
      try {
        const raw = localStorage.getItem(KEY_USER);
        if (raw) localStorage.setItem(KEY_BACKUP, raw);
      } catch (e) {}
    },
    normalize(s) {
      const d = SL.defaultState();
      const out = Object.assign(d, s || {});
      out.teams = {
        H: Object.assign(d.teams.H, (s && s.teams && s.teams.H) || {}),
        A: Object.assign(d.teams.A, (s && s.teams && s.teams.A) || {}),
      };
      out.teams.H.roster = out.teams.H.roster || [];
      out.teams.A.roster = out.teams.A.roster || [];
      out.video = Object.assign({ name: '', size: 0, duration: 0 }, (s && s.video) || {});
      out.cfg = Object.assign(CFG_DEFAULT(), (s && s.cfg) || {});
      out.periods = Array.isArray(out.periods) && out.periods.length ? out.periods : [{ q: 1, start: 0 }];
      out.events = Array.isArray(out.events) ? out.events : [];
      out.notes = out.notes && typeof out.notes === 'object' && !Array.isArray(out.notes) ? out.notes : {};
      out.events.sort((a, b) => a.t - b.t || idNum(a.id) - idNum(b.id));
      let max = 0;
      out.events.forEach((e) => (max = Math.max(max, idNum(e.id))));
      out.nextId = Math.max(out.nextId || 1, max + 1);
      return out;
    },

    /* --- 状態の入れ替え --- */
    useUser() {
      store.mode = 'user';
      store.state = store.readUser() || SL.defaultState();
      store.hist = [];
      store.fut = [];
      store.emit('all');
    },
    useSample(sampleState) {
      store.mode = 'sample';
      store.state = store.normalize(JSON.parse(JSON.stringify(sampleState)));
      store.hist = [];
      store.fut = [];
      store.emit('all');
    },
    /** 新しい自分の分析を始める（名簿は引き継ぐ） */
    newUserProject(opts) {
      const prev = store.mode === 'user' ? store.state : store.readUser();
      const s = SL.defaultState();
      if (prev) {
        s.teams.H = JSON.parse(JSON.stringify(prev.teams.H));
        s.teams.A = { name: prev.teams.A.name, color: prev.teams.A.color, roster: [] };
        s.cfg = Object.assign({}, prev.cfg, { possH: null });
      }
      Object.assign(s, opts || {});
      store.mode = 'user';
      store.state = s;
      store.hist = [];
      store.fut = [];
      store.saveNow();
      store.emit('all');
    },
    exportJSON() {
      return JSON.stringify({ app: 'soccer-lab', ...store.state }, null, 1);
    },
    importJSON(text) {
      const obj = JSON.parse(text);
      if (!obj || !Array.isArray(obj.events)) throw new Error('この形式のファイルではありません');
      store.mode = 'user';
      store.state = store.normalize(obj);
      store.hist = [];
      store.fut = [];
      store.saveNow();
      store.emit('all');
    },

    /* --- 取り消し／やり直し --- */
    _snap() {
      const s = store.state;
      return JSON.stringify({ events: s.events, periods: s.periods, teams: s.teams, nextId: s.nextId });
    },
    _restore(str) {
      const o = JSON.parse(str);
      Object.assign(store.state, o);
    },
    pushHist() {
      store.hist.push(store._snap());
      if (store.hist.length > 150) store.hist.shift();
      store.fut = [];
    },
    canUndo() {
      return store.hist.length > 0;
    },
    undo() {
      if (!store.hist.length) return false;
      store.fut.push(store._snap());
      store._restore(store.hist.pop());
      store.save();
      store.emit('events');
      return true;
    },
    redo() {
      if (!store.fut.length) return false;
      store.hist.push(store._snap());
      store._restore(store.fut.pop());
      store.save();
      store.emit('events');
      return true;
    },

    /* --- イベント操作 --- */
    _insert(ev) {
      const list = store.state.events;
      let lo = 0,
        hi = list.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (list[mid].t <= ev.t) lo = mid + 1;
        else hi = mid;
      }
      list.splice(lo, 0, ev);
    },
    addEvent(ev, opts) {
      if (!(opts && opts.noHist)) store.pushHist();
      ev = Object.assign({}, ev);
      ev.id = 'e' + store.state.nextId++;
      ev.t = Math.round(ev.t * 10) / 10;
      store._insert(ev);
      store.save();
      store.emit('events');
      return ev;
    },
    getEvent(id) {
      return store.state.events.find((e) => e.id === id);
    },
    updateEvent(id, patch, opts) {
      const e = store.getEvent(id);
      if (!e) return null;
      if (!(opts && opts.noHist)) store.pushHist();
      Object.assign(e, patch);
      Object.keys(patch).forEach((k) => {
        if (patch[k] === undefined) delete e[k];
      });
      if (patch.t != null) {
        e.t = Math.round(e.t * 10) / 10;
        const list = store.state.events;
        list.splice(list.indexOf(e), 1);
        store._insert(e);
      }
      store.save();
      store.emit('events');
      return e;
    },
    removeEvent(id) {
      const list = store.state.events;
      const i = list.findIndex((e) => e.id === id);
      if (i < 0) return false;
      store.pushHist();
      list.splice(i, 1);
      store.save();
      store.emit('events');
      return true;
    },
    replaceEvents(list, opts) {
      if (!(opts && opts.noHist)) store.pushHist();
      store.state.events = list.slice();
      store.state.events.sort((a, b) => a.t - b.t || idNum(a.id) - idNum(b.id));
      let max = 0;
      list.forEach((e) => (max = Math.max(max, idNum(e.id))));
      store.state.nextId = Math.max(store.state.nextId, max + 1);
      store.save();
      store.emit('events');
    },
    clearEvents() {
      store.pushHist();
      store.state.events = [];
      store.save();
      store.emit('events');
    },

    /* --- メタ情報（チーム名・名簿・ハーフなど） --- */
    patch(patchFn, kind) {
      patchFn(store.state);
      store.save();
      store.emit(kind || 'meta');
    },
    roster(team) {
      return store.state.teams[team].roster;
    },
    findPlayer(team, num) {
      return store.state.teams[team].roster.find((p) => p.num === num) || null;
    },
    ensurePlayer(team, num) {
      let p = store.findPlayer(team, num);
      if (!p) {
        p = { num, name: '', pos: num === 1 ? 'GK' : '' };
        store.state.teams[team].roster.push(p);
        store.state.teams[team].roster.sort((a, b) => a.num - b.num);
        store.save();
        store.emit('meta');
      }
      return p;
    },
    playerName(team, num) {
      if (num === 0) return 'チーム';
      const p = store.findPlayer(team, num);
      return p && p.name ? p.name : '';
    },
    playerLabel(team, num) {
      if (num == null) return '';
      if (num === 0) return 'チーム';
      const n = store.playerName(team, num);
      return '#' + num + (n ? ' ' + n : '');
    },
    teamName(team) {
      return store.state.teams[team].name || (team === 'H' ? '自チーム' : '相手');
    },
    /** そのチームのGKの背番号（名簿の役割がGKの選手。なければ #1） */
    gkNum(team) {
      const r = store.state.teams[team].roster;
      const g = r.find((p) => p.pos === 'GK');
      if (g) return g.num;
      return r.some((p) => p.num === 1) ? 1 : null;
    },
    setPeriodStart(q, start) {
      store.pushHist();
      const ps = store.state.periods.filter((p) => p.q !== q);
      ps.push({ q, start: Math.max(0, Math.round(start * 10) / 10) });
      ps.sort((a, b) => a.q - b.q);
      store.state.periods = ps;
      store.save();
      store.emit('meta');
    },
    removePeriod(q) {
      if (q === 1) return;
      store.pushHist();
      store.state.periods = store.state.periods.filter((p) => p.q !== q);
      store.save();
      store.emit('meta');
    },
  });

  store.state = SL.defaultState();
})();

</script>
<script>
/* サッカー分析ラボ - xG（ゴール期待値）
 * プロの分析（Opta / StatsBomb など）が使う「そのシュートが決まる確率」を、
 * 位置（ゴールまでの距離と、ゴールが見える角度）・ヘディング・攻撃の型だけで概算する簡易モデル。
 * 守備者やGKの位置までは見られないので、あくまで目安です（本物のxGとは数値がずれます）。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const X = (SL.xg = {});

  const GH = 3.66; // ゴール幅の半分（m）
  // 距離・見込み角・log(距離) のロジスティック（代表的な位置のxG目安に当てはめた係数）
  const W = [-3.993, -0.1468, 2.5523, 1.0955];

  X.PK = 0.76;
  X.BIG = 0.3; // これ以上を「決定機」とみなす
  X.HEAD = 0.6;
  X.SCENE_MULT = { build: 1, counter: 1.1, press: 1.1, cross: 0.9, through: 1.15, long: 1.05, solo: 1, corner: 0.8, fk: 1, throw: 0.8, pk: 1 };
  // 位置が入っていないシュートに使う、ゾーンごとの平均的なxG
  X.ZONE_DEFAULT = { six: 0.42, boxC: 0.2, boxL: 0.09, boxR: 0.09, edgeC: 0.06, edgeL: 0.05, edgeR: 0.05, wideL: 0.03, wideR: 0.03, far: 0.03 };
  X.UNKNOWN = 0.09;

  const sig = (z) => 1 / (1 + Math.exp(-z));

  /** 足で打った場合の xG（sx=ゴール中央からの横ずれ, sy=ゴールラインからの距離） */
  X.at = (sx, sy) => {
    const y = Math.max(0.6, sy);
    const d = Math.hypot(sx, y);
    const theta = Math.abs(Math.atan2(GH - sx, y) - Math.atan2(-GH - sx, y));
    return sig(W[0] + W[1] * d + W[2] * theta + W[3] * Math.log(d));
  };

  /** シュートイベントの xG。{ xg, est } （est=true は位置が無く平均値で概算） */
  X.detail = (e) => {
    if (e.type === 'pkg' || e.type === 'pkx' || e.scene === 'pk') return { xg: X.PK, est: false };
    const mult = X.SCENE_MULT[e.scene] || 1;
    const head = e.body === 'head' ? X.HEAD : 1;
    let base;
    let est = false;
    if (e.px != null && e.py != null) {
      const p = SL.C.toShot(e.px, e.py);
      base = X.at(p.sx, p.sy);
    } else if (e.zone && X.ZONE_DEFAULT[e.zone] != null) {
      base = X.ZONE_DEFAULT[e.zone];
      est = true;
    } else {
      base = X.UNKNOWN;
      est = true;
    }
    return { xg: Math.min(0.95, Math.max(0.005, base * mult * head)), est };
  };
  X.of = (e) => X.detail(e).xg;
})();

</script>
<script>
/* サッカー分析ラボ - タグ列から「得点推移」「試合時間」「アシストの対応」「押し込んだ時間帯」などを導く */
(function () {
  const SL = (window.SL = window.SL || {});
  const C = SL.C;
  const D = (SL.derive = {});

  const other = (t) => (t === 'H' ? 'A' : 'H');
  D.other = other;

  D.isShot = (e) => C.isShot(e);
  D.isGoal = (e) => e.type === 'goal' || e.type === 'pkg';
  /** 得点が入るイベント（オウンゴールを含む） */
  D.isScore = (e) => e.type === 'goal' || e.type === 'pkg' || e.type === 'og';
  /** 得点が付くチーム（オウンゴールは相手チームの得点） */
  D.creditTeam = (e) => (e.type === 'og' ? other(e.team) : D.isGoal(e) ? e.team : null);

  /* ---------- 前半・後半／試合時間 ---------- */
  D.periodAt = (periods, t) => {
    let q = 1;
    for (const p of periods) if (p.start <= t + 1e-6) q = p.q;
    return q;
  };
  D.qLabel = (q) => C.periodLabel(q);
  D.periodStart = (periods, q) => {
    const p = periods.find((x) => x.q === q);
    return p ? p.start : 0;
  };
  /** 試合時間の表示（前半12分 → "12'"、後半3分（20分ハーフ）→ "23'"、45分超 → "45+2'"） */
  D.clock = (state, t) => {
    const periods = state.periods || [{ q: 1, start: 0 }];
    const half = (state.cfg && state.cfg.halfMin) || 45;
    const q = D.periodAt(periods, t);
    const el = Math.max(0, t - D.periodStart(periods, q));
    const m = Math.floor(el / 60) + 1;
    const len = q <= 2 ? half : 15;
    const off = q === 1 ? 0 : q === 2 ? half : q === 3 ? half * 2 : half * 2 + 15;
    if (m > len) return { q, min: off + len, extra: m - len, label: `${off + len}+${m - len}'` };
    return { q, min: off + m, extra: 0, label: `${off + m}'` };
  };
  D.minuteLabel = (state, t) => D.clock(state, t).label;
  /** "前半 12'" */
  D.clockFull = (state, t) => {
    const c = D.clock(state, t);
    return C.periodLabel(c.q) + ' ' + c.label;
  };

  /* ---------- 得点推移 ---------- */
  D.scoreTimeline = (events) => {
    let H = 0;
    let A = 0;
    const tl = [{ t: 0, H: 0, A: 0 }];
    for (const e of events) {
      const team = D.creditTeam(e);
      if (!team) continue;
      if (team === 'H') H++;
      else A++;
      tl.push({ t: e.t, H, A, team, id: e.id, type: e.type });
    }
    return tl;
  };
  D.scoreAt = (tl, t) => {
    let lo = 0;
    let hi = tl.length - 1;
    let ans = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (tl[mid].t <= t + 1e-6) {
        ans = mid;
        lo = mid + 1;
      } else hi = mid - 1;
    }
    return tl[ans];
  };
  D.flowSummary = (tl) => {
    let lead = 0;
    let changes = 0;
    let ties = 0;
    let maxH = 0;
    let maxA = 0;
    for (let i = 1; i < tl.length; i++) {
      const s = tl[i];
      const d = s.H - s.A;
      const l = d > 0 ? 1 : d < 0 ? -1 : 0;
      if (l === 0) ties++;
      if (l !== 0 && lead !== 0 && l !== lead) changes++;
      if (l !== 0) lead = l;
      maxH = Math.max(maxH, d);
      maxA = Math.max(maxA, -d);
    }
    return { changes, ties, maxLeadH: maxH, maxLeadA: maxA, first: tl.length > 1 ? tl[1] : null };
  };

  /* ---------- アシスト／キーパスとシュートの対応づけ ----------
   * ev.for（シュートのid）があればそれを使う。無ければ「同じチームの近い時刻のシュート」を探す。 */
  D.linkPasses = (events) => {
    const map = new Map();
    const used = new Set();
    const byId = new Map();
    events.forEach((e) => byId.set(e.id, e));
    const passes = events.filter((e) => e.type === 'ast' || e.type === 'kp');
    // 明示的な対応を先に確定
    for (const a of passes) {
      if (a.for && byId.has(a.for) && C.isShot(byId.get(a.for))) {
        map.set(a.id, byId.get(a.for));
        used.add(a.for);
      }
    }
    for (const a of passes) {
      if (map.has(a.id)) continue;
      let best = null;
      let bd = 1e9;
      for (const s of events) {
        if (!C.isShot(s) || s.team !== a.team || s.type === 'pkg' || s.type === 'pkx' || used.has(s.id)) continue;
        const dt = a.t - s.t; // 正: パスのタグがシュートより後
        if (dt > 20 || dt < -8) continue;
        if (a.type === 'ast' && !D.isGoal(s)) continue;
        const dist = dt >= 0 ? dt : -dt * 2; // パスが先に付いた場合は少し不利にする
        if (dist < bd) {
          bd = dist;
          best = s;
        }
      }
      if (best) {
        map.set(a.id, best);
        used.add(best.id);
      }
    }
    return map;
  };

  /* ---------- 押し込んだ時間帯（短い間にシュートが続いた区間） ---------- */
  D.spells = (events, minShots, windowSec) => {
    minShots = minShots || 3;
    windowSec = windowSec || 240;
    const out = [];
    for (const team of ['H', 'A']) {
      const shots = events.filter((e) => e.team === team && C.isShot(e));
      let i = 0;
      while (i < shots.length) {
        let j = i;
        while (j + 1 < shots.length && shots[j + 1].t - shots[j].t <= windowSec / 2) j++;
        if (shots[j].t - shots[i].t <= windowSec && j - i + 1 >= minShots) {
          out.push({ team, t0: shots[i].t, t1: shots[j].t, n: j - i + 1, goals: shots.slice(i, j + 1).filter(D.isGoal).length });
          i = j + 1;
        } else i++;
      }
    }
    return out.sort((a, b) => a.t0 - b.t0);
  };
})();

</script>
<script>
/* サッカー分析ラボ - 集計（個人成績・チーム比較・攻撃の型別・ボールロスト・ファウル・セットプレー・xG）
 * 指標の考え方：Opta / StatsBomb / Wyscout などが公開している基本指標（シュート、枠内、xG、xA、
 * キーパス、タックル、インターセプト、ファウル、カード）と、Hudl Sportscode のタグ付け分析（場面別に見る）に倣っています。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const D = SL.derive;
  const C = SL.C;
  const X = SL.xg;
  const S = (SL.stats = {});

  const TEAMS = ['H', 'A'];
  const div = (n, d) => (d > 0 ? n / d : null);
  const other = D.other;

  function newLine(team, num) {
    return {
      team, num,
      goals: 0, pkGoals: 0, pkTaken: 0, shots: 0, sot: 0, soff: 0, blk: 0, xg: 0, npxg: 0, big: 0, bigGoals: 0,
      ast: 0, kp: 0, xa: 0, tkl: 0, itc: 0, clr: 0, ck: 0, tov: 0, foul: 0, fouled: 0, yc: 0, rc: 0, off: 0, og: 0,
      saves: 0, faced: 0, ga: 0,
    };
  }
  const KEYS = ['goals', 'pkGoals', 'pkTaken', 'shots', 'sot', 'soff', 'blk', 'xg', 'npxg', 'big', 'bigGoals', 'ast', 'kp', 'xa', 'tkl', 'itc', 'clr', 'ck', 'tov', 'foul', 'fouled', 'yc', 'rc', 'off', 'og', 'saves', 'faced', 'ga'];

  function decorate(L) {
    L.shotAcc = div(L.sot, L.shots);
    L.conv = div(L.goals, L.shots);
    L.xgShot = div(L.xg, L.shots);
    L.xgDiff = L.goals - L.xg; // + なら期待以上に決めた
    L.ga2 = L.goals + L.ast; // G+A
    L.xgi = L.xg + L.xa; // xG+xA
    L.def = L.tkl + L.itc + L.clr; // 守備アクション
    L.savePct = div(L.saves, L.faced);
    return L;
  }

  /** そのチームのGK（役割がGKの選手。いなければ #1） */
  S.gkOf = (state, team) => {
    const r = state.teams[team].roster || [];
    const g = r.find((p) => p.pos === 'GK');
    if (g) return g.num;
    return r.some((p) => p.num === 1) ? 1 : null;
  };

  /* ---------- メイン ---------- */
  /** state.events を集計する。opts.q を渡すとその前半／後半だけ */
  S.compute = (state, opts) => {
    opts = opts || {};
    const periods = state.periods || [{ q: 1, start: 0 }];
    let events = state.events.filter((e) => e.type !== 'note' && (e.team === 'H' || e.team === 'A'));
    if (opts.q) events = events.filter((e) => D.periodAt(periods, e.t) === opts.q);
    const half = (state.cfg && state.cfg.halfMin) || 45;

    const maps = { H: new Map(), A: new Map() };
    const get = (team, num) => {
      const k = num == null ? 0 : num;
      if (!maps[team].has(k)) maps[team].set(k, newLine(team, k));
      return maps[team].get(k);
    };
    const link = D.linkPasses(events);
    const xgOf = new Map();
    events.forEach((e) => {
      if (C.isShot(e)) xgOf.set(e.id, X.detail(e));
    });

    for (const e of events) {
      const L = get(e.team, e.num);
      switch (e.type) {
        case 'goal':
        case 'pkg':
        case 'sot':
        case 'soff':
        case 'sblk':
        case 'pkx': {
          const d = xgOf.get(e.id);
          const isPk = e.type === 'pkg' || e.type === 'pkx';
          L.shots++;
          L.xg += d.xg;
          if (!isPk) L.npxg += d.xg;
          if (d.xg >= X.BIG && !isPk) L.big++;
          if (isPk) L.pkTaken++;
          if (D.isGoal(e)) {
            L.goals++;
            L.sot++;
            if (e.type === 'pkg') L.pkGoals++;
            else if (d.xg >= X.BIG) L.bigGoals++;
          } else if (e.type === 'sot') L.sot++;
          else if (e.type === 'sblk') L.blk++;
          else if (e.type === 'pkx' && e.sub === 'saved') L.sot++;
          else L.soff++;
          break;
        }
        case 'og': L.og++; break;
        case 'ast':
        case 'kp': {
          L[e.type]++;
          const s = link.get(e.id);
          if (s && xgOf.has(s.id)) L.xa += xgOf.get(s.id).xg;
          break;
        }
        case 'tkl': L.tkl++; break;
        case 'itc': L.itc++; break;
        case 'clr': L.clr++; break;
        case 'ck': L.ck++; break;
        case 'tov': L.tov++; break;
        case 'foul':
          L.foul++;
          if (e.vs != null) get(other(e.team), e.vs).fouled++;
          break;
        case 'off': L.off++; break;
        case 'yc': L.yc++; break;
        case 'rc': L.rc++; break;
      }
    }

    // GK：相手の枠内シュート（止めた／決められた）から、セーブ数と被シュート数を数える
    const gk = { H: S.gkOf(state, 'H'), A: S.gkOf(state, 'A') };
    const saved = { H: 0, A: 0 }; // そのチームのGKが止めた本数
    for (const e of events) {
      if (!C.isShot(e)) continue;
      const def = other(e.team);
      const isSave = e.type === 'sot' || (e.type === 'pkx' && e.sub === 'saved');
      const isGoal = D.isGoal(e);
      if (!isSave && !isGoal) continue;
      if (isSave) saved[def]++;
      const g = e.gk != null ? e.gk : gk[def];
      if (g == null) continue;
      const L = get(def, g);
      L.faced++;
      if (isSave) L.saves++;
      else L.ga++;
    }

    // 選手行とチーム合計
    const team = {};
    for (const t of TEAMS) {
      const tot = newLine(t, -1);
      for (const L of maps[t].values()) for (const k of KEYS) tot[k] += L[k];
      team[t] = tot;
    }
    const players = {};
    for (const t of TEAMS) {
      for (const p of state.teams[t].roster) get(t, p.num);
      players[t] = Array.from(maps[t].values())
        .map((L) => {
          const r = state.teams[t].roster.find((p) => p.num === L.num);
          L.pos = r ? r.pos || '' : '';
          L.isGK = L.num === gk[t] && gk[t] != null;
          return decorate(L);
        })
        .sort((a, b) => (a.num === 0) - (b.num === 0) || a.num - b.num);
      team[t].nameOf = state.teams[t].name;
    }
    for (const t of TEAMS) {
      const T = team[t];
      const O = team[other(t)];
      T.gf = T.goals + O.og; // 相手のオウンゴールも得点
      T.ga = O.goals + T.og;
      T.saves = saved[t];
      T.oppSot = O.sot;
      T.bigMissed = T.big - T.bigGoals;
      decorate(T);
    }
    const score = { H: team.H.gf, A: team.A.gf };

    // 得点の一覧（時系列）
    const goals = [];
    for (const e of events) {
      const ct = D.creditTeam(e);
      if (!ct) continue;
      let pass = null;
      link.forEach((shot, pid) => {
        if (shot.id === e.id) pass = events.find((x) => x.id === pid) || null;
      });
      goals.push({
        t: e.t, id: e.id, team: ct, type: e.type, own: e.type === 'og', pk: e.type === 'pkg',
        scorer: e.num, scorerTeam: e.team, assister: pass && pass.type === 'ast' ? pass.num : null,
        scene: e.scene || (e.type === 'pkg' ? 'pk' : C.SCENE_DEFAULT), xg: xgOf.has(e.id) ? xgOf.get(e.id).xg : null,
        q: D.periodAt(periods, e.t), clock: D.minuteLabel(state, e.t), body: e.body,
      });
    }

    // 攻撃の型別（シュートに付けた「場面」ごと）
    const scenes = { H: [], A: [] };
    const play = { H: { open: null, set: null }, A: { open: null, set: null } };
    for (const t of TEAMS) {
      const mine = events.filter((e) => e.team === t && C.isShot(e));
      const by = new Map();
      const mk = (id) => ({ scene: id, shots: 0, sot: 0, goals: 0, xg: 0, big: 0 });
      const grp = { open: mk('open'), set: mk('set') };
      for (const e of mine) {
        const sc = e.scene || (e.type === 'pkg' || e.type === 'pkx' ? 'pk' : C.SCENE_DEFAULT);
        if (!by.has(sc)) by.set(sc, mk(sc));
        const d = xgOf.get(e.id);
        for (const r of [by.get(sc), C.isSetPiece(sc) ? grp.set : grp.open]) {
          r.shots++;
          r.xg += d.xg;
          if (C.isOnTarget(e)) r.sot++;
          if (D.isGoal(e)) r.goals++;
          if (d.xg >= X.BIG && e.type !== 'pkg' && e.type !== 'pkx') r.big++;
        }
      }
      const rows = C.SCENES.map((sc) => by.get(sc.id)).filter(Boolean);
      for (const r of rows) {
        r.freq = div(r.shots, mine.length);
        r.conv = div(r.goals, r.shots);
        r.sotPct = div(r.sot, r.shots);
        r.xgShot = div(r.xg, r.shots);
      }
      scenes[t] = rows;
      for (const k of ['open', 'set']) {
        const r = grp[k];
        r.freq = div(r.shots, mine.length);
        r.conv = div(r.goals, r.shots);
        r.xgShot = div(r.xg, r.shots);
      }
      play[t] = grp;
    }

    // ボールロスト：種類・場所・選手別と、ロスト直後のピンチ
    const tov = {};
    const regain = {};
    for (const t of TEAMS) {
      const o = other(t);
      const list = events.filter((e) => e.type === 'tov' && e.team === t);
      const byType = {};
      const byZone = {};
      const byPlayer = {};
      const byHalf = {};
      let toShots = 0;
      let toGoals = 0;
      let toXg = 0;
      const seq = [];
      for (const e of list) {
        const ty = e.sub || 'other';
        byType[ty] = (byType[ty] || 0) + 1;
        const z = C.zoneOfEvent(e) || 'unknown';
        byZone[z] = (byZone[z] || 0) + 1;
        byPlayer[e.num || 0] = (byPlayer[e.num || 0] || 0) + 1;
        const q = D.periodAt(periods, e.t);
        byHalf[q] = (byHalf[q] || 0) + 1;
        const s = events.find((x) => x.team === o && C.isShot(x) && x.t > e.t && x.t - e.t <= 12);
        if (s) {
          toShots++;
          toXg += xgOf.get(s.id).xg;
          const g = D.isGoal(s);
          if (g) toGoals++;
          seq.push({ from: e.t, to: s.t, goal: g, xg: xgOf.get(s.id).xg, shotId: s.id });
        }
      }
      tov[t] = { total: list.length, list, byType, byZone, byPlayer, byHalf, toShots, toGoals, toXg, seq, own3: (byZone.ownBox || 0) + (byZone.def3 || 0) };
      // 奪ってからの攻撃（タックル／インターセプト → 12秒以内の自チームのシュート）
      const rl = events.filter((e) => (e.type === 'tkl' || e.type === 'itc') && e.team === t);
      let rShots = 0;
      let rGoals = 0;
      const rseq = [];
      for (const e of rl) {
        const s = events.find((x) => x.team === t && C.isShot(x) && x.t > e.t && x.t - e.t <= 12);
        if (s) {
          rShots++;
          const g = D.isGoal(s);
          if (g) rGoals++;
          rseq.push({ from: e.t, to: s.t, goal: g });
        }
      }
      regain[t] = { total: rl.length, toShots: rShots, toGoals: rGoals, seq: rseq };
    }

    // ファウル・カード
    const fouls = {};
    for (const t of TEAMS) {
      const o = other(t);
      const list = events.filter((e) => e.type === 'foul' && e.team === t);
      const byHalf = {};
      const byZone = {};
      const byType = {};
      const byPlayer = {};
      for (const e of list) {
        const q = D.periodAt(periods, e.t);
        byHalf[q] = (byHalf[q] || 0) + 1;
        const z = C.zoneOfEvent(e) || 'unknown';
        byZone[z] = (byZone[z] || 0) + 1;
        const ty = e.sub || 'other';
        byType[ty] = (byType[ty] || 0) + 1;
        byPlayer[e.num || 0] = (byPlayer[e.num || 0] || 0) + 1;
      }
      // 自分たちのファウルの後、相手がFK／PKで撃った回数
      let setShots = 0;
      let setGoals = 0;
      const setSeq = [];
      for (const e of list) {
        const s = events.find((x) => x.team === o && C.isShot(x) && x.t > e.t && x.t - e.t <= 20 && (x.scene === 'fk' || x.scene === 'pk' || x.type === 'pkg' || x.type === 'pkx'));
        if (s) {
          setShots++;
          const g = D.isGoal(s);
          if (g) setGoals++;
          setSeq.push({ from: e.t, to: s.t, goal: g });
        }
      }
      fouls[t] = {
        total: list.length, list, byHalf, byZone, byType, byPlayer,
        yc: events.filter((e) => e.type === 'yc' && e.team === t),
        rc: events.filter((e) => e.type === 'rc' && e.team === t),
        pkConceded: events.filter((e) => (e.type === 'pkg' || e.type === 'pkx') && e.team === o).length,
        own3: (byZone.ownBox || 0) + (byZone.def3 || 0),
        setShots, setGoals, setSeq,
      };
    }

    // セットプレー
    const setp = {};
    for (const t of TEAMS) {
      const mine = events.filter((e) => e.team === t && C.isShot(e));
      const sc = (id) => mine.filter((e) => (e.scene || '') === id);
      const row = (arr) => ({ shots: arr.length, goals: arr.filter(D.isGoal).length, xg: arr.reduce((a, e) => a + xgOf.get(e.id).xg, 0) });
      setp[t] = {
        corners: events.filter((e) => e.type === 'ck' && e.team === t).length,
        corner: row(sc('corner')),
        fk: row(sc('fk')),
        throw: row(sc('throw')),
        pk: { taken: mine.filter((e) => e.type === 'pkg' || e.type === 'pkx').length, goals: mine.filter((e) => e.type === 'pkg').length },
      };
    }

    // 時間帯別（前半・後半を3分割）
    const qs = Array.from(new Set([1, 2].concat(periods.map((p) => p.q), events.map((e) => D.periodAt(periods, e.t))))).sort((a, b) => a - b);
    const buckets = [];
    for (const q of qs) {
      const len = (q <= 2 ? half : 15) * 60;
      const off = q === 1 ? 0 : q === 2 ? half : q === 3 ? half * 2 : half * 2 + 15;
      const size = len / 3;
      for (let i = 0; i < 3; i++) {
        const m0 = off + Math.round(((i * len) / 3) / 60);
        const m1 = off + Math.round((((i + 1) * len) / 3) / 60);
        buckets.push({ q, i, label: `${C.periodLabel(q)} ${m0}〜${m1}分`, m0, m1, H: { goals: 0, shots: 0, xg: 0 }, A: { goals: 0, shots: 0, xg: 0 } });
      }
      const st0 = D.periodStart(periods, q);
      for (const e of events) {
        if (D.periodAt(periods, e.t) !== q) continue;
        const bi = Math.min(2, Math.floor((e.t - st0) / size));
        const b = buckets.find((x) => x.q === q && x.i === bi);
        if (!b) continue;
        const ct = D.creditTeam(e);
        if (ct) b[ct].goals++;
        if (C.isShot(e)) {
          b[e.team].shots++;
          b[e.team].xg += xgOf.get(e.id).xg;
        }
      }
    }
    const halves = qs.map((q) => {
      const row = { q, H: newLine('H', -1), A: newLine('A', -1) };
      const evs = events.filter((e) => D.periodAt(periods, e.t) === q);
      for (const e of evs) {
        const L = row[e.team];
        if (C.isShot(e)) {
          L.shots++;
          L.xg += xgOf.get(e.id).xg;
          if (D.isGoal(e)) L.goals++;
          if (C.isOnTarget(e)) L.sot++;
        }
        if (e.type === 'foul') L.foul++;
        if (e.type === 'tov') L.tov++;
        if (e.type === 'yc') L.yc++;
        if (e.type === 'og') L.og++;
      }
      row.H.gf = row.H.goals + row.A.og;
      row.A.gf = row.A.goals + row.H.og;
      return row;
    });

    // xGの推移
    const xgTl = [{ t: 0, H: 0, A: 0 }];
    {
      let h = 0;
      let a = 0;
      for (const e of events) {
        if (!C.isShot(e)) continue;
        const d = xgOf.get(e.id);
        if (e.team === 'H') h += d.xg;
        else a += d.xg;
        xgTl.push({ t: e.t, H: h, A: a, team: e.team, xg: d.xg, goal: D.isGoal(e), id: e.id });
      }
    }

    // アシストの組み合わせ（得点のみ）
    const assists = { H: { pairs: {}, n: 0 }, A: { pairs: {}, n: 0 } };
    link.forEach((shot, pid) => {
      const a = events.find((x) => x.id === pid);
      if (!a || a.type !== 'ast' || !D.isGoal(shot)) return;
      const key = (a.num || 0) + '>' + (shot.num || 0);
      assists[a.team].pairs[key] = (assists[a.team].pairs[key] || 0) + 1;
      assists[a.team].n++;
    });

    const tl = D.scoreTimeline(events);
    const flow = D.flowSummary(tl);
    const spells = D.spells(events, 3, 240);

    // データの充実度
    const cnt = (t, f) => events.filter((e) => e.team === t && f(e)).length;
    const shotLoc = (t) => cnt(t, (e) => C.isShot(e) && e.px != null);
    const meta = {
      total: events.length,
      hasA: events.some((e) => e.team === 'A'),
      hasH: events.some((e) => e.team === 'H'),
      hasAst: events.some((e) => e.type === 'ast' || e.type === 'kp'),
      hasTov: events.some((e) => e.type === 'tov'),
      hasFoul: events.some((e) => e.type === 'foul'),
      hasCk: events.some((e) => e.type === 'ck'),
      hasDef: events.some((e) => e.type === 'tkl' || e.type === 'itc' || e.type === 'clr'),
      hasCard: events.some((e) => e.type === 'yc' || e.type === 'rc'),
      hasScene: events.some((e) => C.isShot(e) && e.scene && e.scene !== C.SCENE_DEFAULT),
      shotsH: team.H.shots,
      shotsA: team.A.shots,
      locH: shotLoc('H'),
      locA: shotLoc('A'),
      tovLoc: cnt('H', (e) => e.type === 'tov' && e.px != null),
      foulLoc: cnt('H', (e) => e.type === 'foul' && e.px != null),
      periodsSet: periods.length > 1,
      estXg: events.filter((e) => C.isShot(e) && xgOf.get(e.id).est).length,
    };

    return { events, periods, half, players, team, score, goals, link, xgOf, scenes, play, tov, regain, fouls, setp, buckets, halves, xgTl, tl, flow, spells, assists, meta, gk, saved };
  };

  /* ---------- ショットゾーン別 ---------- */
  /** filterFn(e) を満たすシュートをゾーン別に集計（xGも） */
  S.zoneTable = (events, filterFn) => {
    const rows = {};
    C.ZONES.forEach((z) => (rows[z.id] = { zone: z.id, shots: 0, goals: 0, sot: 0, xg: 0 }));
    rows.unknown = { zone: 'unknown', shots: 0, goals: 0, sot: 0, xg: 0 };
    let total = 0;
    for (const e of events) {
      if (!C.isShot(e)) continue;
      if (filterFn && !filterFn(e)) continue;
      const pos = C.shotPos(e);
      const zone = pos ? C.zoneFor(pos.sx, pos.sy) : e.zone || null;
      const r = rows[zone] || rows.unknown;
      r.shots++;
      total++;
      r.xg += X.of(e);
      if (C.isOnTarget(e)) r.sot++;
      if (D.isGoal(e)) r.goals++;
    }
    Object.values(rows).forEach((r) => {
      r.conv = div(r.goals, r.shots);
      r.xgShot = div(r.xg, r.shots);
      r.share = div(r.shots, total);
    });
    const groups = {};
    C.ZONE_GROUPS.forEach((g) => (groups[g.id] = { grp: g.id, shots: 0, goals: 0, sot: 0, xg: 0 }));
    C.ZONES.forEach((z) => {
      const r = rows[z.id];
      const g = groups[z.grp];
      g.shots += r.shots;
      g.goals += r.goals;
      g.sot += r.sot;
      g.xg += r.xg;
    });
    const located = total - rows.unknown.shots;
    Object.values(groups).forEach((g) => {
      g.conv = div(g.goals, g.shots);
      g.xgShot = div(g.xg, g.shots);
      g.share = div(g.shots, located);
    });
    return { rows, groups, total, located };
  };

  /** 表示用フォーマット */
  S.fmtPct = (v, dp) => (v == null ? '—' : (v * 100).toFixed(dp == null ? 1 : dp) + '%');
  S.fmtNum = (v, dp) => (v == null || !isFinite(v) ? '—' : v.toFixed(dp == null ? 1 : dp));
})();

</script>
<script>
/* サッカー分析ラボ - 得点／失点の場面の分析
 * 「点が入った攻撃まるごと」を、攻撃の始まりから得点までのクリップ候補にして、
 * 失点（＝相手の得点）は「どうして決められたか（原因）」、
 * 得点（＝自分たちのゴール）は「どうやって決めたか（型）」で分類する。
 * プロの現場でも、失点はセットプレー／ボールロスト後／カウンター／クロス／ミドルなどに分けて振り返る。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const C = SL.C;
  const D = SL.derive;
  const X = SL.xg;
  const GL = (SL.goals = {});

  /* 主な原因を決める優先順（上ほど優先）。label: [失点側の言い方, 得点側の言い方] */
  GL.CAUSES = [
    { id: 'pk', label: ['PKを与えた', 'PKで得点'], short: 'PK', hint: ['ペナルティエリア内のファウルでPKを与えた', 'PKで決めた'], color: '#ff9f43' },
    { id: 'og', label: ['オウンゴール', '相手のオウンゴール'], short: 'OG', hint: ['自分たちの選手のオウンゴール', '相手のオウンゴール'], color: '#b0b8c9' },
    { id: 'corner', label: ['コーナーキックから', 'コーナーキックから'], short: 'CK', hint: ['コーナーキックからのシュート（こぼれ球含む）', 'コーナーキックから決めた'], color: '#e6c15a' },
    { id: 'fk', label: ['フリーキックから', 'フリーキックから'], short: 'FK', hint: ['直接・間接フリーキックからのシュート', 'フリーキックから決めた'], color: '#ffd166' },
    { id: 'throw', label: ['スローインから', 'スローインから'], short: 'スロー', hint: ['スローイン（ロングスロー）からのシュート', 'スローインから決めた'], color: '#f0b98a' },
    { id: 'tov', label: ['ボールを失った直後', '奪ってすぐの攻撃'], short: 'ロスト後', hint: ['自分たちのボールロスト／奪われた直後に決められた', '相手のボールを奪った直後に決めた'], color: '#ff6b6b' },
    { id: 'counter', label: ['カウンター（速攻）', 'カウンター（速攻）'], short: 'カウンター', hint: ['守備が整う前に走られて決められた', '相手が整う前に走って決めた'], color: '#ff8a5c' },
    { id: 'cross', label: ['サイドからのクロス', 'サイド攻撃・クロス'], short: 'クロス', hint: ['サイドからのクロスを合わされた', 'サイドからのクロスで決めた'], color: '#7ee0b0' },
    { id: 'through', label: ['中央突破・スルーパス', '中央突破・スルーパス'], short: '中央突破', hint: ['縦パス・スルーパス・ワンツーで崩された', '縦パス・スルーパスで崩して決めた'], color: '#5ad1ff' },
    { id: 'long', label: ['ロングボール・裏を取られた', 'ロングボール・裏抜け'], short: 'ロング', hint: ['DFラインの背後に出されて決められた', '背後へのボールで抜け出して決めた'], color: '#a78bfa' },
    { id: 'far', label: ['ミドル・ロングシュート', 'ミドルシュート'], short: 'ミドル', hint: ['ペナルティエリアの外から決められた', 'ペナルティエリアの外から決めた'], color: '#ffc46b' },
    { id: 'solo', label: ['個人技・1対1を破られた', '個人技・ドリブル突破'], short: '個人技', hint: ['ドリブル突破など個人技で決められた', 'ドリブル突破など個人技で決めた'], color: '#9be15d' },
    { id: 'build', label: ['組み立てで崩された', '組み立てて崩した'], short: '組み立て', hint: ['パスをつながれて組織的に崩された', 'パスをつないで崩して決めた'], color: '#9aa9c8' },
    { id: 'other', label: ['その他', 'その他'], short: 'その他', hint: ['上のどれにも当てはまらない', '上のどれにも当てはまらない'], color: '#8892a6' },
  ];
  GL.PRIORITY = GL.CAUSES.map((c) => c.id);
  GL.cause = (id) => GL.CAUSES.find((c) => c.id === id) || GL.CAUSES[GL.CAUSES.length - 1];
  GL.priorityIndex = (id) => {
    const i = GL.PRIORITY.indexOf(id);
    return i < 0 ? GL.PRIORITY.length : i;
  };
  /** 表示名（side: 'against'=失点 / 'for'=得点） */
  GL.causeLabel = (id, side) => GL.cause(id).label[side === 'for' ? 1 : 0];
  GL.causeHint = (id, side) => GL.cause(id).hint[side === 'for' ? 1 : 0];
  GL.SET_CAUSES = ['pk', 'corner', 'fk', 'throw'];

  const SCENE_TO_CAUSE = { corner: 'corner', fk: 'fk', throw: 'throw', pk: 'pk', counter: 'counter', press: 'counter', cross: 'cross', through: 'through', long: 'long', solo: 'solo', build: 'build' };

  function who(state, team, num) {
    if (num == null) return '';
    if (num === 0) return 'チーム';
    const p = state.teams[team].roster.find((x) => x.num === num);
    return '#' + num + (p && p.name ? ' ' + p.name : '');
  }

  /** ゴールの直前にある「攻撃の始まり」の目印（時刻が最も近いもの） */
  function attackMarker(evs, idx, scorer, def) {
    const g = evs[idx];
    for (let k = idx - 1; k >= 0; k--) {
      const e = evs[k];
      if (g.t - e.t > 25) break;
      if (e.team === def && e.type === 'tov') return { t: e.t, kind: 'tov', ev: e };
      if (e.team === scorer && (e.type === 'tkl' || e.type === 'itc')) return { t: e.t, kind: 'regain', ev: e };
      if (e.team === def && e.type === 'foul') return { t: e.t, kind: 'foul', ev: e };
      if (e.team === scorer && e.type === 'ck') return { t: e.t, kind: 'ck', ev: e };
      if (e.team === def && C.isShot(e) && !D.isGoal(e)) return { t: e.t, kind: 'defShot', ev: e };
    }
    return null;
  }

  /**
   * 得点（side='against' なら相手の得点＝失点、'for' なら自チームの得点）を、原因／型つきで一覧にする。
   * state: アプリの状態 / S: SL.stats.compute(state) の結果
   */
  GL.build = (state, S, opts) => {
    opts = opts || {};
    const side = opts.side === 'for' ? 'for' : 'against';
    const scorer = side === 'for' ? 'H' : 'A';
    const def = D.other(scorer);
    const cfg = state.cfg || {};
    const pre = cfg.pre != null ? cfg.pre : 8;
    const post = cfg.post != null ? cfg.post : 4;
    const evs = S.events;
    const periods = state.periods || [{ q: 1, start: 0 }];
    const out = [];

    for (let idx = 0; idx < evs.length; idx++) {
      const g = evs[idx];
      if (D.creditTeam(g) !== scorer) continue;
      const causes = new Set();
      const detail = {};
      const isOwn = g.type === 'og';
      const scene = g.scene || (g.type === 'pkg' ? 'pk' : C.SCENE_DEFAULT);
      const marker = isOwn ? null : attackMarker(evs, idx, scorer, def);
      const near = marker && g.t - marker.t <= 14;

      if (isOwn) causes.add('og');
      else {
        if (g.type === 'pkg' || scene === 'pk') causes.add('pk');
        causes.add(SCENE_TO_CAUSE[scene] || 'other');
        if (near && (marker.kind === 'tov' || marker.kind === 'regain') && !C.isSetPiece(scene)) {
          causes.add('tov');
          detail.tov = { kind: marker.kind, num: marker.ev.num, team: marker.ev.team, sub: marker.ev.sub || 'other', t: marker.t };
        }
        const pos = C.shotPos(g);
        const zone = pos ? C.zoneFor(pos.sx, pos.sy) : g.zone;
        if (zone === 'far' || ((zone === 'edgeC' || zone === 'edgeL' || zone === 'edgeR') && scene === 'solo')) causes.add('far');
        if (g.body === 'head') detail.head = true;
        if (zone === 'six') detail.close = true;
        if (marker && marker.kind === 'foul' && (scene === 'fk' || scene === 'pk')) detail.foul = { num: marker.ev.num, sub: marker.ev.sub || 'other', px: marker.ev.px, py: marker.ev.py };
        if (marker && marker.kind === 'ck') detail.corner = true;
      }
      if (!causes.size) causes.add('other');
      if (causes.size > 1) causes.delete('other');
      // 「その他」より組み立てを優先（scene 未指定 = build）
      const causeList = GL.PRIORITY.filter((id) => causes.has(id));
      const primary = causeList[0];

      // クリップ範囲：攻撃の始まり（目印の少し前）から、得点の少し後まで
      let start;
      if (marker) start = Math.min(g.t - pre, marker.t - (marker.kind === 'foul' || marker.kind === 'ck' ? 3 : 2.5));
      else start = g.t - pre - (isOwn ? 0 : 4);
      start = Math.max(0, start);
      const end = g.t + post;

      const pass = S.link ? Array.from(S.link.entries()).find(([, shot]) => shot.id === g.id) : null;
      const assistEv = pass ? evs.find((x) => x.id === pass[0]) : null;
      const assist = assistEv && assistEv.type === 'ast' ? assistEv.num : null;
      const scorerTeam = g.team;
      const scorerNum = g.num;
      const isPk = g.type === 'pkg';
      const desc = isOwn ? 'オウンゴール' : isPk ? 'PK' : detail.head ? 'ヘディングでゴール' : 'ゴール';
      const clock = D.minuteLabel(state, g.t);
      const label = `${clock} ${who(state, scorerTeam, scorerNum)} ${desc}${assist != null ? `（アシスト ${who(state, scorer, assist)}）` : ''}`.replace(/\s+/g, ' ');

      // 原因（型）の説明文
      const parts = causeList
        .filter((id) => id !== 'other' || causeList.length === 1)
        .map((id) => {
          switch (id) {
            case 'tov': {
              const t = detail.tov;
              if (!t) return GL.causeLabel(id, side);
              if (side === 'against') {
                return t.kind === 'tov' ? `自チームのボールロスト（${C.tovLabel(t.sub).replace(/（.*）/, '')}${t.num ? ' #' + t.num : ''}）` : '中盤などでボールを奪われた直後';
              }
              return t.kind === 'regain' ? `ボール奪取${t.num ? '（#' + t.num + '）' : ''}からすぐに決めた` : '相手のミスを突いて決めた';
            }
            case 'pk':
              return detail.foul ? `ファウル${detail.foul.num ? '（#' + detail.foul.num + '）' : ''}→PK` : GL.causeLabel(id, side);
            case 'fk':
              return detail.foul ? `ファウル${detail.foul.num ? '（#' + detail.foul.num + '）' : ''}→フリーキック` : GL.causeLabel(id, side);
            case 'corner':
              return 'コーナーキック' + (detail.head ? '（ヘディング）' : '');
            case 'cross':
              return 'クロス' + (detail.head ? '→ヘディング' : '');
            default:
              return GL.causeLabel(id, side);
          }
        });
      const causeText = parts.join(' ＋ ') + (detail.close && !C.isSetPiece(scene) ? '（ゴール前の至近距離）' : '');

      const win = evs.filter((e) => e.t >= start - 0.01 && e.t <= g.t + 1.5);
      out.push({
        key: (side === 'for' ? 'sf' : 'ga') + g.id,
        id: g.id,
        side,
        team: scorer,
        def,
        pts: 1,
        t: g.t,
        tEnd: g.t,
        start,
        end,
        q: D.periodAt(periods, g.t),
        clock,
        scene,
        causes: causeList,
        primary,
        detail,
        scorers: [{ num: scorerNum == null ? 0 : scorerNum, pts: 1 }],
        scorerTeam,
        assist,
        label,
        causeText,
        xg: X.of(g),
        events: win.length ? win : [g],
        goal: g,
      });
    }
    return out;
  };

  /** 原因別の内訳（主な原因ごとの点数／関係した原因ごとの点数） */
  GL.summary = (items) => {
    const total = items.reduce((a, it) => a + it.pts, 0);
    const primary = {};
    const involved = {};
    GL.CAUSES.forEach((c) => {
      primary[c.id] = { id: c.id, pts: 0, n: 0 };
      involved[c.id] = { id: c.id, pts: 0, n: 0 };
    });
    items.forEach((it) => {
      primary[it.primary].pts += it.pts;
      primary[it.primary].n++;
      it.causes.forEach((c) => {
        involved[c].pts += it.pts;
        involved[c].n++;
      });
    });
    const byPrimary = GL.CAUSES.map((c) => primary[c.id]).filter((x) => x.n > 0);
    const scorerMap = {};
    items.forEach((it) => it.scorers.forEach((s) => (scorerMap[s.num] = (scorerMap[s.num] || 0) + s.pts)));
    const scorers = Object.keys(scorerMap)
      .map((n) => ({ num: +n, pts: scorerMap[n] }))
      .sort((a, b) => b.pts - a.pts);
    const setN = items.filter((it) => it.causes.some((c) => GL.SET_CAUSES.includes(c))).length;
