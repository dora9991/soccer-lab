      }
    }

    /** シュートを打って、その後の展開まで決める */
    function finishShot(team, shooter, info, reboundP) {
      const def = other(team);
      // shooter が受け取るまでの間にボールを持たせる
      if (holder !== shooter) holder = shooter;
      settle(team, range(0.2, 0.45));
      if (chance(0.05 * STYLE[def].foul)) {
        const r = foulOn(team);
        if (r.foul) return r;
      }
      const passer = info.passer == null ? null : info.passer;
      const res = takeShot(team, shooter, Object.assign({}, info, { passer }));
      return afterShot(team, shooter, info, res, reboundP);
    }

    function afterShot(team, shooter, info, res, reboundP) {
      const def = other(team);
      const dir = dirOf(team);
      const gx = goalX(team);
      if (res.kind === 'goal') {
        return Object.assign({ goal: true }, afterGoal(team, shooter, res.tgt));
      }
      if (res.kind === 'wide') {
        const tgt = res.tgt;
        bRest(T + 0.5);
        T += 0.5;
        return { next: { team: def, kind: 'gk', u: 5.5, v: CY + range(-9, 9), t: T + 1.0 } };
      }
      if (res.kind === 'saved') {
        const gkS = res.gkS;
        const r = rand();
        const g = posOf(gkS);
        if (r < 0.62) {
          // キャッチ
          holder = gkS;
          bHold(T + 0.6, gkS);
          advance(T + 0.6, ctxFor(def, g, { force: { [gkS]: { x: g.x, y: g.y, v: 2 } } }));
          T += 0.6;
          const nf = fromW(def, g.x, g.y);
          return { next: { team: def, kind: 'regain', u: nf.u, v: nf.v, holder: gkS, t: T, gkHold: true } };
        }
        if (r < 0.62 + 0.18) {
          // はじいてコーナー
          const cv = chance(0.5) ? 0.4 : PW - 0.4;
          ballOutForCorner(team, cv);
          return { next: { team, kind: 'corner', u: PL, v: cv, t: T + 1.0 }, corner: true };
        }
        // こぼれ球
        const land = { x: clamp(g.x - dir * range(5, 9), 2, PL - 2), y: clamp(g.y + range(-8, 8), 3, PW - 3) };
        const t1 = T + 0.8;
        bFly(t1, land.x, land.y, 0.6);
        // 近くの選手（攻撃60%）
        const attacker = chance(0.5);
        const wS = attacker ? pickRecv(team, land, [], ['F', 'M']) : nearestDef(team, land, true);
        advance(t1, ctxFor(null, land, { force: { [wS]: { x: land.x, y: land.y, v: 8.6 } }, press: false }));
        T = t1;
        if (attacker && reboundP > 0 && chance(0.55)) {
          holder = wS;
          const t2 = T + 0.3;
          advance(t2, ctxFor(team, land, { force: { [wS]: { x: land.x, y: land.y, v: 2 } } }));
          bHold(t2, wS);
          T = t2;
          const res2 = takeShot(team, wS, { scene: info.scene, body: 'foot', passer: null, boost: 1.1 });
          return afterShot(team, wS, info, res2, 0);
        }
        holder = wS;
        bHold(T + 0.35, wS);
        advance(T + 0.35, ctxFor(attacker ? team : def, land, { force: { [wS]: { x: land.x, y: land.y, v: 2 } } }));
        T += 0.35;
        if (attacker) return { next: { team: def, kind: 'gk', u: 5.5, v: CY, t: T + 1.5 } };
        const nf = fromW(def, land.x, land.y);
        return { next: { team: def, kind: 'regain', u: nf.u, v: nf.v, holder: wS, t: T } };
      }
      // ブロック
      const bp = res.bp;
      const r = rand();
      if (r < 0.32) {
        const cv = bp.y < CY ? 0.4 : PW - 0.4;
        ballOutForCorner(team, cv);
        return { next: { team, kind: 'corner', u: PL, v: cv, t: T + 1.0 }, corner: true };
      }
      const land = { x: clamp(bp.x - dir * range(3, 8), 2, PL - 2), y: clamp(bp.y + range(-7, 7), 3, PW - 3) };
      const t1 = T + 0.7;
      bFly(t1, land.x, land.y, 0.5);
      const w = nearestDef(team, land, true);
      advance(t1, ctxFor(null, land, { force: { [w]: { x: land.x, y: land.y, v: 8.6 } }, press: false }));
      T = t1;
      holder = w;
      bHold(T + 0.3, w);
      advance(T + 0.3, ctxFor(def, land, { force: { [w]: { x: land.x, y: land.y, v: 2 } } }));
      T += 0.3;
      const nf = fromW(def, land.x, land.y);
      return { next: { team: def, kind: 'regain', u: nf.u, v: nf.v, holder: w, t: T } };
    }

    /** クリアされたあと */
    function afterClear(team, clearer, at) {
      const def = other(team);
      const dir = dirOf(team);
      const land = { x: clamp(at.x - dir * range(16, 26), 4, PL - 4), y: clamp(at.y + range(-14, 14), 4, PW - 4) };
      const t1 = T + 1.1;
      bFly(t1, land.x, land.y, 1.8);
      const dw = pickRecv(def, land, [], ['D', 'M']);
      const aw = pickRecv(team, land, [], ['M']);
      const defWins = chance(0.55);
      const w = defWins ? dw : aw;
      advance(t1, ctxFor(null, land, { force: { [w]: { x: land.x, y: land.y, v: 8.4 } }, press: false }));
      T = t1;
      holder = w;
      bHold(T + 0.35, w);
      advance(T + 0.35, ctxFor(defWins ? def : team, land, { force: { [w]: { x: land.x, y: land.y, v: 2 } } }));
      T += 0.35;
      if (defWins) {
        const nf = fromW(def, land.x, land.y);
        return { next: { team: def, kind: 'regain', u: nf.u, v: nf.v, holder: w, t: T } };
      }
      const nf = fromW(team, land.x, land.y);
      return { next: { team, kind: 'regain', u: nf.u, v: nf.v, holder: w, t: T, second: true } };
    }

    function offsideRestart(team, striker) {
      const def = other(team);
      const sp = posOf(striker);
      const t1 = T + 3.0;
      advance(t1, ctxFor(null, sp, { press: false, spd: { H: 5, A: 5 } }));
      B.x = sp.x;
      B.y = sp.y;
      bRest(t1);
      T = t1;
      const f = fromW(def, sp.x, sp.y);
      return { next: { team: def, kind: 'fk', u: clamp(f.u, 6, 99), v: clamp(f.v, 6, 62), t: T } };
    }

    /* --- セットプレー --- */
    function boxPositions(team, side) {
      // 攻撃側がゴール前に入る位置（u, v）
      const nearV = side === 0 ? 27 : 41; // コーナー側
      return [
        [99, nearV],
        [95, 34],
        [98.5, 34 + (side === 0 ? 5 : -5)],
        [93.5, 27],
        [93.5, 41],
        [88, 34],
      ];
    }
    function setPieceShape(team, kickSlot, kickAt, kind, sideV) {
      const def = other(team);
      const force = {};
      const dir = dirOf(team);
      // キッカー
      force[kickSlot] = { x: kickAt.x, y: kickAt.y, v: 8, free: true };
      // 攻撃：CB2人・FW2人・MF1〜2人がゴール前
      const pool = [];
      for (let i = 1; i < 11; i++) {
        const s = slotOf(team, i);
        if (s === kickSlot) continue;
        const R = FORM[team][i];
        const w = R.r === 'F' ? 5 : R.r === 'M' ? 2 : i === 2 || i === 3 ? 3.2 : 0.7;
        pool.push({ s, w: w * playerOfSlot(s).aer * (0.7 + rand() * 0.6) });
      }
      pool.sort((a, b) => b.w - a.w);
      const boxes = boxPositions(team, sideV < CY ? 0 : 1);
      const atk = pool.slice(0, boxes.length);
      atk.forEach((a, k) => {
        const bp = boxes[k];
        force[a.s] = Object.assign(toW(team, bp[0] + range(-0.8, 0.8), bp[1] + range(-1, 1)), { v: 7.4 });
      });
      // 守備：マーク＋ゴールキーパー
      const defs = [];
      for (let i = 1; i < 11; i++) defs.push(slotOf(def, i));
      const rank = { D: 0, M: 1, F: 2, G: 3 };
      defs.sort((a, b) => rank[FORM[teamOfSlot(a)][idxOfSlot(a)].r] - rank[FORM[teamOfSlot(b)][idxOfSlot(b)].r]);
      atk.forEach((a, k) => {
        const ds = defs[k];
        if (ds == null) return;
        const p = force[a.s];
        force[ds] = { x: p.x + dir * 1.1, y: p.y + range(-0.4, 0.4), v: 7.4 };
      });
      force[slotOf(def, 0)] = Object.assign(toW(team, PL - 3.2, CY + (kickAt.y < CY ? -1.2 : 1.2)), { v: 5 });
      // 残り2人の守備は、ペナルティエリアの外で構える
      return { force, atk };
    }

    /** クロスのボールがゴール前に入り、競り合う（コーナー／FK／スローイン共通） */
    function deliverAndContest(team, kicker, tgtLoc, shape, scene, flight, winP) {
      const def = other(team);
      const dir = dirOf(team);
      const near = shape.atk.map((a) => a.s);
      const hs = wpick(near, (s) => playerOfSlot(s).aer * (playerOfSlot(s).fin * 0.7 + 0.5) * Math.exp(-Math.hypot(last(s).x - tgtLoc.x, last(s).y - tgtLoc.y) / 12));
      const dm = nearestDef(team, tgtLoc, true);
      const t1 = T + flight;
      bFly(t1, tgtLoc.x, tgtLoc.y, 1.8);
      const force = Object.assign({}, shape.force, { [hs]: { x: tgtLoc.x, y: tgtLoc.y, v: 6 }, [dm]: { x: tgtLoc.x + dir * 0.8, y: tgtLoc.y + 0.5, v: 6.5 } });
      advance(t1, ctxFor(null, tgtLoc, { force, press: false }));
      T = t1;
      holder = hs;
      const aWin = (playerOfSlot(hs).aer * (team === 'A' ? 1.2 : 0.85)) / (playerOfSlot(dm).aer * 1.05 + 0.001);
      if (chance(clamp(winP * aWin * setK, 0.08, 0.62))) {
        bHold(T + 0.05, hs);
        return finishHeader(team, hs, kicker, scene);
      }
      // 守備がクリア
      if (chance(TAGR.clr)) emit(T + 0.3, 'clr', def, dm, locOf(def, tgtLoc.x, tgtLoc.y));
      addFx(T + 0.2, 'win', tgtLoc.x, tgtLoc.y - 1.8, 'クリア', def);
      holder = null;
      return afterClear(team, dm, tgtLoc);
    }

    function gatherForSetPiece(spot, force, times, dur) {
      for (let k = 0; k < times; k++) {
        advance(T + dur, ctxFor(null, spot, { force, press: false, spd: { H: 7.4, A: 7.4 } }));
        T += dur;
        bRest(T);
      }
    }

    function corner(team, st) {
      const cornerV = st.v < CY ? 0.5 : PW - 0.5;
      const spot = toW(team, PL - 0.4, cornerV);
      const crosserCands = [];
      for (let i = 1; i < 11; i++) {
        const R = FORM[team][i];
        if (R.r === 'M' || R.r === 'F') crosserCands.push(slotOf(team, i));
      }
      const kicker = wpick(crosserCands, (s) => playerOfSlot(s).cross * (FORM[team][idxOfSlot(s)].w ? 1.6 : 0.6));
      const shape = setPieceShape(team, kicker, spot, 'corner', cornerV);
      placeBall(spot.x, spot.y);
      gatherForSetPiece(spot, shape.force, 2, 2.6);
      holder = kicker;
      bHold(T + 0.5, kicker);
      T += 0.5;
      emit(T + 0.6, 'ck', team, kicker, {});
      addFx(T, 'flag', spot.x, spot.y + (cornerV < CY ? 2.5 : -2.5), 'コーナー', team);
      const tgtLoc = toW(team, range(94.5, 100), CY + range(-7, 7));
      return deliverAndContest(team, kicker, tgtLoc, shape, 'corner', 1.75, 0.28);
    }

    function finishHeader(team, hs, passer, scene) {
      const res = takeShot(team, hs, { scene, body: 'head', passer });
      return afterShot(team, hs, { scene }, res, 0.1);
    }

    function freeKickAttack(team, st) {
      const def = other(team);
      const spot = toW(team, st.u, st.v);
      const dist = Math.hypot(PL - st.u, st.v - CY);
      const direct = dist <= 27 && Math.abs(st.v - CY) <= 18 && chance(0.6);
      const cands = [];
      for (let i = 1; i < 11; i++) if (FORM[team][i].r !== 'D') cands.push(slotOf(team, i));
      const kicker = wpick(cands, (s) => playerOfSlot(s).fk);
      placeBall(spot.x, spot.y);
      if (direct) {
        const goalC = toW(team, PL, CY);
        const len = Math.hypot(goalC.x - spot.x, goalC.y - spot.y) || 1;
        const ux = (goalC.x - spot.x) / len;
        const uy = (goalC.y - spot.y) / len;
        const force = { [kicker]: { x: spot.x, y: spot.y, v: 7 } };
        const wall = [];
        for (let i = 1; i < 11 && wall.length < 4; i++) {
          const s = slotOf(def, i);
          if (FORM[def][i].r !== 'F') wall.push(s);
        }
        wall.forEach((s, k) => {
          force[s] = { x: spot.x + ux * 9.2 - uy * (k - 1.5) * 0.75, y: spot.y + uy * 9.2 + ux * (k - 1.5) * 0.75, v: 7.2 };
        });
        force[slotOf(def, 0)] = Object.assign(toW(team, PL - 2, CY + (spot.y < CY ? 1.6 : -1.6) * 0.6), { v: 5 });
        gatherForSetPiece(spot, force, 2, 2.2);
        holder = kicker;
        bHold(T + 0.7, kicker);
        advance(T + 0.7, ctxFor(null, spot, { force, press: false }));
        T += 0.7;
        addFx(T, 'whistle', spot.x, spot.y - 1.8, 'フリーキック', team);
        const res = takeShot(team, kicker, { scene: 'fk', body: 'foot', passer: null });
        return afterShot(team, kicker, { scene: 'fk' }, res, 0);
      }
      const shape = setPieceShape(team, kicker, spot, 'fk', spot.y);
      gatherForSetPiece(spot, shape.force, 2, 2.4);
      holder = kicker;
      bHold(T + 0.5, kicker);
      T += 0.5;
      const tgtLoc = toW(team, range(94.5, 99.5), CY + range(-7, 7));
      return deliverAndContest(team, kicker, tgtLoc, shape, 'fk', 1.6, 0.3);
    }

    function penalty(team) {
      const def = other(team);
      const dir = dirOf(team);
      const spot = toW(team, PL - 11, CY);
      const cands = [];
      for (let i = 1; i < 11; i++) if (FORM[team][i].r !== 'D') cands.push(slotOf(team, i));
      const kicker = wpick(cands, (s) => playerOfSlot(s).fin);
      const gk = slotOf(def, 0);
      const force = {};
      force[kicker] = { x: spot.x - dir * 0.6, y: spot.y, v: 6 };
      force[gk] = Object.assign(toW(team, PL - 0.6, CY), { v: 5 });
      let ka = 0;
      let kb = 0;
      for (let s = 0; s < 22; s++) {
        if (s === kicker || s === gk) continue;
        // ペナルティエリアとアークの外側に、2列で立つ（重ならないように間隔をあける）
        if (teamOfSlot(s) === team) {
          force[s] = Object.assign(toW(team, 75.5 + (ka % 2) * 1.6, CY + (ka - 4) * 3.7), { v: 7 });
          ka++;
        } else {
          force[s] = Object.assign(toW(team, 80.5 + (kb % 2) * 1.6, CY + (kb - 4.5) * 3.4), { v: 7 });
          kb++;
        }
      }
      placeBall(spot.x, spot.y);
      gatherForSetPiece(spot, force, 2, 2.6);
      holder = kicker;
      addFx(T, 'pk', spot.x, spot.y - 3, 'PK!', team);
      bHold(T + 0.5, kicker);
      T += 0.5;
      const res = takeShot(team, kicker, { scene: 'pk', body: 'foot', passer: null, pk: true });
      return afterShot(team, kicker, { scene: 'pk' }, res, 0);
    }

    function throwIn(team, st) {
      const dir = dirOf(team);
      // スローインの位置から、そのまま組み立て
      prepareStart(team, st);
      const cur = fromW(team, posOf(holder).x, posOf(holder).y);
      if (cur.u >= 84 && chance(0.4)) {
        // 大きなスロー→ゴール前
        const tgtLoc = toW(team, range(95, 100), CY + range(-6, 6));
        const near = [];
        for (let i = 1; i < 11; i++) if (FORM[team][i].r !== 'D' || i === 2 || i === 3) near.push(slotOf(team, i));
        const hs = wpick(near, (s) => playerOfSlot(s).aer * Math.exp(-Math.hypot(last(s).x - tgtLoc.x, last(s).y - tgtLoc.y) / 15));
        const dm = nearestDef(team, tgtLoc, true);
        const t1 = T + 1.4;
        const thrower = holder;
        bFly(t1, tgtLoc.x, tgtLoc.y, 1.5);
        advance(t1, ctxFor(null, tgtLoc, { force: { [hs]: { x: tgtLoc.x, y: tgtLoc.y, v: 6.4 }, [dm]: { x: tgtLoc.x + dir * 0.7, y: tgtLoc.y, v: 6.4 } }, press: false }));
        T = t1;
        holder = hs;
        if (chance(clamp(0.3 * setK, 0.1, 0.55))) {
          bHold(T + 0.05, hs);
          return finishHeader(team, hs, thrower, 'throw');
        }
        return afterClear(team, dm, tgtLoc);
      }
      return null; // 通常の組み立てへ
    }

    /* --- 1回の攻撃 --- */
    function possession(team, st) {
      const def = other(team);
      T = Math.max(T, st.t || T);
      if (st.kind === 'corner') return corner(team, st);
      if (st.kind === 'pkick') return penalty(team);
      if (st.kind === 'fkAtt') return freeKickAttack(team, st);
      if (st.kind === 'throw') {
        const r = throwIn(team, st);
        if (r) return r;
        st = Object.assign({}, st, { kind: 'built' });
      } else if (st.kind === 'fk' && st.u >= 70) {
        return freeKickAttack(team, Object.assign({}, st, { kind: 'fkAtt' }));
      } else prepareStart(team, st);

      // 攻め方
      const style = STYLE[team];
      const cur = fromW(team, posOf(holder).x, posOf(holder).y);
      let phase = 'build';
      if (st.kind === 'regain') {
        if (st.gkHold) phase = chance(style.long) ? 'direct' : 'build';
        else if (st.second) phase = 'build';
        else phase = st.u >= 66 ? 'quick' : st.u >= 38 ? (chance(style.counter * 1.5) ? 'quick' : 'build') : chance(style.counter) ? 'quick' : chance(style.long) ? 'direct' : 'build';
      } else if (st.kind === 'gk') phase = chance(style.long * 1.4) ? 'direct' : 'build';
      else if (st.kind === 'fk' && cur.u < 45) phase = chance(style.long) ? 'direct' : 'build';

      let res = null;
      if (phase === 'build') res = buildUp(team, st, Math.round(range(3, 6.6)));
      else if (phase === 'quick') res = quickBreak(team, st);
      else res = directBall(team, st);
      if (res) return res;

      // 仕上げ
      const w =
        phase === 'quick'
          ? { wing: 0.15 * style.wing, through: 0.35 * style.through, solo: 0.3 * style.solo, combo: 0.15, far: 0.05 * style.far }
          : phase === 'direct'
            ? { wing: 0, through: 0.25 * style.through, solo: 0.2, combo: 0.55, far: 0.05 }
            : { wing: 0.34 * style.wing, through: 0.2 * style.through, solo: 0.2 * style.solo, combo: 0.16 * style.combo, far: 0.1 * style.far };
      // 中途半端な位置で終わらないように、まだ低いならもう少しつなぐ
      const kindF = wpick(Object.keys(w), (k) => w[k]);
      // シュートに至らず終わる（前進の途中で潰される）確率
      const cutP = phase === 'quick' ? 0.22 : phase === 'direct' ? 0.3 : 0.4;
      if (!chance(Math.min(0.95, (1 - cutP) * shotK * style.shotMul))) {
        return loseBall(team, wpick(['pass', 'dribble', 'control', 'clear'], (k) => ({ pass: 4, dribble: 3, control: 1.4, clear: 0.8 }[k])));
      }
      return finish(team, kindF, phase, st, 0);
    }

    /* --- 反則を受けた後の再開 --- */
    function afterFoul(r) {
      const team = r.spot.team;
      // 反則を受けた側の再開
      if (r.inBox) return { next: { team, kind: 'pkick', u: 0, v: 0, t: T, foulEv: r.ev } };
      if (r.spot.u >= 66) return { next: { team, kind: 'fkAtt', u: r.spot.u, v: r.spot.v, t: T } };
      return { next: { team, kind: 'fk', u: r.spot.u, v: r.spot.v, t: T } };
    }

    /* --- 試合全体 --- */
    // 初期配置（キックオフ）
    {
      const c = { x: PL / 2, y: CY };
      for (let s = 0; s < 22; s++) {
        const tg = shapeTarget(s, { ball: c, poss: null, kick: true });
        kf[s].push({ t: 0, x: tg.x, y: tg.y });
      }
      T = 3.5;
      advance(T, ctxFor(null, c, { kick: true, press: false }));
      ball.push({ kind: 'rest', t0: 0, t1: T, x: c.x, y: c.y });
      B.t = T;
      lineups.push({ t: 0, H: oncourt.H.slice(), A: oncourt.A.slice() });
      periods.push({ q: 1, start: T });
    }

    function runHalf(startTeam, endT) {
      let st = { team: startTeam, kind: 'kickoff', u: 52.5, v: CY, t: T };
      let guard = 0;
      while (guard++ < 400) {
        if (T >= endT && st.kind !== 'pkick' && st.kind !== 'corner') break;
        const team = st.team;
        const before = T;
        let r = possession(team, st);
        if (r && r.foul) r = afterFoul(r);
        if (!r || !r.next) r = { next: { team: other(team), kind: 'gk', u: 5.5, v: CY, t: T + 2 } };
        st = r.next;
        if (T < before + 1) T = before + 1;
        // 攻撃の間の小休止（笛・プレーの切れ目）
        if (st.kind === 'gk' || st.kind === 'fk' || st.kind === 'throw') T += range(0.5, 2.0);
      }
    }

    runHalf('H', 3.5 + halfSec);
    const end1 = T;
    // ハーフタイム（映像はここで一度切れる想定：暗転のあいだに入れ替わる）
    {
      const c = { x: PL / 2, y: CY };
      bRest(T + 1.0);
      advance(T + 1.0, ctxFor(null, c, { press: false, spd: { H: 3, A: 3 } }));
      T += 1.0;
      cuts.push({ t0: T, t1: T + 9, label: '前半終了', h: null });
      const t0 = T;
      half = 2;
      oncourt.H = ROSTER.H.lineup[1].slice();
      oncourt.A = ROSTER.A.lineup[1].slice();
      const tNew = t0 + 9;
      for (let s = 0; s < 22; s++) {
        const l = last(s);
        push(s, t0 + 0.4, l.x, l.y);
        const tg = shapeTarget(s, { ball: c, poss: null, kick: true });
        push(s, t0 + 4.5, tg.x, tg.y);
        push(s, tNew, tg.x, tg.y);
      }
      B.x = c.x;
      B.y = c.y;
      bRest(tNew);
      T = tNew;
      lineups.push({ t: t0 + 4.5, H: oncourt.H.slice(), A: oncourt.A.slice() });
      periods.push({ q: 2, start: T });
    }
    runHalf('A', T + halfSec);
    const end2 = T;
    // 試合終了
    {
      bRest(T + 3);
      advance(T + 3, ctxFor(null, { x: B.x, y: B.y }, { press: false, spd: { H: 3, A: 3 } }));
      T += 3;
    }
    const duration = T + 4;
    kf.forEach((a, s) => {
      if (last(s).t < duration) push(s, duration, last(s).x, last(s).y);
    });
    bRest(duration);

    events.sort((a, b) => a.t - b.t);
    fx.sort((a, b) => a.t - b.t);
    return { seed, duration, kf, ball, fx, lineups, periods, cuts, events, roster: ROSTER, halfSec, end1, end2, counts };
  };

  /** アプリの state 形式に変換 */
  SIM.toState = function (data) {
    const s = SL.defaultState();
    s.title = 'サンプル試合（シミュレーション）';
    s.video = { name: 'サンプル試合（シミュレーション映像）', size: 0, duration: data.duration, sim: true };
    for (const t of ['H', 'A']) {
      s.teams[t].name = ROSTER[t].name;
      s.teams[t].color = ROSTER[t].color;
      s.teams[t].roster = ROSTER[t].players.map((p) => ({ num: p.num, name: p.name, pos: p.pos })).sort((a, b) => a.num - b.num);
    }
    s.periods = data.periods.map((p) => ({ q: p.q, start: Math.round(p.start * 10) / 10 }));
    s.events = data.events.map((e, i) => {
      const o = Object.assign({ id: 'e' + (i + 1) }, e, { t: Math.round(e.t * 10) / 10 });
      return o;
    });
    const byRef = new Map();
    data.events.forEach((e, i) => byRef.set(e, s.events[i]));
    s.events.forEach((e, i) => {
      const src = data.events[i];
      if (src.forRef) e.for = byRef.get(src.forRef).id;
      delete e.forRef;
    });
    s.nextId = s.events.length + 1;
    s.cfg.level = 'club';
    s.cfg.halfMin = SIM.HALF_MIN;
    s.cfg.pre = 8;
    s.cfg.post = 4;
    return s;
  };
})();

</script>
<script>
/* サッカー分析ラボ - サンプル映像の描画（ピッチ・選手・ボール・演出）
 * SL.sim.render(ctx, W, H, t, data) が 1 フレームを描く。実動画と同じ操作で扱えるよう、プレイヤーとハイライト書き出しから呼ばれる。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const SIM = (SL.sim = SL.sim || {});
  const PL = 105;
  const PW = 68;

  const VW = 1280;
  const VH = 720;
  SIM.VW = VW;
  SIM.VH = VH;
  const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';

  /* ---------- 補間（滑らかな動き：Catmull-Rom） ---------- */
  function evalKF(a, t) {
    const n = a.length;
    if (t <= a[0].t) return a[0];
    if (t >= a[n - 1].t) return a[n - 1];
    let lo = 0;
    let hi = n - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (a[mid].t <= t) lo = mid;
      else hi = mid;
    }
    const p1 = a[lo];
    const p2 = a[hi];
    const dt = p2.t - p1.t;
    if (dt <= 1e-6) return p2;
    const p0 = lo > 0 ? a[lo - 1] : p1;
    const p3 = hi < n - 1 ? a[hi + 1] : p2;
    const u = (t - p1.t) / dt;
    // 端の速度（時間あたり）を近傍から求め、暴れないように上限をかける
    const vel = (pa, pb) => {
      const d = pb.t - pa.t;
      if (d <= 1e-6) return [0, 0];
      let vx = (pb.x - pa.x) / d;
      let vy = (pb.y - pa.y) / d;
      const sp = Math.hypot(vx, vy);
      if (sp > 9.5) {
        vx *= 9.5 / sp;
        vy *= 9.5 / sp;
      }
      return [vx, vy];
    };
    const m1 = vel(p0, p2);
    const m2 = vel(p1, p3);
    const u2 = u * u;
    const u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1;
    const h10 = u3 - 2 * u2 + u;
    const h01 = -2 * u3 + 3 * u2;
    const h11 = u3 - u2;
    return {
      x: h00 * p1.x + h10 * dt * m1[0] + h01 * p2.x + h11 * dt * m2[0],
      y: h00 * p1.y + h10 * dt * m1[1] + h01 * p2.y + h11 * dt * m2[1],
    };
  }
  SIM.posAt = (data, slot, t) => evalKF(data.kf[slot], t);

  SIM.slotNum = (data, slot, t) => {
    let L = data.lineups[0];
    for (const l of data.lineups) {
      if (l.t <= t) L = l;
      else break;
    }
    return L[slot < 11 ? 'H' : 'A'][slot < 11 ? slot : slot - 11];
  };
  const isGK = (slot) => slot === 0 || slot === 11;

  /** 今どちらが右へ攻めているか（前半: 自チームが右） */
  SIM.halfAt = (data, t) => {
    const p2 = data.periods.find((p) => p.q === 2);
    return p2 && t >= p2.start - 6 ? 2 : 1;
  };

  function ballAt(data, t) {
    const segs = data.ball;
    let lo = 0;
    let hi = segs.length - 1;
    let idx = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (segs[mid].t0 <= t) {
        idx = mid;
        lo = mid + 1;
      } else hi = mid - 1;
    }
    if (idx < 0) return { x: PL / 2, y: PW / 2, h: 0, held: -1 };
    const s = segs[idx];
    if (s.kind === 'rest') return { x: s.x, y: s.y, h: 0, held: -1 };
    if (s.kind === 'hold') {
      const p = SIM.posAt(data, s.slot, t);
      const p2 = SIM.posAt(data, s.slot, t + 0.15);
      let dx = p2.x - p.x;
      let dy = p2.y - p.y;
      const sp = Math.hypot(dx, dy);
      const dir = (s.slot < 11) === (SIM.halfAt(data, t) === 1) ? 1 : -1;
      if (sp > 0.05) {
        dx /= sp;
        dy /= sp;
      } else {
        dx = dir;
        dy = 0;
      }
      // 受け取り／放す瞬間はボールを選手の足元へ寄せる（ぴょんと跳ばないように）
      const edge = Math.min(1, (t - s.t0) / 0.18, (s.t1 - t) / 0.18);
      const off = 0.75 * Math.max(0, edge);
      const bob = Math.abs(Math.sin(t * 9)) * 0.25 * Math.min(1, sp / 3);
      return { x: p.x + dx * off, y: p.y + dy * off, h: bob, held: s.slot };
    }
    const k = Math.min(1, Math.max(0, (t - s.t0) / Math.max(0.01, s.t1 - s.t0)));
    return { x: s.x0 + (s.x1 - s.x0) * k, y: s.y0 + (s.y1 - s.y0) * k, h: Math.sin(k * Math.PI) * (s.arc || 0) * 1.6, held: -1 };
  }
  SIM.ballAt = ballAt;

  /* ---------- ピッチ ---------- */
  let pitchCache = null;
  function drawPitch(W, H) {
    if (pitchCache && pitchCache.w === W && pitchCache.h === H) return pitchCache;
    const cv = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(W, H) : Object.assign(document.createElement('canvas'), { width: W, height: H });
    const c = cv.getContext('2d');
    const sc = Math.min((W - 90) / PL, (H - 30) / PW);
    const ox = (W - PL * sc) / 2;
    const oy = (H - PW * sc) / 2;
    c.fillStyle = '#0c1a12';
    c.fillRect(0, 0, W, H);
    // 芝（縞）
    const stripes = 15;
    for (let i = 0; i < stripes; i++) {
      c.fillStyle = i % 2 ? '#2f8a4a' : '#2a8144';
      c.fillRect(ox + (PL / stripes) * i * sc, oy, (PL / stripes) * sc + 1, PW * sc);
    }
    const M = (x, y) => [ox + x * sc, oy + y * sc];
    c.strokeStyle = 'rgba(245,250,245,0.92)';
    c.lineWidth = Math.max(2, sc * 0.16);
    c.lineCap = 'round';
    c.lineJoin = 'round';
    const rect = (x0, y0, x1, y1) => {
      const [a, b] = M(x0, y0);
      c.strokeRect(a, b, (x1 - x0) * sc, (y1 - y0) * sc);
    };
    rect(0, 0, PL, PW);
    c.beginPath();
    c.moveTo(...M(PL / 2, 0));
    c.lineTo(...M(PL / 2, PW));
    c.stroke();
    c.beginPath();
    c.arc(...M(PL / 2, PW / 2), 9.15 * sc, 0, Math.PI * 2);
    c.stroke();
    c.fillStyle = 'rgba(245,250,245,0.92)';
    c.beginPath();
    c.arc(...M(PL / 2, PW / 2), sc * 0.28, 0, Math.PI * 2);
    c.fill();
    for (const side of [0, 1]) {
      const sgn = side === 0 ? 1 : -1;
      const gx = side === 0 ? 0 : PL;
      const X = (d) => gx + sgn * d;
      // ペナルティエリア／ゴールエリア
      const pa = [X(0), 34 - 20.16, X(16.5), 34 + 20.16];
      const ga = [X(0), 34 - 9.16, X(5.5), 34 + 9.16];
      const r = (q) => rect(Math.min(q[0], q[2]), q[1], Math.max(q[0], q[2]), q[3]);
      r(pa);
      r(ga);
      // ペナルティスポットとアーク
      c.fillStyle = 'rgba(245,250,245,0.92)';
      c.beginPath();
      c.arc(...M(X(11), 34), sc * 0.26, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      const a0 = Math.acos((16.5 - 11) / 9.15);
      const [spx, spy] = M(X(11), 34);
      if (side === 0) c.arc(spx, spy, 9.15 * sc, -a0, a0);
      else c.arc(spx, spy, 9.15 * sc, Math.PI - a0, Math.PI + a0);
      c.stroke();
      // ゴール
      c.save();
      c.fillStyle = 'rgba(255,255,255,0.12)';
      c.strokeStyle = 'rgba(255,255,255,0.9)';
      c.lineWidth = Math.max(2, sc * 0.2);
      const gxA = side === 0 ? gx - 2.2 : gx;
      const [ga0, ga1] = M(gxA, 34 - 3.66);
      c.fillRect(ga0, ga1, 2.2 * sc, 7.32 * sc);
      c.strokeRect(ga0, ga1, 2.2 * sc, 7.32 * sc);
      c.restore();
    }
    // コーナーアーク
    for (const [cx, cy, a1, a2] of [
      [0, 0, 0, Math.PI / 2],
      [PL, 0, Math.PI / 2, Math.PI],
      [PL, PW, Math.PI, Math.PI * 1.5],
      [0, PW, Math.PI * 1.5, Math.PI * 2],
    ]) {
      c.beginPath();
      c.arc(...M(cx, cy), sc * 1.0, a1, a2);
      c.stroke();
    }
    pitchCache = { w: W, h: H, cv, sc, ox, oy };
    return pitchCache;
  }

  /** 1 フレームを描く（ctx は W×H のキャンバス） */
  SIM.render = (ctx, W, H, t, data) => {
    const pc = drawPitch(W, H);
    ctx.drawImage(pc.cv, 0, 0);
    const { sc, ox, oy } = pc;
    const px = (x) => ox + x * sc;
    const py = (y) => oy + y * sc;
    const teamColor = { H: data.roster.H.color, A: data.roster.A.color };
    const gkColor = { H: data.roster.H.gkColor, A: data.roster.A.gkColor };
    const ball = ballAt(data, t);

    // 選手（奥から手前の順に描く）
    const items = [];
    for (let s = 0; s < 22; s++) {
      const p = SIM.posAt(data, s, t);
      items.push({ s, x: p.x + Math.sin(t * 1.9 + s * 1.7) * 0.08, y: p.y + Math.cos(t * 1.4 + s * 2.3) * 0.08 });
    }
    items.sort((a, b) => a.y - b.y);
    const R = 1.75 * sc * 0.62 + 4;
    for (const it of items) {
      const team = it.s < 11 ? 'H' : 'A';
      const x = px(it.x);
      const y = py(it.y);
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x + R * 0.16, y + R * 0.3, R * 1.02, R * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isGK(it.s) ? gkColor[team] : teamColor[team];
      ctx.beginPath();
      ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(2, R * 0.16);
      ctx.strokeStyle = ball.held === it.s ? '#ffe066' : 'rgba(255,255,255,0.92)';
      ctx.stroke();
      ctx.fillStyle = isGK(it.s) ? '#1b1b1b' : '#fff';
      ctx.font = `800 ${Math.round(R * 1.05)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(SIM.slotNum(data, it.s, t)), x, y + R * 0.06);
    }

    // ボール
    {
      const bx = px(ball.x);
      const by = py(ball.y);
      const br = 0.62 * sc * 0.62 + 3 + ball.h * 0.9;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(bx, by + br * 0.6, br * 0.95, br * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      const by2 = by - ball.h * sc * 0.42;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bx, by2, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1b1f2a';
      ctx.lineWidth = Math.max(1.4, br * 0.2);
      ctx.stroke();
      ctx.fillStyle = '#1b1f2a';
      ctx.beginPath();
      ctx.arc(bx, by2, br * 0.36, 0, Math.PI * 2);
      ctx.fill();
    }

    // 演出（ゴール・セーブ・ファウルなど）
    const fxs = data.fx;
    let lo = 0;
    let hi = fxs.length - 1;
    let start = fxs.length;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (fxs[mid].t >= t - 1.9) {
        start = mid;
        hi = mid - 1;
      } else lo = mid + 1;
    }
    for (let i = start; i < fxs.length && fxs[i].t <= t; i++) {
      const f = fxs[i];
      const age = t - f.t;
      const dur = f.kind === 'goal' ? 3.2 : 1.9;
      if (age > dur) continue;
      const a = Math.max(0, 1 - age / dur);
      const x = px(f.x);
      const y = py(f.y) - age * sc * 0.5;
      ctx.globalAlpha = Math.min(1, a * 1.7);
      if (f.kind === 'goal') {
        ctx.strokeStyle = '#3ddc97';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(px(f.x), py(f.y), (0.6 + age * 5) * sc * 0.6, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (f.kind === 'yellow' || f.kind === 'red') {
        ctx.fillStyle = f.kind === 'yellow' ? '#ffd400' : '#ff3b3b';
        ctx.fillRect(x - 9, y - 40, 18, 26);
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x - 9, y - 40, 18, 26);
      }
      const label = f.text;
      const big = f.kind === 'goal';
      ctx.font = `800 ${big ? 46 : 22}px ${FONT}`;
      const tw = ctx.measureText(label).width;
      const padX = big ? 22 : 12;
      const hgt = big ? 68 : 34;
      const fill =
        { goal: '#12b981', save: '#3b82f6', wide: '#64748b', block: '#f59e0b', whistle: '#d97706', yellow: '#b8860b', red: '#dc2626', win: '#22c55e', flag: '#a16207', pk: '#dc2626' }[f.kind] || '#475569';
      ctx.fillStyle = fill;
      const bx0 = x - tw / 2 - padX;
      const by0 = y - hgt / 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx0, by0, tw + padX * 2, hgt, hgt / 2);
      else ctx.rect(bx0, by0, tw + padX * 2, hgt);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x, y + 1);
      ctx.globalAlpha = 1;
    }

    // ハーフタイムの暗転
    for (const cut of data.cuts || []) {
      if (t < cut.t0 - 0.05 || t > cut.t1 + 0.05) continue;
      const fadeIn = Math.min(1, (t - cut.t0) / 0.5);
      const fadeOut = Math.min(1, (cut.t1 - t) / 0.5);
      const a = Math.max(0, Math.min(fadeIn, fadeOut));
      ctx.fillStyle = `rgba(6,10,20,${(0.96 * a).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `800 64px ${FONT}`;
      ctx.fillText(cut.label || 'ハーフタイム', W / 2, H / 2 - 20);
      ctx.font = `600 28px ${FONT}`;
      ctx.fillStyle = '#9fb0d8';
      ctx.fillText('ハーフタイム — 攻める向きが入れ替わります', W / 2, H / 2 + 44);
      ctx.globalAlpha = 1;
    }

    // 透かし
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `600 15px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('サンプル映像（シミュレーション）', 18, H - 12);
  };
})();

</script>
<script>
/* サッカー分析ラボ - ピッチの SVG
 * full()：全面（横向き・右へ攻める向きにそろえる）。タグ付けの位置入力に使う。座標 (px, py)。
 * half()：敵ゴール側の半面（ゴールが上）。ショットマップに使う。座標 (sx, sy)。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const C = SL.C;
  const K = (SL.pitch = {});

  const P = C.PITCH;
  // ペナルティアークの端（PAの外側）
  const ARC_DY = Math.sqrt(P.arcR * P.arcR - (P.boxD - P.spot) * (P.boxD - P.spot));

  /* ---------- 全面 ---------- */
  /**
   * opts: cls, marker:{px,py}, dots:[{px,py,goal,on,blk,color,r}], zonesGrid:true（3分の1の線）
   */
  K.full = (opts) => {
    opts = opts || {};
    const L = P.L;
    const W = P.W;
    let s = `<svg class="${opts.cls || 'pitch-svg full'}" viewBox="-1.5 -1.5 ${L + 3} ${W + 3}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ピッチ（右へ攻める向き）">`;
    s += `<rect x="-1.5" y="-1.5" width="${L + 3}" height="${W + 3}" class="p-out"/>`;
    s += `<rect x="0" y="0" width="${L}" height="${W}" class="p-grass"/>`;
    for (let i = 0; i < 7; i++) s += `<rect x="${(i * L) / 7}" y="0" width="${L / 7}" height="${W}" class="p-stripe${i % 2 ? ' b' : ''}"/>`;
    s += `<g class="p-third"><line x1="35" y1="0" x2="35" y2="${W}"/><line x1="70" y1="0" x2="70" y2="${W}"/></g>`;
    s += `<g class="p-lines" fill="none">
      <rect x="0" y="0" width="${L}" height="${W}"/>
      <line x1="${L / 2}" y1="0" x2="${L / 2}" y2="${W}"/>
      <circle cx="${L / 2}" cy="${W / 2}" r="${P.arcR}"/>
      <rect x="0" y="${W / 2 - P.boxHalf}" width="${P.boxD}" height="${P.boxHalf * 2}"/>
      <rect x="0" y="${W / 2 - P.sixHalf}" width="${P.sixD}" height="${P.sixHalf * 2}"/>
      <rect x="${L - P.boxD}" y="${W / 2 - P.boxHalf}" width="${P.boxD}" height="${P.boxHalf * 2}"/>
      <rect x="${L - P.sixD}" y="${W / 2 - P.sixHalf}" width="${P.sixD}" height="${P.sixHalf * 2}"/>
      <path d="M ${P.boxD} ${W / 2 - ARC_DY} A ${P.arcR} ${P.arcR} 0 0 1 ${P.boxD} ${W / 2 + ARC_DY}"/>
      <path d="M ${L - P.boxD} ${W / 2 - ARC_DY} A ${P.arcR} ${P.arcR} 0 0 0 ${L - P.boxD} ${W / 2 + ARC_DY}"/>
      <rect x="-2" y="${W / 2 - P.goalHalf}" width="2" height="${P.goalHalf * 2}" class="p-goal"/>
      <rect x="${L}" y="${W / 2 - P.goalHalf}" width="2" height="${P.goalHalf * 2}" class="p-goal"/>
    </g>`;
    s += `<g class="p-spots"><circle cx="${L / 2}" cy="${W / 2}" r="0.5"/><circle cx="${P.spot}" cy="${W / 2}" r="0.45"/><circle cx="${L - P.spot}" cy="${W / 2}" r="0.45"/></g>`;
    s += `<g class="p-hint"><text x="17.5" y="${W + 0.2}" text-anchor="middle">自陣</text><text x="52.5" y="${W + 0.2}" text-anchor="middle">中盤</text><text x="87.5" y="${W + 0.2}" text-anchor="middle">敵陣</text></g>`;
    s += `<g class="p-arrow"><path d="M 38 3.4 L 67 3.4 M 63.6 1.4 L 67 3.4 L 63.6 5.4"/><text x="52.5" y="8.2" text-anchor="middle">攻める向き</text></g>`;
    if (opts.dots && opts.dots.length) {
      s += '<g class="dots">';
      for (const d of opts.dots) {
        const cls = d.goal ? 'goal' : d.blk ? 'blk' : d.on ? 'on' : 'off';
        s += `<circle cx="${d.px.toFixed(1)}" cy="${d.py.toFixed(1)}" r="${(d.r || 1.1).toFixed(2)}" class="dot ${cls}" ${d.color ? `style="--dc:${d.color}"` : ''}/>`;
      }
      s += '</g>';
    }
    if (opts.marker) {
      const m = opts.marker;
      s += `<g class="marker"><circle cx="${m.px.toFixed(1)}" cy="${m.py.toFixed(1)}" r="2.4"/><circle cx="${m.px.toFixed(1)}" cy="${m.py.toFixed(1)}" r="0.7" class="core"/></g>`;
    }
    s += '</svg>';
    return s;
  };

  /* ---------- 敵ゴール側の半面（ゴールが上） ---------- */
  K.LABEL = {
    six: [0, 3.2],
    boxC: [0, 11.6],
    boxL: [-14.6, 8.6],
    boxR: [14.6, 8.6],
    edgeC: [0, 21.2],
    edgeL: [-14.6, 21.2],
    edgeR: [14.6, 21.2],
    wideL: [-27.2, 12],
    wideR: [27.2, 12],
    far: [0, 37],
  };
  const HALF_Y = 52.5;

  /**
   * opts: cls, fills:{zone:color}, labels:{zone:[l1,l2]}, dots:[{sx,sy,goal,on,blk,xg,color}], marker:{sx,sy}
   */
  K.half = (opts) => {
    opts = opts || {};
    const fills = opts.fills || {};
    const fill = (z) => fills[z] || 'transparent';
    const bh = P.boxHalf;
    const sh = P.sixHalf;
    let s = `<svg class="${opts.cls || 'pitch-svg half'}" viewBox="-36 -4.2 72 ${HALF_Y + 6}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ゴール側のピッチ">`;
    s += `<rect x="-36" y="-4.2" width="72" height="${HALF_Y + 6}" class="p-out"/>`;
    s += `<rect x="-34" y="0" width="68" height="${HALF_Y}" class="p-grass"/>`;
    for (let i = 0; i < 7; i++) s += `<rect x="-34" y="${(i * HALF_Y) / 7}" width="68" height="${HALF_Y / 7}" class="p-stripe${i % 2 ? ' b' : ''}"/>`;
    // ゾーン（塗り）
    const z = (id, x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill(id)}" data-zone="${id}" class="zone"/>`;
    s += z('far', -34, 25, 68, HALF_Y - 25);
    s += z('wideL', -34, 0, 34 - bh, 25);
    s += z('wideR', bh, 0, 34 - bh, 25);
    s += z('edgeL', -bh, P.boxD, bh - sh, 25 - P.boxD);
    s += z('edgeR', sh, P.boxD, bh - sh, 25 - P.boxD);
    s += z('edgeC', -sh, P.boxD, sh * 2, 25 - P.boxD);
    s += z('boxL', -bh, 0, bh - sh, P.boxD);
    s += z('boxR', sh, 0, bh - sh, P.boxD);
    s += z('boxC', -sh, P.sixD, sh * 2, P.boxD - P.sixD);
    s += z('six', -sh, 0, sh * 2, P.sixD);
    s += `<g class="p-lines" fill="none">
      <rect x="-34" y="0" width="68" height="${HALF_Y}"/>
      <rect x="${-bh}" y="0" width="${bh * 2}" height="${P.boxD}"/>
      <rect x="${-sh}" y="0" width="${sh * 2}" height="${P.sixD}"/>
      <path d="M ${-ARC_DY} ${P.boxD} A ${P.arcR} ${P.arcR} 0 0 0 ${ARC_DY} ${P.boxD}"/>
      <path d="M ${-P.arcR} ${HALF_Y} A ${P.arcR} ${P.arcR} 0 0 1 ${P.arcR} ${HALF_Y}"/>
      <rect x="${-P.goalHalf}" y="-2.2" width="${P.goalHalf * 2}" height="2.2" class="p-goal"/>
    </g>`;
    s += `<g class="p-spots"><circle cx="0" cy="${P.spot}" r="0.45"/></g>`;
    if (opts.labels) {
      s += '<g class="zone-labels">';
      for (const id of Object.keys(opts.labels)) {
        const p = K.LABEL[id];
        const t = opts.labels[id];
        if (!p || !t) continue;
        s += `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" class="zl1">${t[0]}</text>`;
        if (t[1]) s += `<text x="${p[0]}" y="${p[1] + 2.3}" text-anchor="middle" class="zl2">${t[1]}</text>`;
      }
      s += '</g>';
    }
    if (opts.dots && opts.dots.length) {
      s += '<g class="dots">';
      for (const d of opts.dots) {
        const r = 0.9 + Math.sqrt(Math.max(0, d.xg || 0.05)) * 2.9;
        const cls = d.goal ? 'goal' : d.blk ? 'blk' : d.on ? 'on' : 'off';
        const cx = Math.max(-33.3, Math.min(33.3, d.sx)).toFixed(1);
        const cy = Math.max(0.6, Math.min(HALF_Y - 0.6, d.sy)).toFixed(1);
        s += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" class="dot ${cls}" ${d.color ? `style="--dc:${d.color}"` : ''}>${d.tip ? `<title>${d.tip}</title>` : ''}</circle>`;
      }
      s += '</g>';
    }
    if (opts.marker) s += `<g class="marker"><circle cx="${opts.marker.sx}" cy="${opts.marker.sy}" r="1.8"/><circle cx="${opts.marker.sx}" cy="${opts.marker.sy}" r="0.6" class="core"/></g>`;
    s += '</svg>';
    return s;
  };

  /** マウス位置 → SVG の座標（viewBox 内） */
  K.svgPoint = (svgEl, ev) => {
    const r = svgEl.getBoundingClientRect();
    const vb = svgEl.viewBox.baseVal;
    const scale = Math.min(r.width / vb.width, r.height / vb.height);
    const offX = (r.width - vb.width * scale) / 2;
    const offY = (r.height - vb.height * scale) / 2;
    return { x: vb.x + (ev.clientX - r.left - offX) / scale, y: vb.y + (ev.clientY - r.top - offY) / scale };
  };
  /** 全面のクリック位置 → {px, py}（ピッチ内に収める） */
  K.fullPoint = (svgEl, ev) => {
    const p = K.svgPoint(svgEl, ev);
    return { px: Math.max(0, Math.min(P.L, p.x)), py: Math.max(0, Math.min(P.W, p.y)) };
  };
})();

</script>
<script>
/* サッカー分析ラボ - 映像ソース（実動画 <video> / サンプル映像 canvas）を同じ操作で扱う */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;

  const P = (SL.player = {
    kind: 'none', // 'file' | 'sim' | 'none'
    el: null,
    cv: null,
    ctx: null,
    data: null,
    rate: 1,
    info: { name: '', w: 0, h: 0 },
    _t: 0,
    _playing: false,
    _dur: 0,
    _last: 0,
    _lastT: -1,
    _dirty: true,
    _l: {},
    _url: null,

    on(evt, fn) {
      (P._l[evt] = P._l[evt] || []).push(fn);
    },
    emit(evt, a) {
      (P._l[evt] || []).forEach((fn) => {
        try {
          fn(a);
        } catch (e) {
          console.error(e);
        }
      });
    },

    init() {
      P.el = document.getElementById('vid');
      P.cv = document.getElementById('simCanvas');
      P.ctx = P.cv.getContext('2d');
      ['play', 'pause', 'ended', 'ratechange', 'volumechange'].forEach((n) => P.el.addEventListener(n, () => P.emit('state')));
      requestAnimationFrame(P._loop);
    },

    _loop(now) {
      const dt = P._last ? Math.min(0.1, (now - P._last) / 1000) : 0;
      P._last = now;
      if (P.kind === 'sim') {
        if (P._playing) {
          P._t += dt * P.rate;
          if (P._t >= P._dur) {
            P._t = P._dur;
            P._playing = false;
            P.emit('state');
            P.emit('ended');
          }
          P._dirty = true;
        }
        if (P._dirty) {
          P._dirty = false;
          SL.sim.render(P.ctx, SL.sim.VW, SL.sim.VH, P._t, P.data);
          P.emit('time', P._t);
        }
      } else if (P.kind === 'file') {
        const t = P.el.currentTime;
        if (t !== P._lastT || !P.el.paused) {
          P._lastT = t;
          P.emit('time', t);
        }
      }
      requestAnimationFrame(P._loop);
    },

    get time() {
      return P.kind === 'file' ? P.el.currentTime : P._t;
    },
    get duration() {
      if (P.kind === 'file') return isFinite(P.el.duration) ? P.el.duration : P._dur;
      return P._dur;
    },
    get playing() {
      return P.kind === 'file' ? !P.el.paused && !P.el.ended : P._playing;
    },
    get ready() {
      return P.kind !== 'none';
    },

    _show(kind) {
      const stage = document.getElementById('stage');
      stage.dataset.kind = kind;
    },

    /** 実動画を読み込む。resolve({duration,w,h}) */
    loadFile(file) {
      return new Promise((resolve, reject) => {
        P.pause();
        if (P._url) URL.revokeObjectURL(P._url);
        const url = URL.createObjectURL(file);
        P._url = url;
        P.kind = 'file';
        P.data = null;
        P._show('file');
        const el = P.el;
        el.onerror = () => {
          P.kind = 'none';
          P._show('none');
          reject(new Error('この動画は再生できませんでした。MP4（H.264）などの形式に変換して、もう一度お試しください。'));
        };
        el.onloadedmetadata = async () => {
          try {
            if (!isFinite(el.duration)) {
              // MediaRecorder で作った WebM などは長さが未設定。一度末尾まで移動して長さを確定させる
              await new Promise((r) => {
                const on = () => {
                  el.removeEventListener('timeupdate', on);
                  r();
                };
                el.addEventListener('timeupdate', on);
                el.currentTime = 1e7;
              });
              P._dur = el.duration;
              el.currentTime = 0;
            }
            P._dur = el.duration;
            if (!el.videoWidth) {
              P.kind = 'none';
              P._show('none');
              throw new Error('映像を表示できない形式です（音声だけ読めた可能性があります）。H.264のMP4に変換してから読み込んでください。');
            }
            P.info = { name: file.name, w: el.videoWidth, h: el.videoHeight };
            el.playbackRate = P.rate;
            P._dirty = true;
            P.emit('loaded', P.info);
            P.emit('state');
            resolve({ duration: P.duration, w: el.videoWidth, h: el.videoHeight, name: file.name });
          } catch (e) {
            reject(e);
          }
        };
        el.src = url;
        el.load();
      });
    },

    loadSim(data) {
      P.pause();
      P.kind = 'sim';
      P.data = data;
      P._dur = data.duration;
      P._t = 0;
      P._playing = false;
      P._dirty = true;
      P.info = { name: 'サンプル映像', w: SL.sim.VW, h: SL.sim.VH };
      if (P.el) {
        P.el.removeAttribute('src');
        P.el.load();
      }
      P._show('sim');
      P.emit('loaded', P.info);
      P.emit('state');
    },

    unload() {
      P.pause();
      P.kind = 'none';
      P.data = null;
      P._dur = 0;
      P._t = 0;
      if (P.el) {
        P.el.removeAttribute('src');
        P.el.load();
      }
      P._show('none');
      P.emit('loaded', null);
      P.emit('state');
    },

    play() {
      if (P.kind === 'file') {
        if (P.el.ended) P.el.currentTime = 0;
        const pr = P.el.play();
        if (pr && pr.catch) pr.catch(() => {});
      } else if (P.kind === 'sim') {
        if (P._t >= P._dur - 0.05) P._t = 0;
        P._playing = true;
        P._dirty = true;
        P.emit('state');
      }
    },
    pause() {
      if (P.kind === 'file') {
        if (P.el && !P.el.paused) P.el.pause();
      } else if (P.kind === 'sim') {
        if (P._playing) {
          P._playing = false;
          P.emit('state');
        }
      }
    },
    toggle() {
      if (P.playing) P.pause();
      else P.play();
    },

    /** t 秒へ移動。実動画のときは移動が終わったら resolve */
    seek(t) {
      if (P.kind === 'none') return Promise.resolve();
      t = U.clamp(t, 0, P.duration || 0);
      if (P.kind === 'sim') {
        P._t = t;
        P._dirty = true;
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        const el = P.el;
        if (Math.abs(el.currentTime - t) < 0.02) return resolve();
        let done = false;
        const fin = () => {
          if (done) return;
          done = true;
          el.removeEventListener('seeked', fin);
          resolve();
        };
        el.addEventListener('seeked', fin);
        setTimeout(fin, 2500);
        el.currentTime = t;
      });
    },
    seekBy(dt) {
      return P.seek(P.time + dt);
    },
    setRate(r) {
      P.rate = r;
      if (P.el) P.el.playbackRate = r;
      P.emit('state');
    },
    setMuted(m) {
      if (P.el) P.el.muted = !!m;
      P.emit('state');
    },
    get muted() {
      return !!(P.el && P.el.muted);
    },
  });
})();

</script>
<script>
/* サッカー分析ラボ - タイムライン（タグの分布・前半後半・ハイライト範囲・再生位置） */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const D = SL.derive;
  const C = SL.C;

  const PAD_L = 34;
  const PAD_R = 10;
  const Y_RULER = 0;
  const Y_PER = 19;
  const Y_LANE = { H: 38, A: 74 };
  const LANE_H = 34;
  const Y_CLIP = 111;
  const H_TOTAL = 122;

  const TL = (SL.timeline = {
    cv: null,
    ctx: null,
    tip: null,
    zoomSec: 0, // 0 = 全体
    vs: 0,
    hits: [],
    dragging: false,
    clips: [],
    selectedId: null,
    activeClip: -1,

    init() {
      TL.cv = document.getElementById('timeline');
      TL.ctx = TL.cv.getContext('2d');
      TL.tip = document.getElementById('tlTip');
      TL.redraw = U.rafOnce(TL.draw);
      new ResizeObserver(() => TL.redraw()).observe(TL.cv);
      TL.cv.addEventListener('pointerdown', TL._down);
      TL.cv.addEventListener('pointermove', TL._move);
      TL.cv.addEventListener('pointerup', TL._up);
      TL.cv.addEventListener('pointercancel', TL._up);
      TL.cv.addEventListener('pointerleave', () => {
        if (!TL.dragging) TL._hideTip();
      });
      TL.cv.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          TL.zoomBy(e.deltaY > 0 ? 1.35 : 1 / 1.35, TL._timeAt(e));
        },
        { passive: false }
      );
      document.querySelectorAll('[data-zoom]').forEach((b) =>
        b.addEventListener('click', () => {
          TL.setZoom(+b.dataset.zoom);
        })
      );
      SL.player.on('time', TL.redraw);
      SL.player.on('loaded', TL.redraw);
      SL.store.on(TL.redraw);
    },

    setZoom(sec) {
      TL.zoomSec = sec;
      const t = SL.player.time;
      TL.vs = Math.max(0, t - sec * 0.3);
      document.querySelectorAll('[data-zoom]').forEach((b) => b.classList.toggle('on', +b.dataset.zoom === sec));
      TL.redraw();
    },
    zoomBy(f, aroundT) {
      const dur = TL._duration();
      const cur = TL.zoomSec || dur;
      let next = U.clamp(cur * f, 15, dur);
      if (next >= dur * 0.98) next = 0;
      const a = aroundT == null ? SL.player.time : aroundT;
      const frac = (a - TL.vs) / cur;
      TL.zoomSec = next;
      if (next) TL.vs = a - frac * next;
      document.querySelectorAll('[data-zoom]').forEach((b) => b.classList.toggle('on', +b.dataset.zoom === next));
      TL.redraw();
    },
    setClips(list, activeIdx) {
      TL.clips = list || [];
      TL.activeClip = activeIdx == null ? -1 : activeIdx;
      TL.redraw();
    },
    setSelected(id) {
      TL.selectedId = id;
      TL.redraw();
    },

    _duration() {
      const ev = SL.store.state.events;
      const last = ev.length ? ev[ev.length - 1].t + 15 : 60;
      return Math.max(30, SL.player.duration || last);
    },
    _view() {
      const dur = TL._duration();
      if (!TL.zoomSec || TL.zoomSec >= dur) return [0, dur];
      const z = TL.zoomSec;
      const t = SL.player.time;
      if (!TL.dragging && (t < TL.vs + z * 0.08 || t > TL.vs + z * 0.92)) TL.vs = t - z * 0.3;
      TL.vs = U.clamp(TL.vs, 0, Math.max(0, dur - z));
      return [TL.vs, TL.vs + z];
    },
    _timeAt(e) {
      const r = TL.cv.getBoundingClientRect();
      const [vs, ve] = TL._view();
      const x = U.clamp(e.clientX - r.left, PAD_L, r.width - PAD_R);
      return vs + ((x - PAD_L) / (r.width - PAD_L - PAD_R)) * (ve - vs);
    },

    _near(e) {
      const r = TL.cv.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      let best = null;
      let bd = 11;
      for (const h of TL.hits) {
        const d = Math.hypot(h.x - x, (h.y - y) * 0.7);
        if (d < bd) {
          bd = d;
          best = h;
        }
      }
      return best;
    },
    _down(e) {
      TL.cv.setPointerCapture(e.pointerId);
      const hit = TL._near(e);
      if (hit) {
        SL.ui.selectEvent(hit.ev.id, { seek: true });
        return;
      }
      TL.dragging = true;
      SL.ui.userSeek();
      SL.player.seek(TL._timeAt(e));
    },
    _move(e) {
      if (TL.dragging) {
        SL.player.seek(TL._timeAt(e));
        return;
      }
      const hit = TL._near(e);
      if (hit) TL._showTip(hit, e);
      else TL._hideTip();
      TL.cv.style.cursor = hit ? 'pointer' : 'crosshair';
    },
    _up(e) {
      TL.dragging = false;
      try {
        TL.cv.releasePointerCapture(e.pointerId);
      } catch (err) {}
    },
    _showTip(hit, e) {
      const ev = hit.ev;
      const st = SL.store.state;
      const meta = C.EVENTS[ev.type];
      const who = ev.num != null ? SL.store.playerLabel(ev.team, ev.num) : '';
      const extra = [];
      if (ev.type === 'tov') extra.push(C.tovLabel(ev.sub || 'other').replace(/（.*）/, ''));
      if (ev.type === 'foul') extra.push(C.foulLabel(ev.sub || 'other').replace(/（.*）/, ''));
      if (ev.scene && C.isShot(ev)) extra.push(C.sceneShort(ev.scene));
      if (C.isShot(ev)) {
        const pos = C.shotPos(ev);
        if (pos) extra.push(C.zoneLabel(C.zoneFor(pos.sx, pos.sy)) + '（xG ' + SL.xg.of(ev).toFixed(2) + '）');
      } else if (ev.px != null) extra.push(C.fieldZoneShort(C.zoneOfEvent(ev)));
      if (ev.body === 'head') extra.push('ヘディング');
      if (ev.note) extra.push(ev.note);
      TL.tip.innerHTML = `<b>${U.esc(st.teams[ev.team] ? st.teams[ev.team].name : '')}</b> ${U.esc(who)}<br>${U.esc(meta ? meta.label : ev.type)} <span class="dim">${U.fmtTime(ev.t, true)} ${U.esc(D.clockFull(st, ev.t))}</span>${extra.length ? '<br><span class="dim">' + U.esc(extra.join(' ・ ')) + '</span>' : ''}`;
      const box = TL.tip.parentElement.getBoundingClientRect();
      TL.tip.hidden = false;
      const w = TL.tip.offsetWidth;
      let left = e.clientX - box.left + 12;
      if (left + w > box.width - 6) left = e.clientX - box.left - w - 12;
      TL.tip.style.left = Math.max(4, left) + 'px';
      TL.tip.style.top = Math.max(2, e.clientY - box.top - 58) + 'px';
    },
    _hideTip() {
      if (TL.tip) TL.tip.hidden = true;
    },

    draw() {
      const cv = TL.cv;
      if (!cv) return;
      const W = cv.clientWidth;
      const H = H_TOTAL;
      if (!W) return;
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        cv.style.height = H + 'px';
      }
      const c = TL.ctx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, W, H);
      const st = SL.store.state;
      const dur = TL._duration();
      const [vs, ve] = TL._view();
      const span = ve - vs;
      const X = (t) => PAD_L + ((t - vs) / span) * (W - PAD_L - PAD_R);
      const css = getComputedStyle(document.documentElement);
      const col = (n, d) => css.getPropertyValue(n).trim() || d;
      const cText = col('--muted', '#95a3c0');
      const cLine = col('--line', '#2a3653');
      const cAccent = col('--accent', '#2fd27f');

      // レーンの背景
      for (const t of ['H', 'A']) {
        c.fillStyle = 'rgba(255,255,255,0.03)';
        c.fillRect(PAD_L, Y_LANE[t], W - PAD_L - PAD_R, LANE_H);
        c.fillStyle = st.teams[t].color;
        c.globalAlpha = 0.85;
        c.fillRect(0, Y_LANE[t], 3, LANE_H);
        c.globalAlpha = 1;
        c.fillStyle = cText;
        c.font = '600 11px system-ui, sans-serif';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(t === 'H' ? '自' : '相', 8, Y_LANE[t] + LANE_H / 2);
      }

      // 目盛り
      const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];
      const step = steps.find((s) => (s / span) * (W - PAD_L - PAD_R) >= 64) || 3600;
      c.strokeStyle = cLine;
      c.fillStyle = cText;
      c.font = '10px system-ui, sans-serif';
      c.textAlign = 'left';
      c.textBaseline = 'top';
      c.lineWidth = 1;
      for (let t = Math.ceil(vs / step) * step; t <= ve + 1e-6; t += step) {
        const x = Math.round(X(t)) + 0.5;
        c.beginPath();
        c.moveTo(x, Y_RULER + 12);
        c.lineTo(x, H - 14);
        c.globalAlpha = 0.35;
        c.stroke();
        c.globalAlpha = 1;
        c.fillText(U.fmtTime(t), x + 3, Y_RULER + 1);
      }

      // 前半・後半の帯
      const ps = st.periods.slice().sort((a, b) => a.start - b.start);
      ps.forEach((p, i) => {
        const s0 = p.start;
        const e0 = i + 1 < ps.length ? ps[i + 1].start : dur;
        const x0 = X(Math.max(s0, vs));
        const x1 = X(Math.min(e0, ve));
        if (x1 <= x0) return;
        c.fillStyle = i % 2 ? 'rgba(90,130,255,0.10)' : 'rgba(255,255,255,0.05)';
        c.fillRect(x0, Y_PER, x1 - x0, 14);
        if (s0 >= vs - 1e-6) {
          c.fillStyle = '#c8d3ee';
          c.font = '700 10px system-ui, sans-serif';
          c.textBaseline = 'middle';
          c.fillText(D.qLabel(p.q), x0 + 4, Y_PER + 7.5);
          c.strokeStyle = 'rgba(200,215,255,0.5)';
          c.beginPath();
          c.moveTo(Math.round(x0) + 0.5, Y_PER);
          c.lineTo(Math.round(x0) + 0.5, Y_LANE.A + LANE_H);
          c.stroke();
        }
      });

      // ハイライト範囲（ハイライトタブを開いている間だけ表示）
      if (TL.clips.length && (SL.ui.tab === 'hl' || (SL.hl && SL.hl.st.playing))) {
        TL.clips.forEach((cl, i) => {
          if (cl.end < vs || cl.start > ve) return;
          const x0 = X(Math.max(cl.start, vs));
          const x1 = X(Math.min(cl.end, ve));
          c.fillStyle = i === TL.activeClip ? '#ffd166' : cl.ptsAgainst ? 'rgba(255,107,107,0.8)' : 'rgba(61,220,151,0.75)';
          c.fillRect(x0, Y_CLIP, Math.max(2, x1 - x0), 7);
        });
      }

      // タグのマーカー
      TL.hits = [];
      const many = span / (W - PAD_L - PAD_R) > 2.5; // 1px が 2.5 秒超なら小さめ
      for (const e of st.events) {
        if (e.t < vs - 1 || e.t > ve + 1) continue;
        const team = e.team === 'A' ? 'A' : 'H';
        const x = X(e.t);
        const y = Y_LANE[team] + LANE_H / 2;
        const meta = C.EVENTS[e.type] || {};
        const tc = st.teams[team].color;
        const r = many ? 3.2 : 4.6;
        c.lineWidth = 1.6;
        switch (e.type) {
          case 'goal':
          case 'pkg':
            c.fillStyle = tc;
            c.beginPath();
            c.arc(x, y, r + 2.6, 0, Math.PI * 2);
            c.fill();
            c.strokeStyle = '#fff';
            c.lineWidth = 1.8;
            c.stroke();
            if (!many) {
              c.fillStyle = '#fff';
              c.font = '800 8px system-ui, sans-serif';
              c.textAlign = 'center';
              c.textBaseline = 'middle';
              c.fillText(e.type === 'pkg' ? 'P' : 'G', x, y + 0.5);
            }
            break;
          case 'og':
            c.fillStyle = '#ff9f43';
            c.beginPath();
            c.arc(x, y, r + 1.6, 0, Math.PI * 2);
            c.fill();
            break;
          case 'sot':
            c.strokeStyle = tc;
            c.lineWidth = 2.2;
            c.beginPath();
            c.arc(x, y, r + 0.4, 0, Math.PI * 2);
            c.stroke();
            c.fillStyle = tc;
            c.globalAlpha = 0.4;
            c.fill();
            c.globalAlpha = 1;
            break;
          case 'soff':
            c.strokeStyle = tc;
            c.lineWidth = 1.4;
            c.beginPath();
            c.arc(x, y, r - 1, 0, Math.PI * 2);
            c.stroke();
            break;
          case 'sblk':
            c.strokeStyle = tc;
            c.lineWidth = 1.6;
            c.beginPath();
            c.moveTo(x - 3.4, y - 3.4);
            c.lineTo(x + 3.4, y + 3.4);
            c.moveTo(x + 3.4, y - 3.4);
            c.lineTo(x - 3.4, y + 3.4);
            c.stroke();
            break;
          case 'pkx':
            c.strokeStyle = tc;
            c.lineWidth = 1.6;
            c.strokeRect(x - 3.4, y - 3.4, 6.8, 6.8);
            break;
          case 'ast':
          case 'kp':
            c.fillStyle = meta.color;
            c.beginPath();
            c.moveTo(x, y - 12);
            c.lineTo(x - 3.6, y - 5.6);
            c.lineTo(x + 3.6, y - 5.6);
            c.closePath();
            c.fill();
            break;
          case 'tkl':
          case 'itc':
            c.fillStyle = meta.color;
            c.beginPath();
            c.moveTo(x, y + 6);
            c.lineTo(x + 4, y + 11);
            c.lineTo(x, y + 16);
            c.lineTo(x - 4, y + 11);
            c.closePath();
            c.fill();
            break;
          case 'clr':
            c.fillStyle = meta.color;
            c.fillRect(x - 2, y + 6.5, 4, 4.5);
            break;
          case 'ck':
            c.fillStyle = meta.color;
            c.beginPath();
            c.moveTo(x - 1, y - 12);
            c.lineTo(x + 5, y - 9);
            c.lineTo(x - 1, y - 6);
            c.closePath();
            c.fill();
            c.fillRect(x - 2, y - 12, 1.4, 8);
            break;
          case 'tov':
            c.strokeStyle = meta.color;
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(x - 4, y - 4);
            c.lineTo(x + 4, y + 4);
            c.moveTo(x + 4, y - 4);
            c.lineTo(x - 4, y + 4);
            c.stroke();
            break;
          case 'foul':
            c.fillStyle = meta.color;
            c.fillRect(x - 1.6, y - 9, 3.2, 8);
            break;
          case 'off':
            c.fillStyle = meta.color;
            c.beginPath();
            c.moveTo(x - 3, y + 6);
            c.lineTo(x + 4, y + 9);
            c.lineTo(x - 3, y + 12);
            c.closePath();
            c.fill();
            break;
          case 'yc':
          case 'rc':
            c.fillStyle = meta.color;
            c.fillRect(x - 3, y - 6, 6, 9);
            c.strokeStyle = 'rgba(0,0,0,0.4)';
            c.lineWidth = 1;
            c.strokeRect(x - 3, y - 6, 6, 9);
            break;
          case 'note':
            c.fillStyle = '#fff';
            c.beginPath();
            c.arc(x, Y_LANE.H - 4, 3.4, 0, Math.PI * 2);
            c.fill();
            break;
        }
        if (e.id === TL.selectedId) {
          c.strokeStyle = '#fff';
          c.lineWidth = 2;
          c.beginPath();
          c.arc(x, y, 10, 0, Math.PI * 2);
          c.stroke();
        }
        TL.hits.push({ x, y: e.type === 'note' ? Y_LANE.H - 4 : y, ev: e });
      }

      // 再生位置
      const px = X(SL.player.time);
      if (px >= PAD_L - 1 && px <= W - PAD_R + 1) {
        c.strokeStyle = cAccent;
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(px, 12);
        c.lineTo(px, H - 12);
        c.stroke();
        c.fillStyle = cAccent;
        c.beginPath();
        c.moveTo(px - 5, 6);
        c.lineTo(px + 5, 6);
        c.lineTo(px, 14);
        c.closePath();
        c.fill();
      }
    },
  });
})();

</script>
<script>
/* サッカー分析ラボ - タグ付けの入力（背番号 → プレー）とフォローアップ（ラストパス／ボールロストの種類／ファウルを受けた選手） */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;

  // 攻撃の型（場面）を記録するプレー。PK は自動で「PK」になる
  const SCENE_TYPES = new Set(['goal', 'sot', 'soff', 'sblk']);
  // これが付くと攻撃が一区切りになるので、場面を初期値に戻す
  const TERMINAL = new Set(['goal', 'sot', 'soff', 'sblk', 'pkg', 'pkx', 'og', 'tov']);
  const r1 = (v) => Math.round(v * 10) / 10;

  const TG = (SL.tagger = {
    team: 'H',
    scene: C.SCENE_DEFAULT,
    lock: false,
    pending: { num: null, ev: null },
    buf: '',
    _bufTimer: null,
    _followTimer: null,
    follow: null,
    attrs: { head: false, loc: null },
    _l: new Set(),

    onChange(fn) {
      TG._l.add(fn);
    },
    changed() {
      TG._l.forEach((f) => f());
    },

    /** タグを付ける時刻。再生中は少し前（反応遅れ分）に置く */
    eventTime() {
      const P = SL.player;
      const cfg = SL.store.state.cfg;
      const t = P.time - (P.playing ? cfg.delay || 0 : 0);
      return Math.max(0, Math.round(t * 10) / 10);
    },

    setTeam(t) {
      if (TG.team === t) return;
      TG.team = t;
      TG.pending.num = null;
      TG._clearBuf();
      TG.follow = null;
      TG.changed();
    },
    toggleTeam() {
      TG.setTeam(TG.team === 'H' ? 'A' : 'H');
    },
    setScene(id) {
      TG.scene = id;
      TG.changed();
    },
    cycleScene(dir) {
      const ids = C.SCENES.map((s) => s.id);
      const i = ids.indexOf(TG.scene);
      TG.scene = ids[(i + dir + ids.length) % ids.length];
      TG.changed();
    },
    toggleLock() {
      TG.lock = !TG.lock;
      TG.changed();
    },
    setLoc(loc) {
      TG.attrs.loc = loc;
      TG.changed();
    },
    toggleHead() {
      TG.attrs.head = !TG.attrs.head;
      TG.changed();
    },

    /* ----- 背番号の入力（数字キー） ----- */
    _clearBuf() {
      TG.buf = '';
      clearTimeout(TG._bufTimer);
    },
    /** ラストパス／被ファウル／ロストの種類の入力待ち。しばらく何もしなければ自動で閉じる */
    setFollow(f) {
      TG.follow = f;
      clearTimeout(TG._followTimer);
      if (f) {
        TG._followTimer = setTimeout(() => {
          if (TG.follow === f && !TG.buf) {
            TG.follow = null;
            TG.changed();
          }
        }, 12000);
      }
    },
    digit(d) {
      const f = TG.follow;
      if (f && f.kind === 'sub') {
        const i = parseInt(d, 10) - 1;
        if (C.TOV_TYPES[i]) {
          TG.applySub(C.TOV_TYPES[i].id);
          return;
        }
        TG.follow = null; // 種類の番号ではない数字は、次の背番号として扱う
      }
      TG.buf = (TG.buf + d).slice(-2);
      clearTimeout(TG._bufTimer);
      TG._bufTimer = setTimeout(TG.resolveBuf, 900);
      TG.changed();
    },
    resolveBuf() {
      if (!TG.buf) return;
      const num = parseInt(TG.buf, 10);
      TG._clearBuf();
      TG.playerChosen(TG.team, num);
    },
    playerChosen(team, num) {
      if (!SL.player.ready) {
        U.toast('先に動画を読み込んでください（右上の「📂 動画を読み込む」）', 'bad');
        TG.pending = { num: null, ev: null };
        return;
      }
      const f = TG.follow;
      if (f && f.kind === 'pass') {
        if (f.team === team) TG.applyPass(num);
        return;
      }
      if (f && f.kind === 'victim') {
        TG.applyVictim(num);
        return;
      }
      if (num !== 0 && !SL.store.findPlayer(team, num)) {
        SL.store.ensurePlayer(team, num);
        U.toast(`${SL.store.teamName(team)} に背番号 ${num} を追加しました（名前は「設定」で入力できます）`);
      }
      if (team !== TG.team) TG.team = team;
      TG.pending.num = num;
      TG.tryCommit();
      TG.changed();
    },

    /* ----- マウス操作 ----- */
    pickPlayer(team, num) {
      TG._clearBuf();
      TG.playerChosen(team, num);
    },
    pickEvent(type) {
      if (TG.buf) TG.resolveBuf();
      const meta = C.EVENTS[type];
      if (!meta) return;
      TG.follow = null;
      TG.pending.ev = type;
      TG.tryCommit();
      TG.changed();
    },

    /** 選手と種類がそろったら記録する */
    tryCommit() {
      const ev = TG.pending.ev;
      if (!ev) return null;
      const meta = C.EVENTS[ev];
      if (!meta.noPlayer && TG.pending.num == null) return null;
      if (!SL.player.ready) {
        U.toast('先に動画を読み込んでください（右上の「📂 動画を読み込む」）', 'bad');
        TG.pending = { num: null, ev: null };
        return null;
      }
      const rec = { t: TG.eventTime(), type: ev, team: TG.team, num: meta.noPlayer ? null : TG.pending.num };
      if (SCENE_TYPES.has(ev)) rec.scene = TG.scene;
      if (meta.pk) rec.scene = 'pk';
      if (meta.loc && TG.attrs.loc) {
        rec.px = r1(TG.attrs.loc.px);
        rec.py = r1(TG.attrs.loc.py);
      }
      if (meta.shot && !meta.pk && TG.attrs.head) rec.body = 'head';
      const saved = SL.store.addEvent(rec);
      TG.pending = { num: null, ev: null };
      TG.attrs = { head: false, loc: null };
      if (!TG.lock && TERMINAL.has(ev)) TG.scene = C.SCENE_DEFAULT;
      TG.setFollow(null);
      if (meta.shot && !meta.pk) TG.setFollow({ kind: 'pass', team: saved.team, shotId: saved.id, t: saved.t, isGoal: ev === 'goal' });
      else if (ev === 'tov') TG.setFollow({ kind: 'sub', of: 'tov', id: saved.id, team: saved.team });
      else if (ev === 'foul') TG.setFollow({ kind: 'victim', id: saved.id, team: saved.team, vsTeam: D.other(saved.team) });
      SL.ui.onTagged(saved);
      if (ev === 'note') SL.ui.openEdit(saved.id);
      return saved;
    },

    applyPass(num) {
      const f = TG.follow;
      if (!f || f.kind !== 'pass') return;
      SL.store.ensurePlayer(f.team, num);
      const ev = SL.store.addEvent({ t: Math.round((f.t + 0.1) * 10) / 10, type: f.isGoal ? 'ast' : 'kp', team: f.team, num, for: f.shotId }, { noHist: true });
      TG.follow = null;
      SL.ui.onTagged(ev);
      TG.changed();
    },
    applyVictim(num) {
      const f = TG.follow;
      if (!f || f.kind !== 'victim') return;
      SL.store.ensurePlayer(f.vsTeam, num);
      SL.store.updateEvent(f.id, { vs: num }, { noHist: true });
      TG.follow = null;
      U.toast(`ファウルを受けた選手：${SL.store.playerLabel(f.vsTeam, num)}`);
      TG.changed();
    },
    applySub(id) {
      const f = TG.follow;
      if (!f || f.kind !== 'sub') return;
      SL.store.updateEvent(f.id, { sub: id }, { noHist: true });
      TG.follow = null;
      TG.changed();
    },
    skipFollow() {
      TG.follow = null;
      TG.changed();
    },

    enter() {
      if (TG.buf) TG.resolveBuf();
      else if (TG.follow) TG.skipFollow();
    },
    esc() {
      TG._clearBuf();
      TG.pending = { num: null, ev: null };
      TG.follow = null;
      TG.attrs = { head: false, loc: null };
      TG.changed();
    },

    markPeriod(q) {
      // 前半もキックオフの位置で区切れる（動画の頭にオープニングがある場合など）
      SL.store.setPeriodStart(q, SL.player.time);
      U.toast(`${D.qLabel(q)} の開始（キックオフ）を ${U.fmtTime(SL.player.time, true)} に設定しました`);
    },

    /** キー入力。処理したら true */
    handleKey(e) {
      const code = e.code;
      const m = /^Digit(\d)$/.exec(code) || /^Numpad(\d)$/.exec(code);
      if (m) {
        TG.digit(m[1]);
        SL.ui.flashKey(m[1]);
        return true;
      }
      if (C.KEY_TO_EVENT[code]) {
        SL.ui.flashKey(C.EVENTS[C.KEY_TO_EVENT[code]].kl);
        TG.pickEvent(C.KEY_TO_EVENT[code]);
        return true;
      }
      switch (code) {
        case 'KeyV':
          TG.toggleTeam();
          return true;
        case 'KeyL':
          TG.toggleLock();
          return true;
        case 'KeyH':
          TG.toggleHead();
          return true;
        case 'Enter':
        case 'NumpadEnter':
          TG.enter();
          return true;
        case 'Escape':
          TG.esc();
          return true;
        case 'Comma':
          TG.cycleScene(-1);
          return true;
        case 'Period':
          TG.cycleScene(1);
          return true;
      }
      return false;
    },
  });
})();

</script>
<script>
/* サッカー分析ラボ - ハイライト（クリップ作成・連続プレビュー・動画書き出し）
 * 得点シーン（自チームのゴール）と失点シーン（相手のゴール）は、攻撃の始まりから得点までをまるごと切り出す。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const X = SL.xg;
  const GL = SL.goals;

  const SHOTS = C.SHOT_TYPES;

  const HL = (SL.hl = {
    st: {
      presetId: 'score_us',
      filter: null, // 「自分で選ぶ」や、アドバイスから開いた条件
      filterLabel: '',
      num: null,
      q: null,
      causes: [], // 得点／失点シーンで絞り込む原因・型（空 = すべて）
      order: 'time', // 'time' | 'score' | 'manual' | 'cause'
      lower: true,
      scorebug: true,
      titleCard: true,
      edits: {}, // key → {dStart, dEnd, off}
      manual: [],
      playIdx: -1,
      playing: false,
    },
    clips: [],
    _l: new Set(),
    token: 0,
    exporting: null,
    result: null,
  });

  HL.on = (fn) => HL._l.add(fn);
  HL.emit = () => HL._l.forEach((f) => f());

  HL.PRESETS = [
    { id: 'score_us', label: '得点を決めた場面（得点シーン）', desc: '自チームのゴールを、攻撃の始まりから決めるまでまるごと切り出し。決め方（型）で分類', special: 'scored', feature: 'for' },
    { id: 'concede', label: '得点を決められた場面（失点シーン）', desc: '相手のゴールを、攻撃の始まりから切り出し、原因（セットプレー・ロスト後・カウンター…）で分類して見直す', special: 'concede', feature: 'against' },
    { id: 'best', label: 'ベストプレー（おすすめ）', desc: 'ゴール・アシスト・決定機・GKのセーブを自動でランキング', special: 'best' },
    { id: 'shots_us', label: '自チームのシュート全部', desc: 'ゴール・枠内・枠外・ブロックされたシュートを集めます', team: 'H', types: SHOTS },
    { id: 'big', label: '決定機（xG 0.3以上）', desc: '決めた・外した決定機を集めます（フィニッシュの見直し）', special: 'big' },
    { id: 'player', label: '選手ごとのハイライト', desc: '選んだ選手のゴール・アシスト・シュート・守備', team: 'H', types: ['goal', 'pkg', 'ast', 'kp', 'sot', 'soff', 'sblk', 'tkl', 'itc'], needsPlayer: true },
    { id: 'saves', label: 'GKのセーブ', desc: '自チームのGKが止めたシュート', special: 'saves' },
    { id: 'allowed', label: '相手のシュート（被シュート）', desc: '守備の振り返り用。相手が撃った場面をすべて集めます', team: 'A', types: SHOTS },
    { id: 'tov_pts', label: 'ボールロスト → ピンチ', desc: 'ボールを失った直後（12秒以内）に相手が打った場面', special: 'toAllowed' },
    { id: 'tov_us', label: 'ボールロストの場面', desc: '自チームのミスを一覧で見返します', team: 'H', types: ['tov'] },
    { id: 'foul_us', label: 'ファウル・カード', desc: '自チームのファウルとカードの場面', team: 'H', types: ['foul', 'yc', 'rc'] },
    { id: 'ck_us', label: 'コーナーキック（攻撃）', desc: '自チームのコーナーの場面', team: 'H', types: ['ck'] },
    { id: 'spells', label: '押し込んだ／押し込まれた時間帯', desc: '短い時間にシュートが続いた区間（両チーム分）', special: 'spells' },
    { id: 'custom', label: '自分で条件を選ぶ', desc: 'チーム・選手・プレーの種類・攻撃の型を自由に組み合わせます', custom: true },
  ];

  /* ---------- 表示用の文言 ---------- */
  const EV_TEXT = {
    goal: 'ゴール', pkg: 'PKを決めた', pkx: 'PKを外した', og: 'オウンゴール', sot: '枠内シュート', soff: '枠外シュート', sblk: 'ブロックされたシュート',
    ast: 'アシスト', kp: 'キーパス', tkl: 'タックル', itc: 'インターセプト', clr: 'クリア', ck: 'コーナーキック', tov: 'ボールロスト', foul: 'ファウル',
    off: 'オフサイド', yc: 'イエローカード', rc: 'レッドカード', note: 'メモ',
  };
  HL.eventText = (e) => {
    if (e.type === 'tov') return 'ボールロスト（' + C.tovLabel(e.sub || 'other').replace(/（.*）/, '') + '）';
    if (e.type === 'foul') return 'ファウル（' + C.foulLabel(e.sub || 'other').replace(/（.*）/, '') + '）';
    if (e.type === 'goal' && e.body === 'head') return 'ヘディングでゴール';
    return EV_TEXT[e.type] || e.type;
  };
  const PRI = { goal: 5, pkg: 4.5, og: 3, ast: 3, sot: 2.2, kp: 1.6, sblk: 1.2, soff: 1.1, pkx: 2.5, tkl: 1.2, itc: 1.2, clr: 0.8, ck: 0.8, tov: 1.3, foul: 0.9, off: 0.8, yc: 1.5, rc: 3, note: 1 };

  /* ---------- 条件に合うイベント ---------- */
  function matches(e, f, ctx) {
    if (f.team && e.team !== f.team) return false;
    if (f.num != null && e.num !== f.num) return false;
    if (f.types && !f.types.includes(e.type)) return false;
    if (f.sub && e.sub !== f.sub) return false;
    if (f.q && D.periodAt(ctx.periods, e.t) !== f.q) return false;
    if (f.zoneGrp || f.zone) {
      const pos = C.shotPos(e);
      const z = pos ? C.zoneFor(pos.sx, pos.sy) : e.zone;
      if (f.zone && z !== f.zone) return false;
      if (f.zoneGrp && C.zoneGroup(z) !== f.zoneGrp) return false;
    }
    if (f.fieldZones) {
      const z = C.zoneOfEvent(e);
      if (!z || !f.fieldZones.includes(z)) return false;
    }
    if (f.scene) {
      const sc = e.scene || (C.EVENTS[e.type] && C.EVENTS[e.type].pk ? 'pk' : C.SCENE_DEFAULT);
      if (sc !== f.scene) return false;
    }
    return true;
  }
  HL.matches = matches;

  /** その条件に合うクリップ範囲（生）を作る */
  function rawWindows(preset, S, state, dur) {
    const st = HL.st;
    const cfg = state.cfg;
    const pre = cfg.pre;
    const post = cfg.post;
    const ctx = { periods: state.periods };
    const win = [];
    const clampT = (t0, t1) => [Math.max(0, t0), Math.min(dur, t1)];
    const addAnchor = (e, extra) => {
      const [a, b] = clampT(e.t - pre, e.t + post);
      win.push(Object.assign({ start: a, end: b, t: e.t, events: [e], key: e.id, pri: HL.priority(e, S) }, extra || {}));
    };
    const common = (e) => (st.num == null || e.num === st.num) && (!st.q || D.periodAt(state.periods, e.t) === st.q);

    if (preset.needsPlayer && st.num == null) return [];
    let f = null;
    if (preset.custom) f = Object.assign({}, st.filter || {});
    else if (preset.types) f = { team: preset.team, types: preset.types };
    const special = preset.special || (f && f.special);

    if (special === 'concede' || special === 'scored') {
      const side = special === 'concede' ? 'against' : 'for';
      const items = GL.build(state, S, { side });
      const sel = st.causes && st.causes.length ? new Set(st.causes) : f && f.causes ? new Set(f.causes) : f && f.cause ? new Set([f.cause]) : null;
      for (const it of items) {
        if (sel && !it.causes.some((c) => sel.has(c))) continue;
        if (st.num != null && !it.scorers.some((s) => s.num === st.num)) continue;
        if (st.q && it.q !== st.q) continue;
        win.push({ start: it.start, end: Math.min(dur, it.end), t: it.t, events: it.events, key: it.key, pri: 3 + it.xg * 3, label: it.label, team: it.team, noMerge: true, gl: it, side });
      }
      return win;
    }
    if (special === 'toAllowed') {
      const team = (f && f.team) || 'H';
      for (const s of S.tov[team].seq) {
        const [a, b] = clampT(s.from - 5, s.to + 2.5);
        const evs = S.events.filter((e) => e.t >= s.from - 1.2 && e.t <= s.to + 1);
        win.push({ start: a, end: b, t: s.from, events: evs, key: 'toa' + s.from.toFixed(1), pri: s.goal ? 5 : 3, label: 'ボールロスト → ' + (s.goal ? '失点' : '相手のシュート'), team });
      }
      return win;
    }
    if (special === 'regainAtk') {
      const team = (f && f.team) || 'H';
      for (const s of S.regain[team].seq) {
        const [a, b] = clampT(s.from - 4, s.to + 3);
        const evs = S.events.filter((e) => e.t >= s.from - 1 && e.t <= s.to + 1);
        win.push({ start: a, end: b, t: s.from, events: evs, key: 'rg' + s.from.toFixed(1), pri: s.goal ? 5 : 3, label: 'ボール奪取 → ' + (s.goal ? '得点' : 'シュート'), team });
      }
      return win;
    }
    if (special === 'foulSet') {
      const team = (f && f.team) || 'H';
      for (const s of S.fouls[team].setSeq) {
        const [a, b] = clampT(s.from - 4, s.to + 3);
        const evs = S.events.filter((e) => e.t >= s.from - 1 && e.t <= s.to + 1);
        win.push({ start: a, end: b, t: s.from, events: evs, key: 'fs' + s.from.toFixed(1), pri: s.goal ? 5 : 3, label: 'ファウル → ' + (s.goal ? 'セットプレーで失点' : 'セットプレー'), team });
      }
      return win;
    }
    if (special === 'spells') {
      const list = f && f.team ? S.spells.filter((s) => s.team === f.team) : S.spells;
      for (const r of list) {
        const [a, b] = clampT(r.t0 - 6, r.t1 + 3);
        const evs = S.events.filter((e) => e.t >= r.t0 - 0.1 && e.t <= r.t1 + 0.1);
        win.push({ start: a, end: b, t: r.t0, events: evs, key: 'sp' + r.team + r.t0.toFixed(1), pri: 3 + r.n / 2, label: `${state.teams[r.team].name}が押し込んだ時間帯（シュート${r.n}本${r.goals ? '・' + r.goals + '得点' : ''}）`, team: r.team, noMerge: true });
      }
      return win;
    }
    if (special === 'saves') {
      const team = (f && f.team) || 'H'; // このチームのGKのセーブ
      for (const e of S.events) {
        if (e.team === D.other(team) && (e.type === 'sot' || (e.type === 'pkx' && e.sub === 'saved')) && common(e)) addAnchor(e, { label: 'GKのセーブ（' + SL.store.playerLabel(D.other(team), e.num) + 'のシュート）', team });
      }
      return win;
    }
    if (special === 'big') {
      const team = (f && f.team) || 'H';
      const missed = !!(f && f.missed);
      for (const e of S.events) {
        if (!C.isShot(e) || e.team !== team || e.type === 'pkg' || e.type === 'pkx' || !common(e)) continue;
        const xg = S.xgOf.get(e.id).xg;
        if (xg < X.BIG) continue;
        if (missed && D.isGoal(e)) continue;
        addAnchor(e, { pri: 3 + xg * 5, label: `決定機（xG ${xg.toFixed(2)}）${SL.store.playerLabel(e.team, e.num)} ${D.isGoal(e) ? 'ゴール' : e.type === 'sot' ? '枠内シュート' : e.type === 'soff' ? '枠外シュート' : 'ブロックされたシュート'}` });
      }
      return win;
    }
    if (special === 'best') {
      const types = ['goal', 'pkg', 'ast', 'sot', 'kp'];
      for (const e of S.events) {
        if (!common(e)) continue;
        if (e.team === 'H' && types.includes(e.type)) {
          if (e.type === 'sot' || e.type === 'kp') {
            const xg = e.type === 'sot' ? S.xgOf.get(e.id).xg : 0;
            if (e.type === 'sot' && xg < X.BIG) continue;
            if (e.type === 'kp') continue;
          }
          addAnchor(e);
        } else if (e.team === 'A' && e.type === 'sot' && S.gk.H != null) {
          addAnchor(e, { label: 'GKのセーブ（' + SL.store.playerLabel('H', S.gk.H) + '）', pri: 2.6 });
        }
      }
      return win;
    }
    if (f) {
      for (const e of S.events) {
        if (!matches(e, f, ctx) || !common(e)) continue;
        addAnchor(e);
      }
    }
    return win;
  }

  /** クリップの重要度（得点・種類・xG・リードチェンジ） */
  HL.priority = (e, S) => {
    let p = PRI[e.type] || 0;
    if (C.isShot(e) && S && S.xgOf && S.xgOf.has(e.id)) p += S.xgOf.get(e.id).xg * 4;
