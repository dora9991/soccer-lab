      <div class="sect"><h4>セットプレー</h4>${setpTable(S, st)}</div>
      <div class="sect"><h4>時間帯別</h4>${bucketsTable(S, st)}</div>
      <div class="sect note-card"><h4>プロの見方：この画面の使い方</h4>
        <p><b>失点は「どう決められたか」で分類</b>します。セットプレー・ボールを失った直後・カウンター・クロス・ミドルなど、原因が違えば直す練習も違います。得点側も同じ分類で「自分たちの武器」を確認します。</p>
        <p><b>xG（ゴール期待値）</b>は、プロが「運」と「実力」を切り分けるために使う指標です。撃った位置から見た“決まりやすさ”の合計なので、結果（得点）とのずれが大きいときは、決定力か運かを疑います。</p>
        <p>相手のプレー（右上のボタン）を見ると、「自チームがどこで守れていないか」が分かります。</p></div>`;
  }

  SL.ui.register({
    id: 'scenes',
    label: '場面別',
    icon: '🎯',
    init(root) {
      root.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const d = b.dataset;
        const name = (t) => SL.store.state.teams[t].name;
        switch (d.act) {
          case 'steam':
            vsc.team = d.team;
            SL.ui.renderActive(true);
            break;
          case 'glopen':
            SL.hl.openGoals(d.side);
            break;
          case 'glcause':
            SL.hl.openGoals(d.side, d.id);
            break;
          case 'scenehl':
            SL.hl.open({ team: d.team, scene: d.scene, types: SHOTS }, `${name(d.team)}の${C.sceneShort(d.scene)}`);
            break;
          case 'tovhl':
            SL.hl.open({ team: d.team, types: ['tov'], sub: d.sub }, `${C.tovLabel(d.sub).replace(/（.*）/, '')}`);
            break;
          case 'tovzone':
            SL.hl.open({ team: d.team, types: ['tov'], fieldZones: [d.zone] }, `${C.fieldZoneShort(d.zone)}でのボールロスト`);
            break;
          case 'tovplayer':
            SL.hl.open({ team: d.team, types: ['tov'], num: +d.num }, `${SL.store.playerLabel(d.team, +d.num)}のボールロスト`);
            break;
          case 'toallowed':
            SL.hl.open({ special: 'toAllowed', team: d.team }, 'ボールロスト → ピンチ');
            break;
          case 'foulplayer':
            SL.hl.open({ team: d.team, types: ['foul', 'yc', 'rc'], num: +d.num }, `${SL.store.playerLabel(d.team, +d.num)}のファウル`);
            break;
          case 'foulzone':
            SL.hl.open({ team: d.team, types: ['foul'], fieldZones: [d.zone] }, `${C.fieldZoneShort(d.zone)}でのファウル`);
            break;
          case 'foulset':
            SL.hl.open({ special: 'foulSet', team: d.team }, 'ファウル → FK/PK');
            break;
        }
      });
    },
    render: renderScenes,
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「ショット」タブ（ショットマップ） */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const ST = SL.stats;
  const X = SL.xg;
  const esc = U.esc;
  const pct = ST.fmtPct;

  const vs = { team: 'H', num: 'all', res: 'all', q: 0, mode: 'both', metric: 'shots' };
  const SHOTS = C.SHOT_TYPES;

  /** 0〜1 を色にする（低い=青緑 / 高い=黄〜赤） */
  function heat(v) {
    const stops = [
      [0, [70, 130, 200]],
      [0.5, [240, 190, 70]],
      [1, [235, 80, 70]],
    ];
    const x = Math.max(0, Math.min(1, v));
    const a = x < 0.5 ? stops[0] : stops[1];
    const b = x < 0.5 ? stops[1] : stops[2];
    const k = (x - a[0]) / (b[0] - a[0]);
    const c = a[1].map((n, i) => Math.round(n + (b[1][i] - n) * k));
    return `rgba(${c[0]},${c[1]},${c[2]},${(0.28 + 0.4 * x).toFixed(2)})`;
  }

  function render(root) {
    const st = SL.store.state;
    const S = ST.compute(st);
    const inScope = (e) => C.isShot(e) && e.team === vs.team && (vs.num === 'all' || e.num === +vs.num) && (!vs.q || D.periodAt(st.periods, e.t) === vs.q);
    const base = S.events.filter(inScope);
    const zt = ST.zoneTable(base);
    const resOk = (e) => {
      if (vs.res === 'goal') return D.isGoal(e);
      if (vs.res === 'sot') return e.type === 'sot';
      if (vs.res === 'miss') return e.type === 'soff' || e.type === 'sblk' || e.type === 'pkx';
      return true;
    };
    const metricOf = (r) => (vs.metric === 'xg' ? r.xg : vs.metric === 'goals' ? r.goals : r.shots);
    const mx = Math.max(0.0001, ...C.ZONES.map((z) => metricOf(zt.rows[z.id])));
    const fills = {};
    const labels = {};
    C.ZONES.forEach((z) => {
      const r = zt.rows[z.id];
      if (r.shots > 0 && (vs.mode === 'zone' || vs.mode === 'both')) {
        fills[z.id] = heat(metricOf(r) / mx);
        labels[z.id] = [`${r.shots}本`, `${r.goals}点 xG${r.xg.toFixed(1)}`];
      }
    });
    const dots =
      vs.mode === 'zone'
        ? []
        : base
            .filter((e) => e.px != null && resOk(e))
            .map((e) => {
              const pos = C.shotPos(e);
              return { sx: pos.sx, sy: pos.sy, goal: D.isGoal(e), on: C.isOnTarget(e), blk: e.type === 'sblk', xg: X.of(e), color: st.teams[vs.team].color, tip: esc(`${D.minuteLabel(st, e.t)} ${SL.store.playerLabel(e.team, e.num)} ${C.EVENTS[e.type].label.replace(/（.*）/, '')} xG ${X.of(e).toFixed(2)}`) };
            });
    const svg = SL.pitch.half({ cls: 'pitch-svg half shotchart', fills, labels: vs.mode === 'dots' ? null : labels, dots });

    const roster = st.teams[vs.team].roster;
    const playerOpts = ['<option value="all">全員</option>'].concat(roster.map((p) => `<option value="${p.num}" ${String(vs.num) === String(p.num) ? 'selected' : ''}>#${p.num} ${esc(p.name)}</option>`)).join('');
    const qs = ['<option value="0">全体</option>'].concat(S.halves.map((r) => `<option value="${r.q}" ${vs.q === r.q ? 'selected' : ''}>${D.qLabel(r.q)}</option>`)).join('');

    const g = zt.groups;
    const T = zt.total;
    let insight = '';
    if (zt.located >= 4) {
      const box = g.box;
      const far = g.far;
      insight = `<div class="callout">位置あり ${zt.located}本のうち、ペナルティエリア内 <b>${pct(box.share, 0)}</b>（xG/本 ${box.xgShot == null ? '—' : box.xgShot.toFixed(2)}）／ロングシュート <b>${pct(far.share, 0)}</b>（xG/本 ${far.xgShot == null ? '—' : far.xgShot.toFixed(2)}）。${vs.team === 'H' ? '' : '相手の場合は「守備で打たせている場所」です。'}</div>`;
    }
    const groupRows = C.ZONE_GROUPS.map((gr) => {
      const r = g[gr.id];
      return `<tr class="grp"><td class="l"><b>${esc(gr.label)}</b></td><td class="num">${r.shots}</td><td class="num">${r.sot}</td><td class="num">${r.goals}</td><td class="num">${r.xg.toFixed(2)}</td><td class="num"><b>${r.xgShot == null ? '—' : r.xgShot.toFixed(2)}</b></td><td class="num">${pct(r.share, 0)}</td></tr>`;
    }).join('');
    const zoneRows = C.ZONES.map((z) => zt.rows[z.id])
      .filter((r) => r.shots > 0)
      .sort((a, b) => b.shots - a.shots)
      .map((r) => `<tr><td class="l"><span class="swatch" style="background:${heat(metricOf(r) / mx)}"></span>${esc(C.zoneLabel(r.zone))}</td><td class="num">${r.shots}</td><td class="num">${r.sot}</td><td class="num">${r.goals}</td><td class="num">${r.xg.toFixed(2)}</td><td class="num">${r.xgShot.toFixed(2)}</td><td class="act"><button class="ricon" data-act="zonehl" data-zone="${r.zone}" title="このゾーンのシュートを見る">▶</button></td></tr>`)
      .join('');
    const unknown = zt.rows.unknown.shots;
    const tot = T ? `<p class="dim tiny">合計 ${T}本・ゴール ${base.filter(D.isGoal).length}点・xG ${base.reduce((a, e) => a + X.of(e), 0).toFixed(2)}。</p>` : '';

    root.innerHTML = `
      <div class="pane-head">
        <div class="seggroup">${['H', 'A'].map((t) => `<button class="seg team ${vs.team === t ? 'on' : ''}" data-act="team" data-team="${t}" style="--tc:${st.teams[t].color}">${esc(st.teams[t].name)}${t === 'A' ? '（被シュート）' : ''}</button>`).join('')}</div>
        <label class="inl">選手 <select data-act="num">${playerOpts}</select></label>
        <label class="inl">区間 <select data-act="q">${qs}</select></label>
        <div class="seggroup">${[['zone', 'ゾーン'], ['dots', '点'], ['both', '両方']].map(([k, l]) => `<button class="seg ${vs.mode === k ? 'on' : ''}" data-act="mode" data-mode="${k}">${l}</button>`).join('')}</div>
        <div class="seggroup" title="ゾーンの色の基準">${[['shots', '本数'], ['xg', 'xG'], ['goals', '得点']].map(([k, l]) => `<button class="seg ${vs.metric === k ? 'on' : ''}" data-act="metric" data-metric="${k}">${l}</button>`).join('')}</div>
        <div class="seggroup" title="点表示の絞り込み">${[['all', 'すべて'], ['goal', 'ゴール'], ['sot', '枠内'], ['miss', '枠外・ブロック']].map(([k, l]) => `<button class="seg ${vs.res === k ? 'on' : ''}" data-act="res" data-res="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="shot-layout">
        <div class="shot-court">${svg}
          <div class="legend"><span>色：${vs.metric === 'xg' ? 'xGの合計' : vs.metric === 'goals' ? '得点' : 'シュート本数'}</span><i class="grad heatgrad"></i><span class="lg">少</span><span class="lg">多</span></div>
          <div class="dim tiny dotlegend"><i class="dl goal"></i>ゴール <i class="dl on"></i>枠内 <i class="dl off"></i>枠外 <i class="dl blk"></i>ブロック　大きさ＝xG（決まりやすさ）。ゴールは上。位置を記録していないシュートは点に出ません。</div>
        </div>
        <div class="shot-side">
          ${insight}
          <div class="box-wrap"><table class="tbl zt"><thead><tr><th class="l">エリア</th><th>本数</th><th>枠内</th><th>ゴール</th><th>xG</th><th title="1本あたりのxG">xG/本</th><th>割合</th></tr></thead><tbody>${groupRows}</tbody></table></div>
          ${zoneRows ? `<div class="box-wrap"><table class="tbl zt"><thead><tr><th class="l">ゾーン別</th><th>本数</th><th>枠内</th><th>ゴール</th><th>xG</th><th>xG/本</th><th></th></tr></thead><tbody>${zoneRows}</tbody></table></div>` : '<div class="empty-note">シュートのタグと位置（ピッチ図のクリック）が付くと、ここにゾーン別の表が出ます。</div>'}
          ${unknown ? `<p class="dim tiny">位置が未入力のシュート：${unknown}本（ゾーン別の表には含まれず、xGは平均値で概算しています）。タグ付け時にピッチ図をクリックすると入ります。</p>` : ''}
          ${tot}
          <div class="note-card"><b>プロの見方</b><p>プロの分析では、ショットマップ（撃った位置と結果）とxG（ゴール期待値）を並べて、「良い位置で撃てているか」「決め切れているか」を確認します。ペナルティエリア内の中央・ゴールエリア付近が最も決まりやすく、遠目やサイドの浅い角度からのシュートは1本あたりの期待値が低くなります。</p></div>
        </div>
      </div>`;
  }

  SL.ui.register({
    id: 'shots',
    label: 'ショット',
    icon: '⚽',
    init(root) {
      root.addEventListener('click', (e) => {
        const z = e.target.closest('[data-zone]');
        const b = e.target.closest('[data-act]');
        if (z && z.closest('svg.shotchart')) {
          const st = SL.store.state;
          SL.hl.open({ team: vs.team, zone: z.dataset.zone, types: SHOTS, num: vs.num === 'all' ? undefined : +vs.num, q: vs.q || undefined }, `${st.teams[vs.team].name} ${C.zoneLabel(z.dataset.zone)}のシュート`);
          return;
        }
        if (!b) return;
        const d = b.dataset;
        if (d.act === 'team') {
          vs.team = d.team;
          vs.num = 'all';
        } else if (d.act === 'mode') vs.mode = d.mode;
        else if (d.act === 'metric') vs.metric = d.metric;
        else if (d.act === 'res') vs.res = d.res;
        else if (d.act === 'zonehl') {
          const st = SL.store.state;
          SL.hl.open({ team: vs.team, zone: d.zone, types: SHOTS, num: vs.num === 'all' ? undefined : +vs.num, q: vs.q || undefined }, `${st.teams[vs.team].name} ${C.zoneLabel(d.zone)}のシュート`);
          return;
        } else return;
        SL.ui.renderActive(true);
      });
      root.addEventListener('change', (e) => {
        const s = e.target.closest('select[data-act]');
        if (!s) return;
        if (s.dataset.act === 'num') vs.num = s.value;
        if (s.dataset.act === 'q') vs.q = +s.value;
        SL.ui.renderActive(true);
      });
    },
    render,
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「アドバイス」タブ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const esc = U.esc;

  let registry = [];

  function evid(list) {
    if (!list || !list.length) return '';
    return `<div class="evid">${list.map((e) => `<span class="ev"><em>${esc(e.label)}</em><b>${esc(e.value)}</b></span>`).join('')}</div>`;
  }
  function clipBtns(ins) {
    if (!ins.clips || !ins.clips.length) return '';
    return `<div class="clips">${ins.clips
      .map((c) => {
        registry.push(c);
        return `<button class="btn sm clipbtn" data-act="clip" data-i="${registry.length - 1}">▶ ${esc(c.label)}</button>`;
      })
      .join('')}</div>`;
  }
  function drillTags(ins) {
    if (!ins.drills || !ins.drills.length) return '';
    return `<div class="dtags">${ins.drills
      .filter((d, i, a) => a.indexOf(d) === i)
      .map((d) => `<span class="dtag" title="${esc(SL.advice.DRILLS[d].how)}">🏋 ${esc(SL.advice.DRILLS[d].title)}</span>`)
      .join('')}</div>`;
  }
  function card(ins) {
    const icon = ins.kind === 'good' ? '🔥' : ins.kind === 'bad' ? '⚠' : ins.kind === 'warn' ? '🔎' : 'ℹ';
    return `<article class="acard ${ins.kind}"><h5><span class="ai">${icon}</span>${esc(ins.title)}</h5><p>${esc(ins.body)}</p>${evid(ins.evidence)}${clipBtns(ins)}${drillTags(ins)}</article>`;
  }

  function render(root) {
    registry = [];
    const st = SL.store.state;
    const S = SL.stats.compute(st);
    const R = SL.advice.generate(st, S);
    const sum = R.summary;
    const levelOpts = Object.entries(C.LEVELS).map(([k, v]) => `<option value="${k}" ${st.cfg.level === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
    const factors = sum.factors.length
      ? `<div class="fchips2">${sum.factors
          .map((f) => `<span class="fchip ${f.verdict}" title="${esc(f.label)}：${esc(f.fmt(f.h))} 対 ${esc(f.fmt(f.o))}"><em>${esc(f.label.replace(/（.*）/, ''))}</em><b>${f.verdict === 'good' ? '優勢' : f.verdict === 'bad' ? '劣勢' : f.verdict === 'even' ? '互角' : '—'}</b></span>`)
          .join('')}</div>`
      : '';
    const q = R.quality;
    const quality = `<details class="qual" ${q.done < q.total ? 'open' : ''}><summary>データの充実度 <b>${q.done} / ${q.total}</b> <span class="dim">— タグを足すほど分析が増えます</span></summary>
      <ul>${q.items.map((i) => `<li class="${i.ok ? 'ok' : 'ng'}"><b>${i.ok ? '✔' : '＋'} ${esc(i.label)}</b>${i.ok ? '' : `<span class="dim"> ${esc(i.hint.replace('<V>', 'V'))}</span>`}</li>`).join('')}</ul></details>`;

    const empty = !S.events.length;
    root.innerHTML = `
      <div class="pane-head">
        <h3 class="ph">コーチからのアドバイス</h3>
        <span class="grow"></span>
        <label class="inl">目安のレベル <select data-act="level">${levelOpts}</select></label>
      </div>
      ${empty ? '<div class="card info">タグが付くと、数字から原因と練習メニューを自動で提案します。「サンプル試合」で見え方を確認できます。</div>' : ''}
      <article class="card summary ${sum.result || ''}">
        <div class="sum-head">${esc(sum.headline)}</div>
        ${sum.bullets.length ? `<ul class="sum-list">${sum.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
        ${factors}
      </article>
      ${quality}
      <div class="advice-cols">
        <section class="acol"><h4 class="col-title good">🔥 伸ばしたい強み <em>${R.strengths.length}</em></h4>${R.strengths.length ? R.strengths.map(card).join('') : '<div class="empty-note">十分なデータがたまると、強みが出ます。</div>'}</section>
        <section class="acol"><h4 class="col-title bad">🛠 改善したいポイント <em>${R.issues.length}</em></h4>${R.issues.length ? R.issues.map(card).join('') : '<div class="empty-note">大きな課題は見つかりませんでした。</div>'}</section>
      </div>
      ${R.players.length ? `<section class="sect"><h4>選手ごとのポイント</h4><div class="pgrid">${R.players.map(card).join('')}</div></section>` : ''}
      ${R.plan.length ? `<section class="sect plan"><h4>🏋 次の練習メニュー（改善点から自動で選んでいます）</h4><ol class="drills">${R.plan.map((d) => `<li><b>${esc(d.title)}</b><span>${esc(d.how)}</span></li>`).join('')}</ol></section>` : ''}
      <p class="dim tiny foot">※ xG（ゴール期待値）は位置・角度・攻撃の型から概算した簡易モデルです。目安の数値は一般的な傾向をもとにした参考値です（レベル：${esc(R.bench.name)}）。サンプルが少ない場合は断定せず、必ず映像で確認してください。「▶」ボタンで該当シーンを再生できます。</p>`;
  }

  SL.ui.register({
    id: 'advice',
    label: 'アドバイス',
    icon: '💡',
    init(root) {
      root.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act="clip"]');
        if (!b) return;
        const c = registry[+b.dataset.i];
        if (c) SL.hl.open(c.filter, c.label);
      });
      root.addEventListener('change', (e) => {
        const s = e.target.closest('select[data-act="level"]');
        if (!s) return;
        SL.store.patch((state) => (state.cfg.level = s.value), 'meta');
      });
    },
    render,
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「ハイライト」タブ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const GL = SL.goals;
  const esc = U.esc;
  const HL = SL.hl;

  const TARGETS = [
    [0, 'すべて'],
    [30, '約30秒'],
    [60, '約1分'],
    [90, '約1分半'],
    [120, '約2分'],
    [180, '約3分'],
  ];
  const TYPE_CHIPS = ['goal', 'sot', 'soff', 'sblk', 'pkg', 'ast', 'kp', 'tkl', 'itc', 'clr', 'ck', 'tov', 'foul', 'off', 'yc', 'rc'];

  const EMPTY = {
    big: '決定機（xG 0.3以上のシュート）はありませんでした。ゴールに近い位置のシュートに位置を入れると、ここに出てきます。',
    saves: 'GKのセーブ（相手の枠内シュート）がまだありません。',
    tov_pts: 'ボールロストの直後（12秒以内）に相手が打った場面はありませんでした。',
    spells: '短い時間にシュートが続いた時間帯はありませんでした。',
    foul_us: 'ファウル・カードのタグがまだありません。（X / J / K キー）',
    ck_us: 'コーナーキックのタグがまだありません。（C キー）',
  };

  function rosterOpts(team, sel) {
    const st = SL.store.state;
    const list = st.teams[team].roster;
    return ['<option value="">全員</option>'].concat(list.map((p) => `<option value="${p.num}" ${sel === p.num ? 'selected' : ''}>#${p.num} ${esc(p.name)}</option>`)).join('');
  }

  function customBuilder() {
    const st = SL.store.state;
    const h = HL.st;
    const f = h.filter || {};
    if (f.special) return `<div class="callout">条件：<b>${esc(h.filterLabel || '特別な条件')}</b></div>`;
    const teamOpt = (v, l) => `<option value="${v}" ${(f.team || '') === v ? 'selected' : ''}>${l}</option>`;
    const roster = f.team ? rosterOpts(f.team, f.num) : '<option value="">（チームを選ぶと選べます）</option>';
    const sceneOpts = ['<option value="">すべて</option>'].concat(C.SCENES.map((s) => `<option value="${s.id}" ${f.scene === s.id ? 'selected' : ''}>${esc(s.short)}</option>`)).join('');
    const chips = TYPE_CHIPS.map((k) => `<label class="tchip ${(f.types || []).includes(k) ? 'on' : ''}"><input type="checkbox" data-act="cf-type" data-type="${k}" ${(f.types || []).includes(k) ? 'checked' : ''}>${esc(C.EVENTS[k].label.replace(/（.*）/, ''))}</label>`).join('');
    return `<div class="custom">
      ${h.filterLabel ? `<div class="callout">条件：<b>${esc(h.filterLabel)}</b></div>` : ''}
      <div class="cf-row">
        <label class="inl">チーム <select data-act="cf-team">${teamOpt('', '両方')}${teamOpt('H', esc(st.teams.H.name))}${teamOpt('A', esc(st.teams.A.name))}</select></label>
        <label class="inl">選手 <select data-act="cf-num">${roster}</select></label>
        <label class="inl">攻撃の型 <select data-act="cf-scene">${sceneOpts}</select></label>
      </div>
      <div class="cf-types">${chips}</div></div>`;
  }

  /** 得点／失点シーンの内訳（原因・型をクリックで絞り込み） */
  function goalsBlock(S, side) {
    const st = SL.store.state;
    const h = HL.st;
    const items = GL.build(st, S, { side });
    if (!items.length) {
      return side === 'against'
        ? `<div class="callout warn">相手のゴールのタグがまだありません。<kbd>V</kbd> で相手に切り替え → 背番号 → <kbd>Q</kbd>（ゴール）と付けると、失点につながった場面が原因つきで集まります。</div>`
        : `<div class="callout warn">ゴールのタグがまだありません。背番号 → <kbd>Q</kbd> で付けると、得点シーンが「決め方」つきで集まります。</div>`;
    }
    const sm = GL.summary(items);
    const sel = new Set(h.causes);
    const rows = sm.byPrimary
      .map((b) => {
        const c = GL.cause(b.id);
        const inv = sm.involved[b.id];
        return `<button class="cd-row ${sel.has(b.id) ? 'on' : ''}" data-act="cause" data-id="${b.id}" style="--cc:${c.color}" title="${esc(GL.causeHint(b.id, side))}">
          <span class="cd-l"><i></i>${esc(GL.causeLabel(b.id, side))}</span>
          <span class="cd-bar"><i style="width:${((b.pts / sm.total) * 100).toFixed(0)}%"></i></span>
          <b>${b.pts}点</b><small>${inv.n !== b.n ? `関与 ${inv.n}回` : `${b.n}回`}</small></button>`;
      })
      .join('');
    const name = side === 'against' ? '失点' : '得点';
    return `<div class="cd-summary ${side}">
      <div class="cd-head"><b>${name} ${sm.total}点の${side === 'against' ? '原因' : '型'}内訳</b><span class="dim">クリックして絞り込み（複数選択OK）</span><span class="grow"></span>
        <button class="btn sm ${sel.size ? '' : 'primary'}" data-act="cause-all">すべて</button></div>
      <div class="cd-rows">${rows}</div>
      <p class="dim tiny">1つのゴールを「主な${side === 'against' ? '原因' : '型'}」1つに振り分けた内訳です。各クリップには、関係した${side === 'against' ? '原因' : '型'}がすべてタグとして付きます。クリップは「攻撃の始まり」からゴールまでをまるごと切り出しています。</p></div>`;
  }

  function clipRow(c, i) {
    const h = HL.st;
    const st = SL.store.state;
    const now = h.playing && h.playIdx >= 0 && HL.active()[h.playIdx] === c;
    const team = st.teams[c.team] || st.teams.H;
    const dot = c.side === 'against' ? '#ff6b6b' : c.side === 'for' ? '#3ddc97' : team.color;
    const chips = (c.causes || [])
      .map((id) => {
        const cs = GL.cause(id);
        return `<span class="cchip" style="--cc:${cs.color}" title="${esc(GL.causeHint(id, c.side))}">${esc(cs.short)}</span>`;
      })
      .join('');
    const k = esc(c.key);
    const badge = c.side === 'against' ? '<span class="pts-badge">失点</span>' : c.side === 'for' ? '<span class="pts-badge for">得点</span>' : '';
    return `<div class="clip ${c.off ? 'off' : ''} ${now ? 'now' : ''}" data-key="${k}">
      <div class="crow1">
        <input type="checkbox" data-act="ctoggle" data-key="${k}" ${c.off ? '' : 'checked'} title="このシーンを含める">
        <span class="cn">${i + 1}</span>
        <i class="cdot" style="background:${dot}"></i>
        <div class="cmain"><div class="clabel">${badge}${esc(c.label)}</div>
          <div class="csub">${esc(c.sub)} ・ ${U.fmtTime(c.start)}–${U.fmtTime(c.end)}（${Math.round(c.end - c.start)}秒）${c.causeText ? ` ・ <span class="ctext">${esc(c.causeText)}</span>` : ''}</div></div>
        <div class="ctools">
          <button class="ricon" data-act="cplay" data-key="${k}" title="このシーンから連続再生">▶</button>
          <span class="trim" title="開始位置：1秒ずつ調整／⇤で「いまの再生位置」にそろえる"><button class="ricon" data-act="cedge" data-key="${k}" data-w="start" title="開始を、いまの再生位置にする">⇤</button><button class="ricon" data-act="ctrim" data-key="${k}" data-w="start" data-d="-1">◂</button><small>始</small><button class="ricon" data-act="ctrim" data-key="${k}" data-w="start" data-d="1">▸</button></span>
          <span class="trim" title="終了位置：1秒ずつ調整／⇥で「いまの再生位置」にそろえる"><button class="ricon" data-act="ctrim" data-key="${k}" data-w="end" data-d="-1">◂</button><small>終</small><button class="ricon" data-act="ctrim" data-key="${k}" data-w="end" data-d="1">▸</button><button class="ricon" data-act="cedge" data-key="${k}" data-w="end" title="終了を、いまの再生位置にする">⇥</button></span>
          <button class="ricon" data-act="cmove" data-key="${k}" data-d="-1" title="上へ">↑</button>
          <button class="ricon" data-act="cmove" data-key="${k}" data-d="1" title="下へ">↓</button>
        </div>
      </div>
      <div class="crow2">${chips}<input class="cnote" type="text" data-act="cnote" data-key="${k}" value="${esc(c.note || '')}" placeholder="📝 コメント（例：ヘルプが遅れた／書き出す動画のテロップにも入ります）" maxlength="80"></div></div>`;
  }

  function exportSection() {
    const ex = HL.exporting;
    const r = HL.result;
    let h = '';
    if (ex) {
      const pct = ex.total > 0 ? Math.min(100, (ex.done / ex.total) * 100) : 0;
      h += `<div class="card info exporting"><b>🎬 書き出し中… <span id="exClip">${ex.clip}</span>/${ex.n} 本目${ex.clip === 0 ? '（タイトル画面）' : ''}</b>
        <div class="progress"><i id="exBar" style="width:${pct.toFixed(1)}%"></i></div>
        <div class="row gap"><span class="dim" id="exTxt">${Math.round(ex.done)} / ${Math.round(ex.total)} 秒</span><span class="grow"></span><button class="btn sm danger" data-act="excancel">キャンセル</button></div>
        <p class="dim tiny">ブラウザ内で録画しているため、動画の長さと同じ時間がかかります。このタブを表示したままにしてください。</p></div>`;
    }
    if (r) {
      h += `<div class="card good result"><b>✔ 書き出しが完了しました</b>
        <div class="dim">${esc(r.name)}（${(r.size / 1048576).toFixed(1)} MB・${r.clips}シーン・${Math.round(r.dur)}秒${r.hasAudio ? '・音声あり' : '・音声なし'}）</div>
        <div class="row gap"><a class="btn primary" href="${r.url}" download="${esc(r.name)}">⬇ ダウンロード</a><span class="dim tiny">形式：${esc(r.type)}${r.type.includes('webm') ? '（iPhone等では再生できない場合があります。Chrome/Edge/VLCなどで再生できます）' : ''}</span></div>
        <video class="resvid" src="${r.url}" controls preload="metadata"></video></div>`;
    }
    return h;
  }

  function render(root) {
    HL.compute();
    const st = SL.store.state;
    const h = HL.st;
    const preset = HL.PRESETS.find((p) => p.id === h.presetId) || HL.PRESETS[0];
    const isGoals = preset.special === 'concede' || preset.special === 'scored';
    const side = preset.special === 'concede' ? 'against' : 'for';
    const list = HL.clips;
    const active = HL.active();
    const total = HL.totalSec();
    const S = HL._S;
    const rosterTeam = preset.special === 'concede' ? 'A' : preset.team || 'H';
    SL.timeline.setClips(active, h.playing ? h.playIdx : -1);
    const presetBtns = HL.PRESETS.map((p) => `<button class="preset ${p.id === h.presetId ? 'on' : ''} ${p.feature ? 'feature ' + p.feature : ''}" data-act="preset" data-id="${p.id}" title="${esc(p.desc)}"><b>${esc(p.label)}</b><small>${esc(p.desc)}</small></button>`).join('');
    const qOpts = ['<option value="">全体</option>'].concat(S.halves.map((r) => `<option value="${r.q}" ${h.q === r.q ? 'selected' : ''}>${D.qLabel(r.q)}</option>`)).join('');
    const tOpts = TARGETS.map(([v, l]) => `<option value="${v}" ${(st.cfg.targetSec || 0) === v ? 'selected' : ''}>${l}</option>`).join('');
    const showPlayer = !preset.custom && (preset.needsPlayer || (preset.types && !preset.special) || preset.special === 'best' || isGoals);
    const needPlayerMsg = preset.needsPlayer && h.num == null ? '<div class="callout warn">選手を選んでください。</div>' : '';
    const playing = h.playing;
    const canExport = HL.canExport();
    const orderOpts = `<option value="time" ${h.order === 'time' ? 'selected' : ''}>時系列</option>${isGoals ? `<option value="cause" ${h.order === 'cause' ? 'selected' : ''}>${side === 'against' ? '原因別' : '型別'}</option>` : ''}<option value="score" ${h.order === 'score' ? 'selected' : ''}>おすすめ順</option><option value="manual" ${h.order === 'manual' ? 'selected' : ''}>手動</option>`;

    root.innerHTML = `
      <div class="pane-head"><h3 class="ph">ハイライト作成・見直し</h3><span class="dim">条件に合うシーンを自動で切り出し、つなげて1本の動画にします</span></div>
      <div class="presets">${presetBtns}</div>
      ${preset.custom ? customBuilder() : ''}
      ${isGoals ? goalsBlock(S, side) : ''}
      <div class="hl-opts">
        ${showPlayer ? `<label class="inl">${isGoals ? (side === 'against' ? '決めた選手（相手）' : '決めた選手') : '選手'} <select data-act="hl-num">${rosterOpts(rosterTeam, h.num)}</select></label>` : ''}
        <label class="inl">区間 <select data-act="hl-q">${qOpts}</select></label>
        <label class="inl">長さ <select data-act="hl-target">${tOpts}</select></label>
        <label class="inl">並び順 <select data-act="hl-order">${orderOpts}</select></label>
      </div>
      <div class="hl-opts">
        <label class="inl">${isGoals ? '最低の前置き' : '前'} <input type="range" min="3" max="20" step="1" value="${st.cfg.pre}" data-act="hl-pre"><b>${st.cfg.pre}秒</b></label>
        <label class="inl">後 <input type="range" min="0" max="10" step="1" value="${st.cfg.post}" data-act="hl-post"><b>${st.cfg.post}秒</b></label>
        <label class="chk"><input type="checkbox" data-act="hl-lower" ${h.lower ? 'checked' : ''}>テロップ（選手名・原因・コメント）</label>
        <label class="chk"><input type="checkbox" data-act="hl-score" ${h.scorebug ? 'checked' : ''}>スコア表示</label>
        <label class="chk"><input type="checkbox" data-act="hl-title" ${h.titleCard ? 'checked' : ''}>タイトル／エンド画面</label>
      </div>
      ${needPlayerMsg}
      <div class="hl-bar">
        <div class="hl-sum"><b>${active.length}</b> シーン ・ 合計 <b>${U.fmtTime(total)}</b>${list.length !== active.length ? `<span class="dim">（${list.length - active.length}件は除外中）</span>` : ''}</div>
        <span class="grow"></span>
        ${playing ? '<button class="btn" data-act="hl-prev">⏮ 前</button><button class="btn" data-act="hl-next">⏭ 次</button><button class="btn danger" data-act="hl-stop">■ 停止</button>' : `<button class="btn primary" data-act="hl-play" ${active.length ? '' : 'disabled'}>▶ 連続再生（プレビュー）</button>`}
        <button class="btn ${canExport ? 'accent' : 'disabled'}" data-act="export" ${active.length && !HL.exporting ? '' : 'disabled'} title="ブラウザ内で録画して動画ファイルにします">🎬 動画に書き出す</button>
        <button class="btn ghost" data-act="ffmpeg" ${active.length ? '' : 'disabled'} title="ffmpeg をお持ちなら、高画質で切り出せるスクリプトを保存します">ffmpeg用</button>
      </div>
      <div id="exportArea">${exportSection()}</div>
      <div class="cliplist" data-n="${list.length}">${list.length ? list.map(clipRow).join('') : `<div class="empty-note">${st.events.length ? EMPTY[preset.id] || '該当するシーンがありません。条件を変えてみてください。' : 'タグがまだありません。タグを付けると、ここにシーンが並びます。'}</div>`}</div>
      <p class="dim tiny">カット編集：◂▸で開始・終了を1秒ずつ調整。映像を見ながら、⇤（開始）／⇥（終了）で<b>いまの再生位置</b>にそろえられます。📝コメントは書き出す動画のテロップにも入ります。${canExport ? '' : '<b>このブラウザは動画の書き出しに未対応です（Chrome/Edge推奨）。</b>'}</p>`;
  }

  function updateProgress() {
    const ex = HL.exporting;
    const bar = U.$('#exBar');
    if (!ex || !bar) return;
    bar.style.width = Math.min(100, (ex.done / Math.max(1, ex.total)) * 100).toFixed(1) + '%';
    const t = U.$('#exTxt');
    if (t) t.textContent = `${Math.round(ex.done)} / ${Math.round(ex.total)} 秒`;
    const c = U.$('#exClip');
    if (c) c.textContent = ex.clip;
  }

  SL.ui.register({
    id: 'hl',
    label: 'ハイライト',
    icon: '🎬',
    init(root) {
      let lastEx = false;
      HL.on(() => {
        if (SL.ui.tab !== 'hl') return;
        const exNow = !!HL.exporting;
        if (exNow && lastEx) updateProgress();
        else SL.ui.schedule();
        lastEx = exNow;
      });
      root.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
        const d = b.dataset;
        const h = HL.st;
        switch (d.act) {
          case 'preset':
            h.presetId = d.id;
            h.edits = {};
            h.manual = [];
            h.order = 'time';
            h.num = null;
            h.causes = [];
            if (d.id === 'custom' && (!h.filter || !Object.keys(h.filter).filter((k) => h.filter[k] !== undefined).length)) h.filter = { team: 'H', types: ['goal', 'sot'] };
            HL.stop();
            break;
          case 'cause':
            HL.toggleCause(d.id);
            HL.stop();
            break;
          case 'cause-all':
            h.causes = [];
            HL.stop();
            break;
          case 'hl-play':
            HL.play(0);
            return;
          case 'hl-stop':
            HL.stop();
            return;
          case 'hl-next':
            HL.next();
            return;
          case 'hl-prev':
            HL.prev();
            return;
          case 'cplay': {
            const i = HL.active().findIndex((c) => c.key === d.key);
            if (i >= 0) HL.play(i);
            return;
          }
          case 'ctrim':
            HL.trim(d.key, d.w, +d.d);
            break;
          case 'cedge':
            if (!SL.player.ready) return;
            if (!HL.setEdge(d.key, d.w, SL.player.time)) {
              U.toast(d.w === 'start' ? '開始位置は、終了より前（1秒以上）にしてください' : '終了位置は、開始より後（1秒以上）にしてください');
              return;
            }
            U.toast((d.w === 'start' ? '開始' : '終了') + 'を ' + U.fmtTime(SL.player.time, true) + ' にそろえました');
            break;
          case 'cmove':
            HL.move(d.key, +d.d);
            break;
          case 'export':
            HL.export();
            return;
          case 'excancel':
            HL.cancelExport();
            return;
          case 'ffmpeg':
            U.download(HL.ffmpegScript(), 'highlight_ffmpeg.sh', 'text/x-shellscript;charset=utf-8');
            return;
          default:
            return;
        }
        HL.refresh();
        SL.ui.renderActive(true);
      });
      root.addEventListener('change', (e) => {
        const el = e.target;
        const a = el.dataset && el.dataset.act;
        if (!a) return;
        const h = HL.st;
        const f = a.startsWith('cf-') ? h.filter || (h.filter = {}) : null;
        switch (a) {
          case 'ctoggle':
            HL.edit(el.dataset.key, { off: !el.checked });
            break;
          case 'cnote':
            HL.setNote(el.dataset.key, el.value.trim());
            return;
          case 'hl-num':
            h.num = el.value === '' ? null : +el.value;
            break;
          case 'hl-q':
            h.q = el.value === '' ? null : +el.value;
            break;
          case 'hl-target':
            SL.store.patch((s) => (s.cfg.targetSec = +el.value), 'meta');
            break;
          case 'hl-order':
            h.order = el.value;
            break;
          case 'hl-lower':
            h.lower = el.checked;
            return;
          case 'hl-score':
            h.scorebug = el.checked;
            return;
          case 'hl-title':
            h.titleCard = el.checked;
            return;
          case 'cf-team':
            f.team = el.value || undefined;
            f.num = undefined;
            break;
          case 'cf-num':
            f.num = el.value === '' ? undefined : +el.value;
            break;
          case 'cf-scene':
            f.scene = el.value || undefined;
            break;
          case 'cf-type': {
            const s = new Set(f.types || []);
            if (el.checked) s.add(el.dataset.type);
            else s.delete(el.dataset.type);
            f.types = Array.from(s);
            break;
          }
          case 'hl-pre':
          case 'hl-post':
            SL.store.patch((s) => (s.cfg[a === 'hl-pre' ? 'pre' : 'post'] = +el.value), 'meta');
            break;
          default:
            return;
        }
        if (a.startsWith('cf-')) h.filterLabel = '';
        HL.refresh();
        SL.ui.renderActive(true);
      });
      // スライダーは離した時に反映（ドラッグ中は表示だけ更新）
      root.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset && (el.dataset.act === 'hl-pre' || el.dataset.act === 'hl-post')) {
          const b = el.parentElement.querySelector('b');
          if (b) b.textContent = el.value + '秒';
        }
      });
    },
    render,
  });

  // 再生位置に応じた連続プレビュー
  SL.player.on('time', (t) => HL.onTime(t));
  SL.player.on('ended', () => {
    if (HL.st.playing && !HL.exporting) HL.next();
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「一覧」「設定」タブ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const esc = U.esc;

  const lg = { team: '', type: '', q: 0, limit: 300 };

  function extraOf(e) {
    const extra = [];
    if (e.type === 'tov') extra.push(C.tovLabel(e.sub || 'other').replace(/（.*）/, ''));
    if (e.type === 'foul') extra.push(C.foulLabel(e.sub || 'other').replace(/（.*）/, ''));
    if (e.type === 'pkx' && e.sub === 'saved') extra.push('GKに止められた');
    if (C.isShot(e)) {
      if (e.scene) extra.push(C.sceneShort(e.scene));
      if (e.body === 'head') extra.push('ヘディング');
      const pos = C.shotPos(e);
      if (pos) extra.push(C.zoneLabel(C.zoneFor(pos.sx, pos.sy)) + ' xG ' + SL.xg.of(e).toFixed(2));
    } else if (e.px != null) extra.push(C.fieldZoneShort(C.zoneOfEvent(e)));
    if (e.type === 'foul' && e.vs != null) extra.push('被 #' + e.vs);
    return extra;
  }

  /* ---------- 一覧（ログ） ---------- */
  function renderLog(root) {
    const st = SL.store.state;
    let list = st.events.slice();
    if (lg.team) list = list.filter((e) => e.team === lg.team);
    if (lg.type) list = list.filter((e) => e.type === lg.type);
    if (lg.q) list = list.filter((e) => D.periodAt(st.periods, e.t) === lg.q);
    const shown = list.slice(0, lg.limit);
    const typeOpts = ['<option value="">すべて</option>'].concat(C.EVENT_ORDER.map((k) => `<option value="${k}" ${lg.type === k ? 'selected' : ''}>${esc(C.EVENTS[k].label)}</option>`)).join('');
    const qs = ['<option value="0">全体</option>'].concat(st.periods.map((p) => `<option value="${p.q}" ${lg.q === p.q ? 'selected' : ''}>${D.qLabel(p.q)}</option>`)).join('');
    const rows = shown
      .map((e) => {
        const meta = C.EVENTS[e.type] || { label: e.type };
        const team = st.teams[e.team] || st.teams.H;
        return `<tr data-id="${e.id}"><td class="num"><button class="rt" data-act="seek" data-id="${e.id}" title="この場面へ移動">${U.fmtTime(e.t, true)}</button></td><td>${esc(D.minuteLabel(st, e.t))}</td>
          <td><i class="rdot" style="background:${team.color}"></i>${esc(team.name)}</td><td>${esc(e.num != null ? SL.store.playerLabel(e.team, e.num) : '—')}</td>
          <td><span class="rev ev-${e.type}">${esc(meta.label.replace(/（.*）/, ''))}</span></td><td class="l">${esc(extraOf(e).join(' ・ '))}${e.note ? ` <span class="dim">📝 ${esc(e.note)}</span>` : ''}</td>
          <td class="act"><button class="ricon" data-act="edit" data-id="${e.id}" title="編集">✎</button><button class="ricon" data-act="del" data-id="${e.id}" title="削除">✕</button></td></tr>`;
      })
      .join('');
    root.innerHTML = `
      <div class="pane-head"><h3 class="ph">タグの一覧・編集</h3>
        <label class="inl">チーム <select data-act="lteam"><option value="">両方</option><option value="H" ${lg.team === 'H' ? 'selected' : ''}>${esc(st.teams.H.name)}</option><option value="A" ${lg.team === 'A' ? 'selected' : ''}>${esc(st.teams.A.name)}</option></select></label>
        <label class="inl">プレー <select data-act="ltype">${typeOpts}</select></label>
        <label class="inl">区間 <select data-act="lq">${qs}</select></label>
        <span class="grow"></span>
        <span class="dim">${list.length}件</span>
        <button class="btn sm" data-act="csvlog">CSV書き出し</button>
        <button class="btn sm danger" data-act="clearall" ${st.events.length ? '' : 'disabled'}>全部削除</button>
      </div>
      <div class="box-wrap"><table class="tbl logtbl"><thead><tr><th>時刻</th><th>試合時間</th><th class="l">チーム</th><th class="l">選手</th><th class="l">プレー</th><th class="l">詳細</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="empty-note">該当するタグがありません。</td></tr>'}</tbody></table></div>
      ${list.length > shown.length ? `<div class="row"><button class="btn sm" data-act="more">さらに表示（残り ${list.length - shown.length} 件）</button></div>` : ''}`;
  }

  function csvLog() {
    const st = SL.store.state;
    const head = ['時刻(秒)', '試合時間', '前半後半', 'チーム', '背番号', '名前', 'プレー', '攻撃の型', '種類', 'ピッチx(m)', 'ピッチy(m)', 'ゾーン', 'xG', '体', 'メモ'];
    const rows = [head].concat(
      st.events.map((e) => {
        const pos = C.isShot(e) ? C.shotPos(e) : null;
        return [
          e.t, D.minuteLabel(st, e.t), D.qLabel(D.periodAt(st.periods, e.t)), st.teams[e.team] ? st.teams[e.team].name : '', e.num == null ? '' : e.num, e.num ? SL.store.playerName(e.team, e.num) : '',
          (C.EVENTS[e.type] || {}).label || e.type, e.scene ? C.sceneLabel(e.scene) : '', e.sub ? (e.type === 'tov' ? C.tovLabel(e.sub) : e.type === 'foul' ? C.foulLabel(e.sub) : e.sub) : '',
          e.px == null ? '' : e.px, e.py == null ? '' : e.py, pos ? C.zoneLabel(C.zoneFor(pos.sx, pos.sy)) : '', C.isShot(e) ? SL.xg.of(e).toFixed(3) : '', e.body === 'head' ? 'ヘディング' : '', e.note || '',
        ];
      })
    );
    return '﻿' + rows.map((r) => r.map(U.csvCell).join(',')).join('\r\n');
  }

  SL.ui.register({
    id: 'log',
    label: '一覧',
    icon: '📋',
    init(root) {
      root.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.tagName === 'SELECT') return;
        const d = b.dataset;
        switch (d.act) {
          case 'seek':
            SL.ui.selectEvent(d.id, { seek: true });
            return;
          case 'edit':
            SL.ui.openEdit(d.id);
            return;
          case 'del':
            SL.store.removeEvent(d.id);
            return;
          case 'more':
            lg.limit += 300;
            break;
          case 'csvlog':
            U.download(csvLog(), (SL.store.state.title || 'tags') + '_tags.csv', 'text/csv;charset=utf-8');
            return;
          case 'clearall': {
            const n = SL.store.state.events.length;
            const r = await SL.ui.ask('すべてのタグを削除しますか？', `${n}件のタグがすべて消えます。（取り消し操作 Ctrl+Z で戻せます）`, [{ label: 'キャンセル' }, { label: '削除する', danger: true }]);
            if (r === 1) SL.store.clearEvents();
            return;
          }
          default:
            return;
        }
        SL.ui.renderActive(true);
      });
      root.addEventListener('change', (e) => {
        const s = e.target.closest('select[data-act]');
        if (!s) return;
        if (s.dataset.act === 'lteam') lg.team = s.value;
        if (s.dataset.act === 'ltype') lg.type = s.value;
        if (s.dataset.act === 'lq') lg.q = +s.value;
        SL.ui.renderActive(true);
      });
    },
    render: renderLog,
  });

  /* ---------- 設定 ---------- */
  const POS = [['', '—'], ['GK', 'GK'], ['DF', 'DF'], ['MF', 'MF'], ['FW', 'FW']];
  function rosterTable(team) {
    const st = SL.store.state;
    const T = st.teams[team];
    const rows = T.roster
      .map((p) => `<tr><td><b>${p.num}</b></td><td><input type="text" class="nameinput" data-act="pname" data-team="${team}" data-num="${p.num}" value="${esc(p.name)}" placeholder="名前"></td>
        <td><select data-act="ppos" data-team="${team}" data-num="${p.num}">${POS.map(([v, l]) => `<option value="${v}" ${(p.pos || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        <td><button class="ricon" data-act="pdel" data-team="${team}" data-num="${p.num}" title="削除">✕</button></td></tr>`)
      .join('');
    return `<table class="tbl rosterbl"><thead><tr><th>#</th><th class="l">名前</th><th class="l">位置</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty-note">まだ選手がいません。</td></tr>'}</tbody></table>
      <div class="addp row gap"><input type="number" class="numinput" min="0" max="99" placeholder="背番号" id="rn-${team}"><input type="text" class="nameinput" placeholder="名前" id="rname-${team}"><button class="btn sm" data-act="padd" data-team="${team}">＋追加</button></div>`;
  }

  function renderSetup(root) {
    const st = SL.store.state;
    const sample = SL.store.mode === 'sample';
    const periods = st.periods.slice().sort((a, b) => a.q - b.q);
    const levelOpts = Object.entries(C.LEVELS).map(([k, v]) => `<option value="${k}" ${st.cfg.level === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
    const halfOpts = [45, 40, 35, 30, 25, 20, 15, 10].map((m) => `<option value="${m}" ${st.cfg.halfMin === m ? 'selected' : ''}>${m}分</option>`).join('');
    root.innerHTML = `
      <div class="pane-head"><h3 class="ph">設定・保存</h3></div>
      ${sample ? `<div class="card info">いまは<b>サンプル試合</b>を表示しています（保存されません）。自分の分析を始めるには、右上の「📂 動画を読み込む」を押してください。
        <div class="row gap"><button class="btn sm" data-act="practice">サンプルのタグを消して、練習する</button><button class="btn sm" data-act="resample">サンプルを元に戻す</button></div></div>` : ''}
      <div class="sect"><h4>試合の情報</h4>
        <div class="fgrid">
          <label>試合名<input type="text" data-act="title" value="${esc(st.title)}" placeholder="例：秋季リーグ 第3節"></label>
          <label>日付<input type="date" data-act="date" value="${esc(st.date || '')}"></label>
          <label>動画<input type="text" value="${esc(st.video.name || '（未読み込み）')}" disabled></label>
          <label>目安のレベル<select data-act="level">${levelOpts}</select></label>
          <label>前後半の長さ<select data-act="half">${halfOpts}</select><span class="dim tiny">試合時間の表示（例：後半3分 → ${st.cfg.halfMin + 3}'）と、ファウル数などの目安の計算に使います。</span></label>
          <label>ボール支配率（自チーム・任意）<input type="number" min="0" max="100" data-act="poss" value="${st.cfg.possH == null ? '' : st.cfg.possH}" placeholder="例：58"><span class="dim tiny">支配率は映像から自動では測れないため、分かる場合だけ入力します（集計のチーム比較に出ます）。</span></label>
        </div></div>
      <div class="sect"><h4>チーム</h4>
        <div class="two">${['H', 'A']
          .map((t) => `<div class="teamcfg"><div class="row gap"><input type="color" data-act="tcolor" data-team="${t}" value="${st.teams[t].color}" title="チームカラー"><input type="text" data-act="tname" data-team="${t}" value="${esc(st.teams[t].name)}" class="tnameinput"><span class="dim">${t === 'H' ? '自チーム' : '相手'}</span></div>${rosterTable(t)}</div>`)
          .join('')}</div>
        <p class="dim tiny">位置を「GK」にした選手が、相手の枠内シュートを受けるGKとして集計されます（未設定なら背番号1）。</p></div>
      <div class="sect"><h4>前半・後半の区切り</h4>
        <div class="periods">${periods
          .map((p) => `<div class="prow"><b>${D.qLabel(p.q)}</b><input type="text" data-act="pstart" data-q="${p.q}" value="${U.fmtTime(p.start, true)}" size="8"><button class="btn sm" data-act="pnow" data-q="${p.q}" title="動画の現在位置を開始にする">現在位置（${U.fmtTime(SL.player.time, true)}）にする</button>${p.q > 1 ? `<button class="ricon" data-act="pdelq" data-q="${p.q}" title="削除">✕</button>` : ''}</div>`)
          .join('')}
          ${periods.length < 4 ? `<div class="row gap"><button class="btn sm" data-act="paddq">＋ ${D.qLabel(Math.max(...periods.map((p) => p.q)) + 1)} を追加（現在位置）</button></div>` : ''}</div>
        <p class="dim tiny">区切りを入れると、試合時間の表示（前半12'など）と、前半／後半の比較が使えます。</p></div>
      <div class="sect"><h4>タグ付けの調整</h4>
        <div class="fgrid">
          <label>反応の遅れ補正（秒）<input type="number" step="0.1" min="0" max="5" data-act="delay" value="${st.cfg.delay}"><span class="dim tiny">再生中にキーを押すと、その少し前の時刻でタグが付きます。一時停止中は補正しません。</span></label>
        </div></div>
      <div class="sect"><h4>データの保存・読み込み</h4>
        <div class="row gap wrap">
          <button class="btn" data-act="savejson">💾 分析データを保存（JSON）</button>
          <button class="btn" data-act="loadjson">📥 分析データを読み込む</button>
          <button class="btn" data-act="csvlog2">タグをCSVで書き出す</button>
          <button class="btn danger" data-act="newproj">新しい分析を始める</button>
          <input type="file" id="jsonInput" accept=".json,application/json" hidden>
        </div>
        <p class="dim tiny">自分の分析はこのブラウザに自動保存されます（動画ファイル自体は保存されません。次回は同じ動画を選ぶと続きから開けます）。別のパソコンに移すときはJSONで保存してください。</p></div>`;
  }

  SL.ui.register({
    id: 'setup',
    label: '設定',
    icon: '⚙',
    init(root) {
      root.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-act]');
        if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
        const d = b.dataset;
        const S = SL.store;
        switch (d.act) {
          case 'practice':
            SL.app.openSample({ practice: true });
            return;
          case 'resample':
            SL.app.openSample();
            return;
          case 'pdel':
            S.patch((s) => (s.teams[d.team].roster = s.teams[d.team].roster.filter((p) => p.num !== +d.num)));
            break;
          case 'padd': {
            const n = parseInt(U.$('#rn-' + d.team).value, 10);
            if (!isFinite(n) || n < 0) {
              U.toast('背番号を入力してください');
              return;
            }
            const p = S.ensurePlayer(d.team, n);
            const nm = U.$('#rname-' + d.team).value.trim();
            if (nm) S.patch(() => (p.name = nm));
            break;
          }
          case 'pnow':
            S.setPeriodStart(+d.q, SL.player.time);
            break;
          case 'pdelq':
            S.removePeriod(+d.q);
            break;
          case 'paddq': {
            const nq = Math.max(...S.state.periods.map((p) => p.q)) + 1;
            S.setPeriodStart(nq, SL.player.time);
            break;
          }
          case 'savejson': {
            const name = (S.state.title || 'soccer-lab').replace(/[\\/:*?"<>|\s]+/g, '_');
            U.download(S.exportJSON(), name + '.json', 'application/json');
            return;
          }
          case 'loadjson':
            U.$('#jsonInput').click();
            return;
          case 'csvlog2':
            U.download(csvLog(), (S.state.title || 'tags') + '_tags.csv', 'text/csv;charset=utf-8');
            return;
          case 'newproj': {
            const n = S.state.events.length;
            const r = await SL.ui.ask('新しい分析を始めますか？', `現在の分析（${n}件のタグ）は消えます。念のため1つ前の状態は自動バックアップされます。<br>（先に「分析データを保存」しておくと安心です）`, [{ label: 'キャンセル' }, { label: '新しく始める', danger: true }]);
            if (r === 1) {
              if (S.mode === 'user') S.backupUser();
              S.newUserProject({});
              SL.ui.updateMode();
              SL.ui.updateScoreCache();
              U.toast('新しい分析を始めました');
            }
            return;
          }
          default:
            return;
        }
        SL.ui.renderActive(true);
      });
      root.addEventListener('change', (e) => {
        const el = e.target;
        const a = el.dataset && el.dataset.act;
        const S = SL.store;
        if (el.id === 'jsonInput') {
          const f = el.files && el.files[0];
          if (!f) return;
          f.text()
            .then((txt) => {
              S.importJSON(txt);
              SL.ui.updateMode();
              SL.ui.updateScoreCache();
              U.toast('読み込みました。動画（' + (S.state.video.name || '未設定') + '）を「動画を読み込む」で選んでください');
            })
            .catch((err) => U.toast('読み込めませんでした：' + err.message, 'bad'));
          el.value = '';
          return;
        }
        if (!a) return;
        switch (a) {
          case 'title':
            S.patch((s) => (s.title = el.value));
            SL.ui.updateMode();
            break;
          case 'date':
            S.patch((s) => (s.date = el.value));
            break;
          case 'level':
            S.patch((s) => (s.cfg.level = el.value));
            break;
          case 'half':
            S.patch((s) => (s.cfg.halfMin = +el.value));
            break;
          case 'poss': {
            const v = parseFloat(el.value);
            S.patch((s) => (s.cfg.possH = isFinite(v) ? Math.max(0, Math.min(100, Math.round(v))) : null));
            break;
          }
          case 'tname':
            S.patch((s) => (s.teams[el.dataset.team].name = el.value || (el.dataset.team === 'H' ? '自チーム' : '相手チーム')));
            break;
          case 'tcolor':
            S.patch((s) => (s.teams[el.dataset.team].color = el.value));
            break;
          case 'pname':
            S.patch((s) => {
              const p = s.teams[el.dataset.team].roster.find((x) => x.num === +el.dataset.num);
              if (p) p.name = el.value.trim();
            });
            break;
          case 'ppos':
            S.patch((s) => {
              const p = s.teams[el.dataset.team].roster.find((x) => x.num === +el.dataset.num);
              if (p) p.pos = el.value;
            });
            break;
          case 'pstart': {
            const t = U.parseTime(el.value);
            if (isFinite(t)) S.setPeriodStart(+el.dataset.q, t);
            else U.toast('時刻は 1:23.4 のように入力してください');
            break;
          }
          case 'delay':
            S.patch((s) => (s.cfg.delay = Math.max(0, Math.min(5, parseFloat(el.value) || 0))));
            break;
          default:
            return;
        }
        SL.ui.renderActive(true);
      });
    },
    render: renderSetup,
  });
})();

</script>
<script>
/* サッカー分析ラボ - 自動デモ（開いた瞬間に「何ができるか」を実際の画面で見せる）
 * デモ中でも、マウス・キーボード・スクロールの操作をした瞬間に、あなたへ操作が移ります。 */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const $ = U.$;

  class Cancel extends Error {}
  class Skip extends Error {}

  const DM = (SL.demo = {
    running: false,
    token: 0,
    step: 0,
    _w: new Set(),
    _fin: null,
  });

  const STEPS_TOTAL = 7;

  /* ---------- 待機（中断できる） ---------- */
  DM.wait = (ms) =>
    new Promise((res, rej) => {
      const rec = { rej };
      rec.id = setTimeout(() => {
        DM._w.delete(rec);
        res();
      }, ms);
      DM._w.add(rec);
    });
  DM._cancelWaits = (err) => {
    const list = Array.from(DM._w);
    DM._w.clear();
    list.forEach((r) => {
      clearTimeout(r.id);
      r.rej(err);
    });
  };
  DM.until = async (fn, maxMs) => {
    const t0 = performance.now();
    while (!fn()) {
      await DM.wait(60);
      if (performance.now() - t0 > (maxMs || 20000)) break;
    }
  };

  /* ---------- 表示部品 ---------- */
  const layer = () => $('#demoLayer');
  function setCaption(step, title, html) {
    const cap = $('#demoCap');
    cap.hidden = false;
    cap.classList.remove('pop');
    void cap.offsetWidth;
    cap.classList.add('pop');
    $('#dcStep').textContent = step ? `デモ ${step}/${STEPS_TOTAL}` : 'デモ';
    $('#dcTitle').innerHTML = title;
    $('#dcText').innerHTML = html;
    $('#dcDots').innerHTML = Array.from({ length: STEPS_TOTAL }, (_, i) => `<i class="${i < step ? 'done' : ''} ${i + 1 === step ? 'cur' : ''}"></i>`).join('');
  }
  function ripple(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    layer().appendChild(r);
    setTimeout(() => r.remove(), 700);
  }
  async function glide(target, opts) {
    const el = typeof target === 'string' ? $(target) : target;
    if (!el) return null;
    const scroller = el.closest('.panels');
    if (scroller && (opts || {}).scroll !== false) {
      const r = el.getBoundingClientRect();
      const s = scroller.getBoundingClientRect();
      if (scroller.scrollHeight <= scroller.clientHeight + 2) {
        // 縦に並ぶ表示（狭い画面）では、ページ全体をスクロールする
        if (r.top < 70 || r.bottom > window.innerHeight - 190) {
          window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * 0.22, behavior: 'smooth' });
          await DM.wait(650);
        }
      } else if (r.top < s.top + 40 || r.bottom > s.bottom - 40) {
        scroller.scrollTo({ top: scroller.scrollTop + (r.top - s.top) - s.height * 0.3, behavior: 'smooth' });
        await DM.wait(550);
      }
    }
    const r = el.getBoundingClientRect();
    const x = r.left + Math.min(r.width * 0.5, 60) + ((opts || {}).dx || 0);
    const y = r.top + r.height * 0.55 + ((opts || {}).dy || 0);
    const g = $('#ghost');
    g.classList.add('on');
    g.style.left = x + 'px';
    g.style.top = y + 'px';
    await DM.wait(760);
    return { el, x, y };
  }
  async function tap(target, opts) {
    const p = await glide(target, opts);
    if (!p) return null;
    ripple(p.x, p.y);
    const g = $('#ghost');
    g.classList.add('press');
    setTimeout(() => g.classList.remove('press'), 180);
    await DM.wait(140);
    // 途中で画面が描き直されて要素が差し替わっていたら、探し直してからクリックする
    let el = p.el;
    if (!el.isConnected && typeof target === 'string') el = $(target) || el;
    el.click();
    return p;
  }
  const tapTab = async (id) => {
    const p = await tap(`.tab[data-tab="${id}"]`);
    // 狭い画面では、タブの位置までページを移動して内容が見えるようにする
    const sc = $('#panels');
    if (sc && sc.scrollHeight <= sc.clientHeight + 2) {
      const r = $('#tabs').getBoundingClientRect();
      window.scrollTo({ top: window.scrollY + r.top - 8, behavior: 'smooth' });
      await DM.wait(500);
    }
    return p;
  };
  const scrollPanel = async (sel, block) => {
    const el = $(sel);
    const sc = $('#panels');
    if (!el || !sc) return;
    const r = el.getBoundingClientRect();
    const s = sc.getBoundingClientRect();
    if (sc.scrollHeight <= sc.clientHeight + 2) window.scrollTo({ top: window.scrollY + r.top - window.innerHeight * 0.22, behavior: 'smooth' });
    else sc.scrollTo({ top: sc.scrollTop + (r.top - s.top) - (block || 12), behavior: 'smooth' });
    await DM.wait(700);
  };
  const glow = (el, ms) => {
    if (!el) return;
    el.classList.add('demo-glow');
    setTimeout(() => el.classList.remove('demo-glow'), ms || 2600);
  };

  /* ---------- 実況タグ付け（サンプルの正解タグを、人が押すように入力する） ---------- */
  const idMap = new Map();
  async function liveTag(ev) {
    const TG = SL.tagger;
    const meta = C.EVENTS[ev.type];
    const digits = ev.num == null ? [] : String(ev.num).split('');
    TG.team = ev.team;
    TG.pending = { num: null, ev: null };
    TG.changed();
    SL.ui.setKeys(digits.concat([meta.kl]), (ev.num != null ? SL.store.playerLabel(ev.team, ev.num) + ' → ' : '') + meta.label.replace(/（.*）/, ''), 1700);
    TG.pending.num = ev.num;
    TG.changed();
    await DM.wait(260);
    TG.pending.ev = ev.type;
    TG.changed();
    await DM.wait(260);
    TG.pending = { num: null, ev: null };
    const rec = Object.assign({}, ev);
    if (rec.for && idMap.has(rec.for)) rec.for = idMap.get(rec.for);
    else delete rec.for;
    const saved = SL.store.addEvent(rec);
    idMap.set(ev.id, saved.id);
    SL.ui.onTagged(saved);
    TG.changed();
  }

  /** タグ付けの実演に向いた区間（ゴール・アシスト・ファウル・ロストなどがそろう約26秒）を選ぶ */
  function pickWindow(all) {
    const evs = all.filter((e) => e.type !== 'note');
    let best = null;
    for (const e of evs) {
      if (e.t > 1100) break;
      const s = Math.max(0, e.t - 3);
      const inWin = evs.filter((x) => x.t >= s && x.t <= s + 26);
      const types = new Set(inWin.map((x) => x.type));
      const score =
        Math.min(inWin.length, 9) +
        types.size * 2 +
        (types.has('goal') || types.has('pkg') ? 6 : 0) +
        (types.has('ast') ? 4 : 0) +
        (types.has('foul') ? 2 : 0) +
        (types.has('tov') || types.has('tkl') || types.has('itc') ? 2 : 0) +
        (types.has('ck') ? 1 : 0);
      if (!best || score > best.score) best = { s, score };
    }
    return best ? { t0: best.s, t1: best.s + 26 } : { t0: 0, t1: 26 };
  }

  /** 各ステップの後始末（スキップされた場合でも、再生・入力途中の状態を戻す） */
  function afterStep() {
    SL.player.pause();
    SL.player.setRate(1);
    if (SL.hl.st.playing) SL.hl.stop();
    SL.tagger.esc();
  }

  /* ---------- シナリオ ---------- */
  function scenario() {
    const P = SL.player;
    const S = SL.store;
    const all = SL.app.sampleState.events;
    const finishTagging = () => {
      if (S.state.events.length !== all.length) S.replaceEvents(all.map((e) => Object.assign({}, e)), { noHist: true });
    };

    const steps = [];

    // 0. タイトル
    steps.push(async () => {
      setCaption(0, '⚽ サッカー分析ラボ', '試合の動画に<b>タグ</b>を付けるだけで、<b>個人成績・xG・ショットマップ・ハイライト・アドバイス</b>が自動でできます。<br><span class="dim">これから約2分のデモを見せます。いつでもクリックやキー入力で、あなたが操作できます。</span>');
      SL.ui.setTab('tag');
      P.seek(0);
      await DM.wait(4200);
    });

    // 1. 実況タグ付け
    steps.push(async () => {
      setCaption(1, '① 見ながらタグ付け', '動画を見ながら <kbd>背番号</kbd> → <kbd>プレーのキー</kbd>。例：<kbd>1</kbd><kbd>0</kbd> → <kbd>Q</kbd> で「#10 のゴール」。ゴールのあとにラストパスの背番号を入れるとアシストにもなります。マウスのボタンでも入力できます。');
      SL.ui.setTab('tag');
      idMap.clear();
      const win = pickWindow(all);
      const t0 = win.t0;
      const window_ = all.filter((e) => e.t >= t0 && e.t <= win.t1 + 2);
      const tEnd = win.t1 + 1.5;
      await P.seek(t0);
      P.setRate(1.5);
      P.play();
      await glide('#stage', { dx: 60, dy: 30, scroll: false });
      let i = 0;
      while (P.time < tEnd && i < window_.length) {
        while (i < window_.length && window_[i].t + 0.9 <= P.time) {
          await liveTag(window_[i]);
          i++;
        }
        await DM.wait(70);
      }
      P.pause();
      P.setRate(1);
    });

    // 2. 集計
    steps.push(async () => {
      finishTagging();
      setCaption(2, '② 個人成績とチーム比較を自動集計', 'ゴール・アシスト・シュート・<b>xG（ゴール期待値）</b>・タックル・ファウル・カードを自動で集計。チーム比較と、<b>xGの推移</b>で「内容」と「結果」のずれも見えます。<span class="dim">見出しクリックで並べ替え。</span>');
      await tapTab('stats');
      await DM.wait(900);
      const rows = U.$$('#panel-stats .box tbody tr:not(.teamrow):not(.totrow)');
      let top = null;
      rows.forEach((r) => {
        const goals = +(r.children[3] || {}).textContent;
        const sh = +(r.children[5] || {}).textContent;
        const v = goals * 10 + sh;
        if (!top || v > top.v) top = { r, v };
      });
      if (top) {
        await glide(top.r);
        glow(top.r, 2600);
      }
      await DM.wait(1200);
      await scrollPanel('#panel-stats .cmp', 8);
      await DM.wait(2400);
      await scrollPanel('#panel-stats .xg-svg', 8);
      await DM.wait(2200);
    });

    // 3. 場面別
    steps.push(async () => {
      setCaption(3, '③ 失点は「原因」、得点は「型」で見る', 'プロの現場のように、失点を<b>セットプレー／ボールロスト直後／カウンター／クロス／ミドル…</b>に分類。得点も「どう決めたか」で分け、ボールロスト・ファウルの傾向も分解します。');
      await tapTab('scenes');
      await DM.wait(1800);
      await scrollPanel('#panel-scenes .gb-grid', 8);
      await DM.wait(2200);
      const line = $('#panel-scenes .gb.against .cd-line');
      if (line) {
        await glide(line);
        glow(line, 2200);
      }
      await DM.wait(1400);
      const call = $('#panel-scenes .callout');
      if (call) {
        await glide(call);
        glow(call, 2200);
      }
      await DM.wait(1600);
    });

    // 4. ショットマップ
    steps.push(async () => {
      setCaption(4, '④ ショットマップ（xG）', 'どこから撃って、何点取れたかを<b>ピッチ上に表示</b>。円の大きさが「決まりやすさ（xG）」。遠目ばかり／角度のない位置ばかり、といった<b>シュート選択の良し悪し</b>が一目で分かります。');
      await tapTab('shots');
      await DM.wait(2200);
      const zones = U.$$('#panel-shots .zone').filter((n) => n.getAttribute('fill') && n.getAttribute('fill') !== 'transparent');
      const pick = zones.find((n) => /^(boxC|six)$/.test(n.dataset.zone)) || zones[0];
      if (pick) {
        await glide(pick, { scroll: false });
        glow(pick, 2000);
      }
      await DM.wait(2400);
    });

    // 5. アドバイス
    steps.push(async () => {
      setCaption(5, '⑤ 自動アドバイス', '数字から「原因の仮説 → 練習メニュー」まで提案。<b>▶ボタンで、その問題の場面を映像で確認</b>できます。');
      await tapTab('advice');
      await DM.wait(2600);
      await scrollPanel('#panel-advice .advice-cols', 6);
      await DM.wait(2400);
      if ($('#panel-advice .acol .clipbtn')) {
        await tap('#panel-advice .acol .clipbtn');
        await DM.wait(400);
        SL.ui.setTab('hl');
        await DM.until(() => SL.player.playing, 4000);
        await DM.wait(4200);
        SL.hl.stop();
      }
    });

    // 6. ハイライト（得点シーン → 失点シーンの見直し）
    steps.push(async () => {
      setCaption(6, '⑥ 得点シーン・失点シーンを、映像でカット編集', '<b>得点を決めた場面</b>と<b>決められた場面</b>を、攻撃の始まりからゴールまでまるごと自動で切り出し。原因（型）で絞り込み、開始・終了の調整とコメントを入れて、テロップ付きの動画に書き出せます。');
      SL.hl.stop();
      await tapTab('hl');
      await DM.wait(500);
      await tap('#panel-hl [data-act="preset"][data-id="score_us"]');
      await DM.wait(900);
      const play = $('#panel-hl [data-act="hl-play"]');
      if (play && !play.disabled) {
        await tap('#panel-hl [data-act="hl-play"]');
        await DM.until(() => SL.hl.st.playing && SL.player.playing, 4000);
        await DM.wait(4200);
        SL.hl.stop();
        await DM.wait(250);
      }
      await tap('#panel-hl [data-act="preset"][data-id="concede"]');
      await DM.wait(1300);
      const sum = $('#panel-hl .cd-summary');
      if (sum) {
        await glide(sum);
        glow(sum, 2600);
      }
      await DM.wait(1800);
      if ($('#panel-hl .cd-row')) {
        await tap('#panel-hl .cd-row');
        await DM.wait(1300);
      }
      const play2 = $('#panel-hl [data-act="hl-play"]');
      if (play2 && !play2.disabled) {
        await tap('#panel-hl [data-act="hl-play"]');
        await DM.until(() => SL.hl.st.playing && SL.player.playing, 4000);
        await DM.wait(6000);
        SL.hl.stop();
      }
      const ex = $('#panel-hl [data-act="export"]');
      if (ex) {
        await glide(ex);
        glow(ex, 3000);
        await DM.wait(2000);
      }
    });

    // 7. まとめ
    steps.push(async () => {
      setCaption(7, '⑦ さあ、あなたの試合で', '右上の「<b>📂 動画を読み込む</b>」で動画を選び、背番号とキーでタグ付けを始めましょう。<br><span class="dim">いまはサンプル試合です。自由に触って試せます（保存はされません）。</span>');
      SL.ui.setTab('tag');
      const btn = $('#btnLoad');
      await glide(btn, { scroll: false });
      btn.classList.add('pulse');
      await DM.wait(4800);
      btn.classList.remove('pulse');
    });
    return steps;
  }

  /* ---------- 開始・停止 ---------- */
  DM.start = async () => {
    if (DM.running) DM.stop('restart', { quiet: true });
    DM.running = true;
    document.body.classList.add('demoing');
    const tok = ++DM.token;
    DM._w = new Set();
    SL.app.openSample({ empty: true, keepDemo: true });
    $('#demoDock').hidden = true;
    layer().hidden = false;
    $('#ghost').classList.remove('on');
    const g = $('#ghost');
    g.style.left = window.innerWidth - 120 + 'px';
    g.style.top = window.innerHeight - 140 + 'px';
    const steps = scenario();
    try {
      for (let i = 0; i < steps.length; i++) {
        if (DM.token !== tok) return;
        DM.step = i;
        try {
          await steps[i]();
        } catch (e) {
          if (!(e instanceof Skip)) throw e;
        }
        if (DM.token === tok) afterStep();
      }
      if (DM.token === tok) DM.finish('done');
    } catch (e) {
      if (!(e instanceof Cancel)) console.error('demo error', e);
    }
  };

  DM._finalize = () => {
    const all = SL.app.sampleState.events;
    if (SL.store.mode === 'sample' && SL.store.state.events.length !== all.length && !DM._practice) {
      SL.store.replaceEvents(all.map((e) => Object.assign({}, e)), { noHist: true });
    }
  };

  DM.finish = (reason) => {
    DM.running = false;
    DM.token++;
    DM._w.clear();
    layer().hidden = true;
    $('#demoCap').hidden = true;
    $('#ghost').classList.remove('on');
    SL.player.pause();
    SL.player.setRate(1);
    SL.hl.stop();
    SL.tagger.esc();
    SL.tagger.team = 'H';
    SL.tagger.scene = C.SCENE_DEFAULT;
    SL.tagger.changed();
    DM._finalize();
    document.body.classList.remove('demoing');
    SL.timeline.setZoom(0);
    const dock = $('#demoDock');
    dock.hidden = false;
    dock.querySelector('.dk-msg').innerHTML = reason === 'done' ? '✅ デモは以上です。<b>サンプル試合を自由に操作</b>できます。' : '✋ <b>操作を引き継ぎました。</b>サンプル試合を自由に操作できます。';
  };

  DM.stop = (reason, opts) => {
    if (!DM.running) return;
    opts = opts || {};
    DM.running = false;
    DM.token++;
    DM._cancelWaits(new Cancel());
    document.body.classList.remove('demoing');
    layer().hidden = true;
    $('#demoCap').hidden = true;
    $('#ghost').classList.remove('on');
    SL.ui.setKeys([], '', 1);
    if (opts.quiet || reason === 'load') return;
    // 押された操作（クリックなど）が先に処理されるよう、少し待ってから状態を整える
    setTimeout(() => {
      if (SL.hl.st.playing) SL.hl.stop();
      DM.finish(reason);
    }, 120);
  };

  DM.skip = () => {
    if (DM.running) DM._cancelWaits(new Skip());
  };

  DM.init = () => {
    // 人の操作（isTrusted）が来たらデモを止める
    const onUser = (e) => {
      if (!DM.running || !e.isTrusted) return;
      if (e.target && e.target.closest && e.target.closest('#demoCap')) return;
      DM.stop('user');
    };
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((n) => window.addEventListener(n, onUser, true));
    $('#dcSkip').addEventListener('click', () => {
      if (DM.running) DM.stop('user');
    });
    $('#dcNext').addEventListener('click', () => DM.skip());
    $('#dkReplay').addEventListener('click', () => DM.start());
    $('#dkLoad').addEventListener('click', () => $('#fileInput').click());
    $('#dkClose').addEventListener('click', () => ($('#demoDock').hidden = true));
  };
})();

</script>
<script>
/* サッカー分析ラボ - 起動・キーボード・再生コントロール・サンプル試合 */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const $ = U.$;

  const RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3];

  // e.code が空の環境でも動くよう、e.key から物理キーの名前を補う
  const KEY_FALLBACK = { '[': 'BracketLeft', ']': 'BracketRight', ',': 'Comma', '.': 'Period', ' ': 'Space', '/': 'Slash', '?': 'Slash', Enter: 'Enter', Escape: 'Escape', Backspace: 'Backspace', Delete: 'Delete', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown' };
  function keyCode(e) {
    if (e.code) return e.code;
    const k = e.key || '';
    if (KEY_FALLBACK[k]) return KEY_FALLBACK[k];
    if (/^[a-z]$/i.test(k)) return 'Key' + k.toUpperCase();
    if (/^[0-9]$/.test(k)) return 'Digit' + k;
    return '';
  }

  const App = (SL.app = {
    simData: null,
    sampleState: null,

    ensureSample() {
      if (!App.simData) {
        App.simData = SL.sim.build();
        App.sampleState = SL.sim.toState(App.simData);
      }
    },

    /** サンプル試合を開く。empty=タグなし（デモ用）／practice=練習用 */
    openSample(opts) {
      opts = opts || {};
      App.ensureSample();
      if (SL.demo.running && !opts.keepDemo) SL.demo.stop('sample', { quiet: true });
      SL.hl.stop();
      const st = JSON.parse(JSON.stringify(App.sampleState));
      if (opts.empty || opts.practice) {
        st.events = [];
        st.nextId = 1;
      }
      SL.store.useSample(st);
      SL.player.loadSim(App.simData);
      SL.player.seek(0);
      SL.tagger.esc();
      SL.tagger.team = 'H';
      SL.tagger.scene = C.SCENE_DEFAULT;
      const h = SL.hl.st;
      h.presetId = 'score_us';
      h.filter = null;
      h.num = null;
      h.q = null;
      h.causes = [];
      h.edits = {};
      h.manual = [];
      h.order = 'time';
      SL.ui.afterLoad();
      SL.ui.renderActive(true);
      if (opts.practice) {
        SL.ui.setTab('tag');
        U.toast('サンプル映像でタグ付けを練習できます。Space で再生 → 背番号 → Q（ゴール）/W/E…');
      }
    },

    /** 保存してある自分の分析を開く（動画は未読み込み） */
    openUser() {
      if (SL.demo.running) SL.demo.stop('user', { quiet: true });
      SL.hl.stop();
      SL.store.useUser();
      SL.player.unload();
      $('#demoDock').hidden = true;
      SL.ui.afterLoad();
      SL.ui.setTab('stats');
      const v = SL.store.state.video.name;
      U.toast('前回の分析を開きました。動画' + (v ? '（' + v + '）' : '') + 'を読み込むと続きから再生できます');
    },

    jumpEvent(dir) {
      const P = SL.player;
      const evs = SL.store.state.events;
      const t = P.time;
      const lead = 2.5;
      let target = null;
      if (dir > 0) {
        const e = evs.find((x) => x.t - lead > t + 0.05);
        if (e) target = e;
      } else {
        for (let i = evs.length - 1; i >= 0; i--) {
          if (evs[i].t - lead < t - 0.6) {
            target = evs[i];
            break;
          }
        }
      }
      if (!target) {
        U.toast(dir > 0 ? 'これより先のタグはありません' : 'これより前のタグはありません');
        return;
      }
      SL.ui.selectEvent(target.id, { seek: true });
    },

    onKey(e) {
      const t = e.target;
      if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
      if (document.querySelector('dialog[open]')) return;
      const P = SL.player;
      const code = keyCode(e);
      const mod = e.ctrlKey || e.metaKey;
      if (mod) {
        if (code === 'KeyZ') {
          e.preventDefault();
          if (e.shiftKey) SL.store.redo();
          else if (SL.store.undo()) U.toast('取り消しました（Ctrl+Shift+Z でやり直し）');
        } else if (code === 'KeyY') {
          e.preventDefault();
          SL.store.redo();
        }
        return;
      }
      if (e.altKey) return;
      if (e.repeat && code !== 'ArrowLeft' && code !== 'ArrowRight') {
        e.preventDefault();
        return;
      }
      switch (code) {
        case 'Space':
          e.preventDefault();
          if (P.ready) P.toggle();
          return;
        case 'ArrowLeft':
          e.preventDefault();
          SL.ui.userSeek();
          P.seekBy(e.shiftKey ? -1 : -5);
          return;
        case 'ArrowRight':
          e.preventDefault();
          SL.ui.userSeek();
          P.seekBy(e.shiftKey ? 1 : 5);
          return;
        case 'ArrowUp':
          e.preventDefault();
          App.jumpEvent(-1);
          return;
        case 'ArrowDown':
          e.preventDefault();
          App.jumpEvent(1);
          return;
        case 'BracketLeft':
        case 'BracketRight': {
          e.preventDefault();
          const i = RATES.indexOf(P.rate);
          const j = U.clamp((i < 0 ? 3 : i) + (code === 'BracketRight' ? 1 : -1), 0, RATES.length - 1);
          P.setRate(RATES[j]);
          U.toast('再生速度 ×' + RATES[j]);
          return;
        }
        case 'Backspace':
        case 'Delete':
          e.preventDefault();
          if (SL.store.undo()) U.toast('直前のタグを取り消しました');
          return;
      }
      if (e.key === '?' || (code === 'Slash' && e.shiftKey)) {
        e.preventDefault();
        SL.ui.openHelp();
        return;
      }
      if (SL.tagger.handleKey({ code })) e.preventDefault();
    },

    bindTransport() {
      const P = SL.player;
      const play = $('#tpPlay');
      const time = $('#tpTime');
      const speed = $('#tpSpeed');
      const mute = $('#tpMute');
      speed.innerHTML = RATES.map((r) => `<option value="${r}" ${r === 1 ? 'selected' : ''}>×${r}</option>`).join('');
      play.addEventListener('click', () => P.ready && P.toggle());
      $('#tpBack').addEventListener('click', () => {
        SL.ui.userSeek();
        P.seekBy(-5);
      });
      $('#tpFwd').addEventListener('click', () => {
        SL.ui.userSeek();
        P.seekBy(5);
      });
      $('#tpPrev').addEventListener('click', () => App.jumpEvent(-1));
      $('#tpNext').addEventListener('click', () => App.jumpEvent(1));
      speed.addEventListener('change', () => P.setRate(+speed.value));
      mute.addEventListener('click', () => P.setMuted(!P.muted));
      let lastTxt = '';
      const updTime = (t) => {
        const txt = U.fmtTime(t, true) + ' / ' + U.fmtTime(P.duration);
        if (txt !== lastTxt) {
          lastTxt = txt;
          time.textContent = txt;
        }
        SL.ui.hudTime(t);
      };
      P.on('time', updTime);
      P.on('loaded', () => updTime(P.time));
      P.on('state', () => {
        play.textContent = P.playing ? '⏸' : '▶';
        play.title = P.playing ? '一時停止（Space）' : '再生（Space）';
        mute.textContent = P.muted ? '🔇' : '🔊';
        if (!RATES.includes(P.rate) && ![...speed.options].some((o) => +o.value === P.rate)) speed.insertAdjacentHTML('beforeend', `<option value="${P.rate}">×${P.rate}</option>`);
        speed.value = String(P.rate);
        $('#stage').classList.toggle('playing', P.playing);
      });
      // ステージのクリックで再生／停止
      $('#stage').addEventListener('click', (e) => {
        if (e.target.closest('.stage-empty')) return;
        if (P.ready) P.toggle();
      });
      $('#stage').addEventListener('dblclick', (e) => {
        if (e.target.closest('.stage-empty')) return;
        const el = $('#stage');
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen();
      });
    },

    init() {
      SL.player.init();
      SL.timeline.init();
      SL.ui.initTabs();
      SL.demo.init();
      App.bindTransport();

      // ヘッダー
      $('#btnLoad').addEventListener('click', () => $('#fileInput').click());
      $('#fileInput').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) SL.ui.loadVideoFile(f);
        e.target.value = '';
      });
      $('#btnSample').addEventListener('click', () => App.openSample());
      $('#btnDemo').addEventListener('click', () => SL.demo.start());
      $('#btnHelp').addEventListener('click', () => SL.ui.openHelp());
      $('#btnResume').addEventListener('click', () => App.openUser());
      $('#gameTitle').addEventListener('change', (e) => SL.store.patch((s) => (s.title = e.target.value.trim()), 'meta'));
      document.querySelectorAll('[data-act="stage-load"]').forEach((b) => b.addEventListener('click', () => $('#fileInput').click()));
      document.querySelectorAll('[data-act="stage-sample"]').forEach((b) => b.addEventListener('click', () => App.openSample()));

      // ドラッグ＆ドロップ
      const stage = $('#stage');
      window.addEventListener('dragover', (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
          e.preventDefault();
          stage.classList.add('drag');
        }
      });
      window.addEventListener('dragleave', (e) => {
        if (!e.relatedTarget) stage.classList.remove('drag');
      });
      window.addEventListener('drop', (e) => {
        stage.classList.remove('drag');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        e.preventDefault();
        if (/^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(f.name)) SL.ui.loadVideoFile(f);
        else if (/\.json$/i.test(f.name)) {
          f.text()
            .then((txt) => {
              SL.store.importJSON(txt);
              SL.ui.afterLoad();
              U.toast('分析データを読み込みました。動画を選んでください');
            })
            .catch((err) => U.toast('読み込めませんでした：' + err.message, 'bad'));
        } else U.toast('動画ファイル（MP4など）をドロップしてください');
      });

      // データの変更 → 画面更新
      SL.store.on(() => {
        SL.ui.updateScoreCache();
        SL.ui.hudTime(SL.player.time);
        SL.ui.updateMode();
        SL.ui.schedule();
      });
      SL.player.on('loaded', () => SL.ui.updateStage());

      // キーボード
      document.addEventListener('keydown', App.onKey);
      document.addEventListener('keyup', (e) => {
        const t = e.target;
        if (e.code === 'Space' && !(t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable))) e.preventDefault();
      });
      // セレクト・チェックボックス・スライダーは、操作後にフォーカスを外す（Space やタグ付けキーが効かなくなるのを防ぐ）
      document.addEventListener('change', (e) => {
        const t = e.target;
        if (!t || !t.tagName) return;
        if (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'range'))) setTimeout(() => t.blur(), 0);
      });
      // ボタンにフォーカスが残ると Space/Enter が誤作動するので外す
      document.addEventListener('mouseup', (e) => {
        const b = e.target.closest && e.target.closest('button');
        if (b) setTimeout(() => b.blur(), 0);
      });
      window.addEventListener('beforeunload', () => SL.store.saveNow());
      window.addEventListener('resize', () => SL.timeline.redraw());

      // 起動：サンプルを読み込み、自動デモを開始
      SL.ui.setTab('tag');
      App.ensureSample();
      SL.demo.start();
    },
  });

  window.addEventListener('DOMContentLoaded', () => {
    try {
      App.init();
    } catch (e) {
      console.error(e);
      document.body.insertAdjacentHTML('afterbegin', `<div style="padding:12px;background:#7f1d1d;color:#fff">起動エラー：${U.esc(e.message)}</div>`);
    }
  });
})();

</script>
</body>
</html>
