    if (D.isScore(e) && S && S.tl) {
      const i = S.tl.findIndex((x) => x.id === e.id);
      if (i > 0) {
        const a = S.tl[i - 1];
        const b = S.tl[i];
        const da = a.H - a.A;
        const db = b.H - b.A;
        if (Math.sign(da) !== Math.sign(db) && db !== 0) p += 1.5; // リードチェンジ
        else if (db === 0) p += 1; // 同点
      }
    }
    return p;
  };

  function labelOf(c) {
    if (c.label) return c.label;
    const evs = c.events.slice().sort((a, b) => (PRI[b.type] || 0) - (PRI[a.type] || 0));
    const top = evs[0];
    if (!top) return 'シーン';
    const who = top.num != null ? SL.store.playerLabel(top.team, top.num) : SL.store.teamName(top.team);
    let text = who + ' ' + HL.eventText(top);
    const helper = evs.find((e) => e !== top && (e.type === 'ast' || e.type === 'kp') && e.team === top.team);
    if (helper && helper.num != null) text += '（' + (helper.type === 'ast' ? 'アシスト ' : 'ラストパス ') + '#' + helper.num + '）';
    return text;
  }

  /** 状態からクリップ一覧を作り直す */
  HL.compute = () => {
    const state = SL.store.state;
    const st = HL.st;
    const preset = HL.PRESETS.find((p) => p.id === st.presetId) || HL.PRESETS[0];
    const dur = SL.player.duration || (state.events.length ? state.events[state.events.length - 1].t + 10 : 60);
    const S = SL.stats.compute(state);
    HL._S = S;
    const raw = rawWindows(preset, S, state, dur);
    raw.sort((a, b) => a.start - b.start);
    // 重なるクリップは1つにまとめる（得点／失点シーンは1本ずつ別のクリップ）
    const merged = [];
    for (const w of raw) {
      const last = merged[merged.length - 1];
      if (last && !w.noMerge && !last.noMerge && w.start <= last.end + 0.6) {
        last.end = Math.max(last.end, w.end);
        last.events = last.events.concat(w.events.filter((e) => !last.events.includes(e)));
        last.pri += w.pri;
        if (w.label && !last.label) last.label = w.label;
      } else {
        const nw = Object.assign({}, w);
        // 前のクリップと映像が重なる分は、後ろのクリップの頭を詰める
        if (nw.noMerge && last && nw.start < last.end) nw.start = Math.min(nw.t - 1, Math.max(nw.start, last.end));
        merged.push(nw);
      }
    }
    // 目標の長さ（おすすめ順に採用）
    const target = state.cfg.targetSec || (preset.special === 'best' ? 90 : 0);
    let picked = merged;
    if (target > 0) {
      const byPri = merged.slice().sort((a, b) => b.pri - a.pri);
      const chosen = [];
      let sum = 0;
      for (const c of byPri) {
        const len = c.end - c.start;
        if (sum + len > target * 1.12 && chosen.length) continue;
        chosen.push(c);
        sum += len;
        if (sum >= target) break;
      }
      picked = chosen;
    }
    if (st.order === 'cause') {
      const pi = (c) => (c.gl ? GL.priorityIndex(c.gl.primary) : 99);
      picked = picked.slice().sort((a, b) => pi(a) - pi(b) || a.start - b.start);
    } else if (st.order === 'score') picked = picked.slice().sort((a, b) => b.pri - a.pri);
    else if (st.order === 'manual') {
      const idx = (c) => {
        const i = st.manual.indexOf(c.key);
        return i < 0 ? 1e6 + c.start : i;
      };
      picked = picked.slice().sort((a, b) => idx(a) - idx(b));
    } else picked = picked.slice().sort((a, b) => a.start - b.start);

    const primary = (c) => c.events.slice().sort((a, b) => (PRI[b.type] || 0) - (PRI[a.type] || 0))[0];
    HL.clips = picked.map((c, i) => {
      const ed = st.edits[c.key] || {};
      const p = primary(c);
      const team = c.team || (p ? p.team : 'H');
      const q = D.periodAt(state.periods, c.t);
      const gl = c.gl || null;
      return {
        key: c.key,
        idx: i,
        start: Math.max(0, c.start + (ed.dStart || 0)),
        end: Math.min(dur, Math.max(c.start + (ed.dStart || 0) + 1, c.end + (ed.dEnd || 0))),
        t: c.t,
        ev: p,
        events: c.events,
        team,
        pri: c.pri,
        off: !!ed.off,
        label: labelOf(c),
        sub: D.clockFull(state, c.t),
        q,
        baseStart: c.start,
        baseEnd: c.end,
        gl,
        side: c.side || null,
        causes: gl ? gl.causes : [],
        causeText: gl ? gl.causeText : '',
        ptsAgainst: c.side === 'against' ? 1 : 0,
        ptsFor: c.side === 'for' ? 1 : 0,
        note: (state.notes && state.notes[c.key]) || '',
      };
    });
    if (st.order !== 'manual') st.manual = HL.clips.map((c) => c.key);
    return HL.clips;
  };

  HL.active = () => HL.clips.filter((c) => !c.off);
  HL.totalSec = () => HL.active().reduce((a, c) => a + (c.end - c.start), 0);

  /** クリップの編集 */
  HL.edit = (key, patch) => {
    const ed = HL.st.edits[key] || (HL.st.edits[key] = {});
    Object.assign(ed, patch);
  };
  HL.trim = (key, which, delta) => {
    const ed = HL.st.edits[key] || (HL.st.edits[key] = {});
    if (which === 'start') ed.dStart = (ed.dStart || 0) + delta;
    else ed.dEnd = (ed.dEnd || 0) + delta;
  };
  HL.move = (key, dir) => {
    const st = HL.st;
    if (st.order !== 'manual') {
      st.manual = HL.clips.map((c) => c.key);
      st.order = 'manual';
    }
    const i = st.manual.indexOf(key);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= st.manual.length) return;
    [st.manual[i], st.manual[j]] = [st.manual[j], st.manual[i]];
  };

  /** 開始／終了を、いまの再生位置にそろえる（映像を見ながらのカット編集） */
  HL.setEdge = (key, which, t) => {
    const c = HL.clips.find((x) => x.key === key);
    if (!c) return false;
    const ed = HL.st.edits[key] || (HL.st.edits[key] = {});
    if (which === 'start') {
      if (t > c.end - 1) return false;
      ed.dStart = Math.round((t - c.baseStart) * 10) / 10;
    } else {
      if (t < c.start + 1) return false;
      ed.dEnd = Math.round((t - c.baseEnd) * 10) / 10;
    }
    return true;
  };
  /** クリップごとのコメント（書き出す動画のテロップにも入る） */
  HL.setNote = (key, text) => {
    SL.store.patch((s) => {
      s.notes = s.notes || {};
      if (text) s.notes[key] = text;
      else delete s.notes[key];
    }, 'meta');
    HL.compute(); // 入力中で画面が再描画されなくても、プレビュー／書き出しにすぐ反映する
  };
  HL.toggleCause = (id) => {
    const st = HL.st;
    const i = st.causes.indexOf(id);
    if (i >= 0) st.causes.splice(i, 1);
    else st.causes.push(id);
  };
  /** 失点シーン／得点シーンの見直しを開く（cause を渡すとその原因だけ） */
  HL.openGoals = (side, cause, opts) => HL.open({ special: side === 'for' ? 'scored' : 'concede', causes: cause ? [cause] : undefined }, '', opts);
  HL.openConcede = (cause, opts) => HL.openGoals('against', cause, opts);

  /** ハイライト画面を開く。filter は「自分で選ぶ」の条件 */
  HL.open = (filter, label, opts) => {
    const st = HL.st;
    if (filter) {
      if (filter.special === 'concede' || filter.special === 'scored') {
        st.presetId = filter.special === 'concede' ? 'concede' : 'score_us';
        st.causes = filter.causes ? filter.causes.slice() : filter.cause ? [filter.cause] : [];
        st.num = filter.num != null ? filter.num : null;
        st.q = filter.q || null;
        st.filter = null;
        st.filterLabel = '';
      } else {
        st.presetId = 'custom';
        st.filter = filter;
        st.filterLabel = label || '';
        st.causes = [];
        st.num = null;
        st.q = null;
      }
    }
    st.edits = {};
    st.manual = [];
    st.order = 'time';
    SL.ui.setTab('hl');
    HL.refresh();
    if (!opts || opts.play !== false) HL.play(0);
  };
  HL.refresh = () => {
    HL.compute();
    SL.timeline.setClips(HL.active(), HL.st.playing ? HL.st.playIdx : -1);
    HL.emit();
  };

  /* ---------- プレビュー再生 ---------- */
  HL.play = async (idx) => {
    const list = HL.active();
    if (!list.length) {
      U.toast('該当するシーンがありません');
      return;
    }
    idx = U.clamp(idx, 0, list.length - 1);
    const st = HL.st;
    const my = ++HL.token;
    st.playIdx = idx;
    st.playing = true;
    const c = list[idx];
    SL.ui.showClipTag(c, idx, list.length);
    SL.timeline.setClips(list, idx);
    HL.emit();
    await SL.player.seek(c.start);
    if (my !== HL.token) return;
    SL.player.play();
  };
  HL.next = () => {
    const list = HL.active();
    if (HL.st.playIdx + 1 < list.length) HL.play(HL.st.playIdx + 1);
    else HL.stop();
  };
  HL.prev = () => HL.play(Math.max(0, HL.st.playIdx - 1));
  HL.stop = () => {
    HL.token++;
    const was = HL.st.playing;
    HL.st.playing = false;
    HL.st.playIdx = -1;
    if (was) SL.player.pause();
    SL.ui.hideClipTag();
    SL.timeline.setClips(HL.active(), -1);
    HL.emit();
  };
  /** ユーザーが自分でシーク操作をしたら、連続プレビューは終了する */
  HL.userSeek = () => {
    if (HL.st.playing) {
      HL.token++;
      HL.st.playing = false;
      HL.st.playIdx = -1;
      SL.ui.hideClipTag();
      SL.timeline.setClips(HL.active(), -1);
      HL.emit();
    }
  };
  HL.onTime = (t) => {
    const st = HL.st;
    if (!st.playing || HL.exporting) return;
    const c = HL.active()[st.playIdx];
    if (!c) return;
    if (t >= c.end - 0.04) HL.next();
  };

  /* ---------- 動画の書き出し ---------- */
  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return '';
    const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    return list.find((m) => MediaRecorder.isTypeSupported(m)) || '';
  }
  HL.canExport = () => typeof MediaRecorder !== 'undefined' && !!document.createElement('canvas').captureStream;

  function fitRect(sw, sh, W, H) {
    const s = Math.min(W / sw, H / sh);
    return { x: (W - sw * s) / 2, y: (H - sh * s) / 2, w: sw * s, h: sh * s };
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }
  const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';

  function drawOverlay(ctx, W, H, c, i, n, t, tl, state) {
    const st = HL.st;
    if (st.scorebug) {
      const sc = D.scoreAt(tl, t);
      const hn = state.teams.H.name;
      const an = state.teams.A.name;
      const clock = D.clockFull(state, t);
      ctx.font = `700 26px ${FONT}`;
      const wH = ctx.measureText(hn).width;
      const wA = ctx.measureText(an).width;
      const bw = wH + wA + 190;
      const x0 = 32;
      const y0 = 28;
      ctx.fillStyle = 'rgba(8,12,24,0.78)';
      roundRect(ctx, x0, y0, bw, 50, 12);
      ctx.fill();
      ctx.fillStyle = state.teams.H.color;
      ctx.fillRect(x0, y0 + 8, 5, 34);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillText(hn, x0 + 16, y0 + 26);
      ctx.font = `800 30px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(String(sc.H), x0 + 16 + wH + 30, y0 + 26);
      ctx.fillText('-', x0 + 16 + wH + 62, y0 + 26);
      ctx.fillText(String(sc.A), x0 + 16 + wH + 94, y0 + 26);
      ctx.font = `700 26px ${FONT}`;
      ctx.textAlign = 'left';
      ctx.fillText(an, x0 + 16 + wH + 118, y0 + 26);
      ctx.fillStyle = state.teams.A.color;
      ctx.fillRect(x0 + bw - 5, y0 + 8, 5, 34);
      ctx.font = `700 20px ${FONT}`;
      ctx.fillStyle = '#ffd166';
      ctx.textAlign = 'left';
      ctx.fillText(clock, x0 + bw + 14, y0 + 26);
    }
    if (st.lower) {
      // テロップ：1行目=内容、2行目=時刻（と失点の原因）、3行目=コメント
      const label = c.side === 'against' ? `失点｜${c.label}` : c.side === 'for' ? `得点｜${c.label}` : c.label;
      const sub = `${c.sub}　${c.causeText ? (c.side === 'against' ? '原因：' : '型：') + c.causeText + '　' : ''}（${i + 1} / ${n}）`;
      const lines = [
        { t: label, f: `800 34px ${FONT}`, c: '#fff', h: 46 },
        { t: sub, f: `600 20px ${FONT}`, c: '#b5c2de', h: 30 },
      ];
      if (c.note) lines.push({ t: '📝 ' + c.note, f: `700 24px ${FONT}`, c: '#ffd166', h: 36 });
      let wmax = 0;
      lines.forEach((l) => {
        ctx.font = l.f;
        wmax = Math.max(wmax, ctx.measureText(l.t).width);
      });
      const w = Math.min(W - 64, wmax + 70);
      const boxH = 22 + lines.reduce((a, l) => a + l.h, 0);
      const x0 = 32;
      const y0 = H - 40 - boxH;
      ctx.fillStyle = 'rgba(8,12,24,0.84)';
      roundRect(ctx, x0, y0, w, boxH, 14);
      ctx.fill();
      ctx.fillStyle = c.side === 'against' ? '#ff6b6b' : c.side === 'for' ? '#3ddc97' : state.teams[c.team] ? state.teams[c.team].color : '#2fd27f';
      ctx.fillRect(x0, y0 + 10, 7, boxH - 20);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      let y = y0 + 11;
      lines.forEach((l) => {
        ctx.font = l.f;
        ctx.fillStyle = l.c;
        ctx.fillText(l.t, x0 + 24, y + l.h / 2, w - 40);
        y += l.h;
      });
    }
  }

  function drawCard(ctx, W, H, kind, k, state, extra) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0c1a14');
    g.addColorStop(1, '#14402c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    const a = Math.min(1, k * 4, (1 - k) * 4);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (kind === 'title') {
      ctx.fillStyle = '#2fd27f';
      ctx.font = `800 30px ${FONT}`;
      ctx.fillText('HIGHLIGHTS', W / 2, H / 2 - 92);
      ctx.fillStyle = '#fff';
      ctx.font = `800 64px ${FONT}`;
      ctx.fillText(state.title || (extra && extra.label) || 'ハイライト', W / 2, H / 2 - 20, W - 160);
      ctx.font = `600 34px ${FONT}`;
      ctx.fillStyle = '#c9f5dd';
      ctx.fillText(`${state.teams.H.name}  vs  ${state.teams.A.name}`, W / 2, H / 2 + 56);
      ctx.font = `500 24px ${FONT}`;
      ctx.fillStyle = '#8fc4a8';
      ctx.fillText(`${state.date || ''}　${(extra && extra.label) || ''}`, W / 2, H / 2 + 104);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = `800 52px ${FONT}`;
      ctx.fillText('おつかれさまでした！', W / 2, H / 2 - 24);
      ctx.font = `500 26px ${FONT}`;
      ctx.fillStyle = '#8fc4a8';
      ctx.fillText('サッカー分析ラボ で作成', W / 2, H / 2 + 40);
    }
    ctx.globalAlpha = 1;
  }

  const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

  /** 選択中のクリップをつなげて 1 本の動画にする（ブラウザ内で録画するため、実時間かかります） */
  HL.export = async () => {
    const list = HL.active();
    if (!list.length) {
      U.toast('書き出すシーンがありません');
      return null;
    }
    if (!HL.canExport()) {
      U.toast('このブラウザは動画の書き出しに対応していません（Chrome / Edge をお使いください）', 'bad');
      return null;
    }
    if (HL.exporting) return null;
    const P = SL.player;
    const state = SL.store.state;
    const st = HL.st;
    HL.stop();
    const pos0 = P.time;
    const W = 1280;
    const H = 720;
    const cv = document.createElement('canvas');
    cv.width = W;
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const stream = cv.captureStream(30);
    let hasAudio = false;
    if (P.kind === 'file' && P.el.captureStream) {
      try {
        P.el
          .captureStream()
          .getAudioTracks()
          .forEach((t) => {
            stream.addTrack(t);
            hasAudio = true;
          });
      } catch (e) {}
    }
    const mime = pickMime();
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : undefined);
    const chunks = [];
    rec.ondataavailable = (e) => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    const stopped = new Promise((r) => (rec.onstop = r));
    const total = list.reduce((a, c) => a + (c.end - c.start), 0);
    const tl = D.scoreTimeline(state.events);
    const ex = (HL.exporting = { cancel: false, done: 0, total, clip: 0, n: list.length, started: performance.now() });
    HL.result = null;
    HL.emit();
    const preset = HL.PRESETS.find((p) => p.id === st.presetId) || {};
    const label = st.presetId === 'custom' ? st.filterLabel || preset.label : preset.label;

    rec.start(400);
    try {
      const cardMs = 2200;
      if (st.titleCard) {
        const t0 = performance.now();
        while (performance.now() - t0 < cardMs && !ex.cancel) {
          drawCard(ctx, W, H, 'title', (performance.now() - t0) / cardMs, state, { label });
          await nextFrame();
        }
      }
      for (let i = 0; i < list.length && !ex.cancel; i++) {
        const c = list[i];
        ex.clip = i + 1;
        await P.seek(c.start);
        const t0 = performance.now();
        if (P.kind === 'file') P.play();
        await new Promise((resolve) => {
          const tick = () => {
            if (ex.cancel) return resolve();
            const t = P.kind === 'file' ? P.el.currentTime : c.start + (performance.now() - t0) / 1000;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            if (P.kind === 'file') {
              const r = fitRect(P.el.videoWidth || W, P.el.videoHeight || H, W, H);
              ctx.drawImage(P.el, r.x, r.y, r.w, r.h);
            } else SL.sim.render(ctx, W, H, t, P.data);
            drawOverlay(ctx, W, H, c, i, list.length, t, tl, state);
            ex.done = Math.min(total, list.slice(0, i).reduce((a, x) => a + (x.end - x.start), 0) + Math.max(0, t - c.start));
            HL.emit();
            if (t >= c.end || (P.kind === 'file' && P.el.ended)) return resolve();
            requestAnimationFrame(tick);
          };
          tick();
        });
        if (P.kind === 'file') P.pause();
      }
      if (st.titleCard && !ex.cancel) {
        const t0 = performance.now();
        while (performance.now() - t0 < 1600 && !ex.cancel) {
          drawCard(ctx, W, H, 'end', (performance.now() - t0) / 1600, state);
          await nextFrame();
        }
      }
    } finally {
      try {
        rec.stop();
      } catch (e) {}
      await stopped;
      if (P.kind === 'file') P.pause();
    }
    const cancelled = ex.cancel;
    const secs = (performance.now() - ex.started) / 1000;
    HL.exporting = null;
    await P.seek(pos0);
    if (cancelled) {
      HL.emit();
      return null;
    }
    const type = (mime || 'video/webm').split(';')[0];
    const blob = new Blob(chunks, { type });
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const base = (state.title || 'highlight').replace(/[\\/:*?"<>|\s]+/g, '_');
    const name = `${base}_${(label || 'clips').replace(/[\\/:*?"<>|\s]+/g, '_')}.${ext}`;
    if (HL.result && HL.result.url) URL.revokeObjectURL(HL.result.url);
    HL.result = { blob, url: URL.createObjectURL(blob), name, size: blob.size, secs, clips: list.length, dur: total, type, hasAudio };
    HL.emit();
    return HL.result;
  };
  HL.cancelExport = () => {
    if (HL.exporting) HL.exporting.cancel = true;
  };

  /** ffmpeg を使える人向け：無劣化で切り出すスクリプト */
  HL.ffmpegScript = () => {
    const list = HL.active();
    const vname = SL.store.state.video.name || 'input.mp4';
    const lines = ['#!/bin/sh', '# サッカー分析ラボ: ハイライト切り出しスクリプト（ffmpeg が必要です）', `SRC="${vname.replace(/"/g, '')}"`, 'mkdir -p clips'];
    list.forEach((c, i) => {
      const n = String(i + 1).padStart(3, '0');
      lines.push(`ffmpeg -y -ss ${c.start.toFixed(2)} -to ${c.end.toFixed(2)} -i "$SRC" -c:v libx264 -c:a aac clips/clip_${n}.mp4  # ${c.label}`);
    });
    lines.push('ls clips/*.mp4 | sed "s/^/file /" > clips/list.txt');
    lines.push('ffmpeg -y -f concat -safe 0 -i clips/list.txt -c copy highlight.mp4');
    return lines.join('\n') + '\n';
  };
})();

</script>
<script>
/* サッカー分析ラボ - 画面の共通部分（タブ・HUD・通知・ダイアログ・動画の読み込み） */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const $ = U.$;

  const UI = (SL.ui = {
    tab: 'tag',
    views: {},
    order: [],
    tl: [{ t: 0, H: 0, A: 0 }],
    _hud: '',

    register(v) {
      UI.views[v.id] = v;
      UI.order.push(v.id);
    },

    /* ---------- タブ ---------- */
    initTabs() {
      const nav = $('#tabs');
      const panels = $('#panels');
      UI.order.forEach((id) => {
        const v = UI.views[id];
        nav.insertAdjacentHTML('beforeend', `<button class="tab" role="tab" data-tab="${id}" aria-selected="false" aria-label="${v.label}" title="${v.label}"><span class="ti">${v.icon || ''}</span><span class="tt">${v.label}</span></button>`);
        const p = document.createElement('section');
        p.className = 'panel';
        p.id = 'panel-' + id;
        p.setAttribute('role', 'tabpanel');
        panels.appendChild(p);
        if (v.init) v.init(p);
      });
      nav.addEventListener('click', (e) => {
        const b = e.target.closest('[data-tab]');
        if (b) UI.setTab(b.dataset.tab);
      });
      UI.schedule = U.rafOnce(() => UI.renderActive());
    },
    setTab(id) {
      if (!UI.views[id]) return;
      UI.tab = id;
      U.$$('.tab').forEach((b) => {
        const on = b.dataset.tab === id;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      U.$$('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + id));
      UI.renderActive(true);
      if (SL.timeline && SL.timeline.redraw) SL.timeline.redraw();
      const el = $('#panel-' + id);
      if (el) el.scrollTop = 0;
      const box = $('#panels');
      if (box) box.scrollTop = 0;
    },
    renderActive(force) {
      const v = UI.views[UI.tab];
      const root = $('#panel-' + UI.tab);
      if (!v || !root) return;
      const ae = document.activeElement;
      if (!force && ae && root.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
      try {
        v.render(root);
      } catch (e) {
        console.error('render error in ' + UI.tab, e);
        root.innerHTML = `<div class="card bad"><b>表示エラー</b><p>${U.esc(e.message)}</p></div>`;
      }
    },

    /* ---------- HUD（スコア表示・トースト・キー表示） ---------- */
    updateScoreCache() {
      UI.tl = D.scoreTimeline(SL.store.state.events);
      UI._hud = '';
    },
    hudTime(t) {
      const st = SL.store.state;
      const sc = D.scoreAt(UI.tl, t);
      const clock = D.clockFull(st, t);
      const sig = sc.H + '-' + sc.A + clock + st.teams.H.name + st.teams.A.name + st.teams.H.color + st.teams.A.color + st.events.length;
      if (sig === UI._hud) return;
      UI._hud = sig;
      const showScore = st.events.length > 0;
      $('#scorebug').innerHTML = showScore
        ? `<span class="sb-team" style="--tc:${st.teams.H.color}">${U.esc(st.teams.H.name)}</span><b class="sb-pt">${sc.H}</b><i>–</i><b class="sb-pt">${sc.A}</b><span class="sb-team" style="--tc:${st.teams.A.color}">${U.esc(st.teams.A.name)}</span><em class="sb-q">${U.esc(clock)}</em>`
        : '';
      $('#scorebug').hidden = !showScore;
    },
    stageToast(html, ms) {
      const z = $('#stageToasts');
      const el = document.createElement('div');
      el.className = 'stoast';
      el.innerHTML = html;
      z.appendChild(el);
      while (z.children.length > 3) z.firstChild.remove();
      setTimeout(() => el.classList.add('out'), ms || 2300);
      setTimeout(() => el.remove(), (ms || 2300) + 500);
    },
    onTagged(ev) {
      const st = SL.store.state;
      const meta = C.EVENTS[ev.type] || { label: ev.type };
      const team = st.teams[ev.team] || st.teams.H;
      const who = ev.num != null ? SL.store.playerLabel(ev.team, ev.num) : '';
      UI.stageToast(`<i style="background:${team.color}"></i><b>${U.esc(who || team.name)}</b> ${U.esc(meta.label.replace(/（.*）/, ''))}<em>${U.esc(D.clockFull(st, ev.t))}</em>`);
      SL.timeline.setSelected(ev.id);
    },
    _keys: [],
    _keyTimer: null,
    flashKey(k, label) {
      UI._keys.push(String(k).toUpperCase());
      if (UI._keys.length > 6) UI._keys.shift();
      UI.renderKeys(label);
      clearTimeout(UI._keyTimer);
      UI._keyTimer = setTimeout(() => {
        UI._keys = [];
        UI.renderKeys();
      }, 1400);
    },
    setKeys(list, label, ms) {
      UI._keys = list.map((k) => String(k).toUpperCase());
      UI.renderKeys(label);
      clearTimeout(UI._keyTimer);
      UI._keyTimer = setTimeout(() => {
        UI._keys = [];
        UI.renderKeys();
      }, ms || 1500);
    },
    renderKeys(label) {
      const el = $('#keyFlash');
      if (!el) return;
      el.innerHTML = UI._keys.length ? UI._keys.map((k) => `<kbd>${U.esc(k)}</kbd>`).join('') + (label ? `<span>${U.esc(label)}</span>` : '') : '';
      el.classList.toggle('on', UI._keys.length > 0);
    },
    showClipTag(c, i, n) {
      const el = $('#clipTag');
      const st = SL.store.state;
      el.hidden = false;
      const color = c.side === 'against' ? '#ff6b6b' : c.side === 'for' ? '#3ddc97' : (st.teams[c.team] || st.teams.H).color;
      const lead = c.side === 'against' ? '失点｜' : c.side === 'for' ? '得点｜' : '';
      el.innerHTML = `<i style="background:${color}"></i><div class="ct-main"><b>${lead}${U.esc(c.label)}</b><em>${U.esc(c.sub)}${c.causeText ? '　' + (c.side === 'against' ? '原因：' : '型：') + U.esc(c.causeText) : ''}　${i + 1}/${n}</em>${c.note ? `<span class="ct-note">📝 ${U.esc(c.note)}</span>` : ''}</div>`;
    },
    hideClipTag() {
      const el = $('#clipTag');
      if (el) el.hidden = true;
    },
    userSeek() {
      if (SL.hl) SL.hl.userSeek();
    },

    /* ---------- イベントの選択・編集 ---------- */
    selectEvent(id, opts) {
      const e = SL.store.getEvent(id);
      if (!e) return;
      SL.timeline.setSelected(id);
      if (opts && opts.seek) {
        UI.userSeek();
        SL.player.seek(Math.max(0, e.t - 3));
      }
      UI._selected = id;
    },
    openEdit(id) {
      const e = SL.store.getEvent(id);
      if (!e) return;
      const st = SL.store.state;
      const dlg = $('#editDlg');
      const evOpts = C.EVENT_ORDER.map((k) => `<option value="${k}" ${e.type === k ? 'selected' : ''}>${C.EVENTS[k].label}</option>`).join('');
      const sceneOpts = ['<option value="">（なし）</option>'].concat(C.SCENES.map((s) => `<option value="${s.id}" ${e.scene === s.id ? 'selected' : ''}>${s.label}</option>`)).join('');
      const tovOpts = C.TOV_TYPES.map((s) => `<option value="${s.id}" ${e.sub === s.id ? 'selected' : ''}>${s.label}</option>`).join('');
      const foulOpts = C.FOUL_TYPES.map((s) => `<option value="${s.id}" ${e.sub === s.id ? 'selected' : ''}>${s.label}</option>`).join('');
      const pkOpts = `<option value="">外れた</option><option value="saved" ${e.sub === 'saved' ? 'selected' : ''}>GKに止められた</option>`;
      const roster = (t) => st.teams[t].roster.map((p) => `<option value="${p.num}" ${e.vs === p.num ? 'selected' : ''}>#${p.num} ${U.esc(p.name)}</option>`).join('');
      const hasLoc = e.px != null && e.py != null;
      const locTxt = hasLoc ? (C.isShot(e) ? `${C.zoneLabel(C.zoneFor(C.toShot(e.px, e.py).sx, C.toShot(e.px, e.py).sy))}（ゴールまで約${Math.hypot(C.toShot(e.px, e.py).sx, C.toShot(e.px, e.py).sy).toFixed(0)}m）` : C.fieldZoneLabel(C.zoneOfEvent(e))) : '（位置は未入力）';
      dlg.innerHTML = `
        <form method="dialog" class="dlg-body" id="editForm">
          <h3>タグの編集</h3>
          <div class="fgrid">
            <label>時刻<div class="row"><button type="button" class="btn sm" data-dt="-0.5">−0.5秒</button><input id="ed_t" value="${U.fmtTime(e.t, true)}" size="8"><button type="button" class="btn sm" data-dt="0.5">＋0.5秒</button></div></label>
            <label>チーム<select id="ed_team"><option value="H" ${e.team === 'H' ? 'selected' : ''}>${U.esc(st.teams.H.name)}</option><option value="A" ${e.team === 'A' ? 'selected' : ''}>${U.esc(st.teams.A.name)}</option></select></label>
            <label>背番号<input id="ed_num" type="number" min="0" max="99" value="${e.num == null ? '' : e.num}" placeholder="（チームは 0）"></label>
            <label>プレー<select id="ed_type">${evOpts}</select></label>
            <label id="ed_sub_wrap">種類<select id="ed_sub"></select></label>
            <label id="ed_vs_wrap">ファウルを受けた選手（相手）<select id="ed_vs"><option value="">（不明）</option></select></label>
            <label id="ed_scene_wrap">攻撃の型<select id="ed_scene">${sceneOpts}</select></label>
            <label id="ed_body_wrap">体の部位<select id="ed_body"><option value="">足</option><option value="head" ${e.body === 'head' ? 'selected' : ''}>ヘディング</option></select></label>
            <label class="wide">位置<span class="dim" id="ed_loc">${U.esc(locTxt)}</span>${hasLoc ? '<button type="button" class="btn sm" id="ed_clearloc">位置を消す</button>' : ''}</label>
            <label class="wide">メモ<input id="ed_note" type="text" value="${U.esc(e.note || '')}" placeholder="例：ここから流れが変わった"></label>
          </div>
          <div class="dlg-actions">
            <button type="button" class="btn danger" id="ed_del">削除</button>
            <span class="spacer"></span>
            <button type="button" class="btn" id="ed_go">▶ この場面を見る</button>
            <button type="button" class="btn" id="ed_cancel">キャンセル</button>
            <button type="submit" class="btn primary" id="ed_save" value="save">保存</button>
          </div>
        </form>`;
      let clearLoc = false;
      const subSel = $('#ed_sub', dlg);
      const refresh = () => {
        const ty = $('#ed_type', dlg).value;
        const team = $('#ed_team', dlg).value;
        const meta = C.EVENTS[ty];
        const wrap = $('#ed_sub_wrap', dlg);
        if (ty === 'tov') {
          subSel.innerHTML = tovOpts;
          wrap.hidden = false;
        } else if (ty === 'foul') {
          subSel.innerHTML = foulOpts;
          wrap.hidden = false;
        } else if (ty === 'pkx') {
          subSel.innerHTML = pkOpts;
          wrap.hidden = false;
        } else wrap.hidden = true;
        $('#ed_vs_wrap', dlg).hidden = ty !== 'foul';
        $('#ed_vs', dlg).innerHTML = '<option value="">（不明）</option>' + roster(D.other(team));
        $('#ed_scene_wrap', dlg).hidden = !(meta && meta.shot && !meta.pk && !meta.own);
        $('#ed_body_wrap', dlg).hidden = !(meta && meta.shot && !meta.pk && !meta.own);
      };
      refresh();
      $('#ed_type', dlg).addEventListener('change', refresh);
      $('#ed_team', dlg).addEventListener('change', refresh);
      dlg.querySelectorAll('[data-dt]').forEach((b) =>
        b.addEventListener('click', () => {
          const inp = $('#ed_t', dlg);
          const t = U.parseTime(inp.value);
          inp.value = U.fmtTime(Math.max(0, (isFinite(t) ? t : e.t) + parseFloat(b.dataset.dt)), true);
        })
      );
      const cl = $('#ed_clearloc', dlg);
      if (cl)
        cl.addEventListener('click', () => {
          clearLoc = true;
          $('#ed_loc', dlg).textContent = '（保存すると位置が消えます）';
        });
      $('#ed_cancel', dlg).addEventListener('click', () => dlg.close());
      $('#ed_go', dlg).addEventListener('click', () => {
        dlg.close();
        UI.selectEvent(e.id, { seek: true });
      });
      $('#ed_del', dlg).addEventListener('click', () => {
        SL.store.removeEvent(e.id);
        dlg.close();
      });
      $('#editForm', dlg).addEventListener('submit', (ev) => {
        ev.preventDefault();
        const t = U.parseTime($('#ed_t', dlg).value);
        const type = $('#ed_type', dlg).value;
        const meta = C.EVENTS[type];
        const numRaw = $('#ed_num', dlg).value;
        const patch = {
          t: isFinite(t) ? t : e.t,
          team: $('#ed_team', dlg).value,
          type,
          num: meta.noPlayer ? null : numRaw === '' ? 0 : parseInt(numRaw, 10),
          note: $('#ed_note', dlg).value || undefined,
        };
        patch.sub = type === 'tov' || type === 'foul' || type === 'pkx' ? subSel.value || undefined : undefined;
        patch.vs = type === 'foul' && $('#ed_vs', dlg).value !== '' ? parseInt($('#ed_vs', dlg).value, 10) : undefined;
        if (meta.shot && !meta.pk && !meta.own) {
          patch.scene = $('#ed_scene', dlg).value || undefined;
          patch.body = $('#ed_body', dlg).value || undefined;
        } else if (meta.pk) {
          patch.scene = 'pk';
          patch.body = undefined;
        } else {
          patch.scene = undefined;
          patch.body = undefined;
        }
        if (clearLoc || !meta.loc) {
          patch.px = undefined;
          patch.py = undefined;
        }
        if (patch.num != null && patch.num !== 0) SL.store.ensurePlayer(patch.team, patch.num);
        SL.store.updateEvent(e.id, patch);
        dlg.close();
      });
      dlg.showModal();
    },

    /* ---------- 確認ダイアログ（ブラウザ標準の confirm は使わない） ---------- */
    ask(title, message, buttons) {
      return new Promise((resolve) => {
        const dlg = $('#askDlg');
        dlg.innerHTML = `<div class="dlg-body"><h3>${U.esc(title)}</h3><p class="dlg-msg">${message}</p><div class="dlg-actions"><span class="spacer"></span>${buttons
          .map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}" data-i="${i}">${U.esc(b.label)}</button>`)
          .join('')}</div></div>`;
        const done = (v) => {
          dlg.close();
          resolve(v);
        };
        dlg.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => done(+b.dataset.i)));
        dlg.addEventListener('cancel', () => resolve(-1), { once: true });
        dlg.showModal();
      });
    },

    openHelp() {
      const rows = [
        ['Space', '再生／一時停止'],
        ['← →', '5秒戻る／進む（Shift で1秒）'],
        ['↑ ↓', '前／次のタグへジャンプ'],
        ['[ ]', '再生速度を下げる／上げる'],
        ['0-9', '背番号を入力（2桁OK）'],
        ['Q', 'ゴール（このあとラストパスの背番号を入力 → アシスト）'],
        ['W E R', '枠内シュート（止められた）／枠外／ブロックされた'],
        ['T Y', 'PK 成功／失敗'],
        ['U', 'オウンゴール'],
        ['A S', 'アシスト／キーパス（シュートの一つ前のパス）'],
        ['D F G', 'タックル／インターセプト／クリア'],
        ['C', 'コーナーキック'],
        ['Z', 'ボールロスト（このあと 1〜6 で種類）'],
        ['X', 'ファウル（このあと、受けた選手の背番号）'],
        ['B', 'オフサイド'],
        ['J K', 'イエロー／レッドカード'],
        ['N', 'メモ（しおり）'],
        ['H', '次のシュートをヘディングにする'],
        ['V', '自チーム／相手チームの切り替え'],
        [', .', '攻撃の型（カウンター・クロス…）を前／次へ'],
        ['L', '攻撃の型を固定（次のシュートでも戻さない）'],
        ['Enter', '入力の確定／フォローアップをスキップ'],
        ['Esc', '入力の取り消し'],
        ['Backspace', '直前のタグを取り消す（Ctrl+Z も可）'],
        ['?', 'このヘルプ'],
      ];
      const dlg = $('#helpDlg');
      dlg.innerHTML = `<div class="dlg-body"><h3>キーボードショートカット</h3>
        <p class="dim">タグ付けは「背番号 → プレーのキー」（例：<kbd>1</kbd><kbd>0</kbd><kbd>Q</kbd> で #10 のゴール）。プレー → 背番号の順でもOKです。ピッチ図をクリックすると、次のタグにその位置が付きます。</p>
        <div class="help-grid">${rows.map(([k, d]) => `<div><span class="hk">${k.split(' ').map((x) => `<kbd>${U.esc(x)}</kbd>`).join('')}</span><span>${U.esc(d)}</span></div>`).join('')}</div>
        <div class="dlg-actions"><span class="spacer"></span><button class="btn primary" id="helpClose">閉じる</button></div></div>`;
      $('#helpClose', dlg).addEventListener('click', () => dlg.close());
      dlg.showModal();
    },

    /* ---------- ステージ・ヘッダー ---------- */
    updateStage() {
      const P = SL.player;
      $('#stage').classList.toggle('empty', P.kind === 'none');
    },
    updateMode() {
      const st = SL.store.state;
      const chip = $('#modeChip');
      if (SL.store.mode === 'sample') {
        chip.textContent = 'サンプル試合（保存されません）';
        chip.className = 'mode-chip sample';
      } else {
        chip.textContent = 'マイ分析' + (st.video.name ? '：' + st.video.name : '');
        chip.className = 'mode-chip user';
      }
      const ti = $('#gameTitle');
      if (document.activeElement !== ti) ti.value = st.title || '';
      const rb = $('#btnResume');
      if (rb) {
        const has = SL.store.mode === 'sample' && SL.store.hasUserWork();
        rb.hidden = !has;
        if (has) {
          const u = SL.store.readUser();
          rb.textContent = '📂 前回の分析を開く（' + u.events.length + '件）';
          rb.title = '前回の分析：' + (u.title || u.video.name || '無題');
        }
      }
    },

    /* ---------- 動画の読み込み ---------- */
    async loadVideoFile(file) {
      if (!file) return;
      if (SL.demo) SL.demo.stop('load');
      const store = SL.store;
      let info;
      try {
        U.toast('動画を読み込んでいます…');
        info = await SL.player.loadFile(file);
      } catch (e) {
        U.toast(e.message || '読み込みに失敗しました', 'bad');
        UI.updateStage();
        return;
      }
      const vinfo = { name: file.name, size: file.size, duration: info.duration };
      const saved = store.readUser();
      const sameVideo = (v) => v && v.name === vinfo.name && v.size === vinfo.size;
      if (store.mode === 'user') {
        const cur = store.state;
        if (sameVideo(cur.video) || !cur.video.name) {
          store.patch((s) => (s.video = vinfo), 'video');
        } else if (cur.events.length) {
          const r = await UI.ask('別の動画が読み込まれました', `現在の分析（${cur.events.length}件のタグ）は「${U.esc(cur.video.name)}」用です。<br>新しい動画用に、新規で分析を始めますか？（今の分析はバックアップされます）`, [
            { label: '今の分析を続ける（動画だけ差し替え）' },
            { label: '新規で始める', primary: true },
          ]);
          if (r === 1) {
            store.backupUser();
            store.newUserProject({ video: vinfo });
          } else store.patch((s) => (s.video = vinfo), 'video');
        } else store.patch((s) => (s.video = vinfo), 'video');
      } else {
        if (saved && sameVideo(saved.video)) {
          store.useUser();
          U.toast('前回の続きから開きました（' + saved.events.length + '件のタグ）');
        } else if (saved && saved.events.length) {
          const r = await UI.ask('前回の分析があります', `「${U.esc(saved.video.name || '無題')}」の分析（${saved.events.length}件のタグ）が保存されています。<br>この動画で新規に始めますか？`, [
            { label: '前回の分析に動画を割り当てる' },
            { label: '新規で始める（前回はバックアップ）', primary: true },
          ]);
          if (r === 1) {
            store.backupUser();
            store.newUserProject({ video: vinfo });
          } else {
            store.useUser();
            store.patch((s) => (s.video = vinfo), 'video');
          }
        } else store.newUserProject({ video: vinfo });
      }
      if (!store.state.title) store.patch((s) => (s.title = file.name.replace(/\.[^.]+$/, '')), 'meta');
      $('#demoDock').hidden = true;
      UI.afterLoad();
      UI.setTab('tag');
      U.toast('読み込みました。Space で再生 → 背番号とQ/W/Eなどのキーでタグ付けできます');
    },
    afterLoad() {
      UI.updateStage();
      UI.updateMode();
      UI.updateScoreCache();
      SL.timeline.setZoom(0);
      SL.timeline.redraw();
      UI.hudTime(SL.player.time);
    },
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「タグ付け」タブ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const esc = U.esc;
  const TG = SL.tagger;

  function pendingHtml() {
    const bits = [];
    if (TG.buf) bits.push(`<span class="pd-num">#${esc(TG.buf)}<i class="caret"></i></span>`);
    else if (TG.pending.num != null) bits.push(`<span class="pd-num">${esc(SL.store.playerLabel(TG.team, TG.pending.num))}</span>`);
    if (TG.pending.ev) bits.push(`<span class="pd-ev">${esc(C.EVENTS[TG.pending.ev].label)}</span>`);
    if (!bits.length) return `<span class="dim">背番号を押して → プレーのキー。例：<kbd>1</kbd><kbd>0</kbd> → <kbd>Q</kbd> ＝ #10 のゴール</span>`;
    let hint = '';
    if (TG.pending.ev && TG.pending.num == null && !TG.buf) hint = '選手（背番号）を選んでください';
    else if (TG.buf) hint = '確定は少し待つか Enter';
    else if (TG.pending.num != null && !TG.pending.ev) hint = 'プレーのキー／ボタンを押してください';
    return bits.join('<i class="pd-plus">＋</i>') + (hint ? `<span class="pd-hint">${hint}</span>` : '');
  }

  function followHtml() {
    const f = TG.follow;
    if (!f) return '';
    const st = SL.store.state;
    if (f.kind === 'pass') {
      const shot = SL.store.getEvent(f.shotId);
      const mates = st.teams[f.team].roster.filter((p) => !shot || p.num !== shot.num);
      return `<div class="followbar assist"><div class="fq"><b>${f.isGoal ? '🅰 アシスト（ラストパス）は？' : '🅰 キーパス（シュートの一つ前のパス）は？'}</b> <span class="dim">背番号を入力して Enter ／ なしなら Esc</span></div>
        <div class="fchips">${mates.map((p) => `<button class="pbtn sm" data-act="fpass" data-num="${p.num}"><b>${p.num}</b><span>${esc(p.name)}</span></button>`).join('')}<button class="btn sm" data-act="fskip">${f.isGoal ? 'アシストなし' : 'なし'}</button></div></div>`;
    }
    if (f.kind === 'victim') {
      const mates = st.teams[f.vsTeam].roster;
      return `<div class="followbar sub"><div class="fq"><b>⚠ ファウルを受けた相手の選手は？</b> <span class="dim">背番号を入力して Enter ／ 不明なら Esc</span></div>
        <div class="fchips">${mates.map((p) => `<button class="pbtn sm" data-act="fvictim" data-num="${p.num}" style="--tc:${st.teams[f.vsTeam].color}"><b>${p.num}</b><span>${esc(p.name)}</span></button>`).join('')}<button class="btn sm ghost" data-act="fskip">わからない</button></div></div>`;
    }
    return `<div class="followbar sub"><div class="fq"><b>⚠ ボールロストの種類は？</b> <span class="dim">数字キー（1〜）でも選べます</span></div>
      <div class="fchips">${C.TOV_TYPES.map((o, i) => `<button class="btn sm" data-act="fsub" data-id="${o.id}"><kbd>${i + 1}</kbd>${esc(o.label.replace(/（.*）/, ''))}</button>`).join('')}<button class="btn sm ghost" data-act="fskip">あとで</button></div></div>`;
  }

  function idNum(id) {
    return parseInt(String(id).slice(1), 10) || 0;
  }

  /** 1件のタグの補足（型・位置・xG など） */
  function extraOf(e) {
    const extra = [];
    if (e.type === 'tov') extra.push(C.tovLabel(e.sub || 'other').replace(/（.*）/, ''));
    if (e.type === 'foul') extra.push(C.foulLabel(e.sub || 'other').replace(/（.*）/, ''));
    if (C.isShot(e)) {
      if (e.scene && e.scene !== C.SCENE_DEFAULT && !(C.EVENTS[e.type] || {}).pk) extra.push(C.sceneShort(e.scene));
      if (e.body === 'head') extra.push('ヘディング');
      const pos = C.shotPos(e);
      if (pos) extra.push(C.zoneLabel(C.zoneFor(pos.sx, pos.sy)).replace(/（.*）/, '') + ' xG ' + SL.xg.of(e).toFixed(2));
    } else if (e.px != null) extra.push(C.fieldZoneShort(C.zoneOfEvent(e)));
    if (e.type === 'foul' && e.vs != null) extra.push('被 #' + e.vs);
    return extra;
  }

  function recentHtml() {
    const st = SL.store.state;
    const list = st.events.slice().sort((a, b) => idNum(b.id) - idNum(a.id)).slice(0, 7);
    if (!list.length) return '<div class="empty-note">まだタグがありません。</div>';
    return list
      .map((e) => {
        const meta = C.EVENTS[e.type] || { label: e.type };
        const team = st.teams[e.team] || st.teams.H;
        const who = e.num != null ? SL.store.playerLabel(e.team, e.num) : '';
        return `<div class="rrow" data-id="${e.id}">
          <button class="rt" data-act="seek" data-id="${e.id}" title="この場面へ移動">${U.fmtTime(e.t)}</button>
          <i class="rdot" style="background:${team.color}"></i>
          <span class="rwho">${esc(who || team.name)}</span>
          <span class="rev ev-${e.type}">${esc(meta.label.replace(/（.*）/, ''))}</span>
          <span class="rextra">${esc(extraOf(e).join(' ・ '))}</span>
          <button class="ricon" data-act="edit" data-id="${e.id}" title="編集">✎</button>
          <button class="ricon" data-act="del" data-id="${e.id}" title="削除">✕</button>
        </div>`;
      })
      .join('');
  }

  function locText() {
    const loc = TG.attrs.loc;
    if (!loc) return 'ピッチをクリックすると、次のタグ（シュート・ロスト・ファウルなど）にその位置が付きます（任意）。';
    const sp = C.toShot(loc.px, loc.py);
    const zone = C.zoneFor(sp.sx, sp.sy);
    const xg = SL.xg.at(sp.sx, sp.sy);
    return `位置を記録：${C.fieldZoneShort(C.fieldZone(loc.px, loc.py))}（シュートなら ${C.zoneLabel(zone).replace(/（.*）/, '')}・ゴールまで約${Math.hypot(sp.sx, sp.sy).toFixed(0)}m・xG目安 ${xg.toFixed(2)}）`;
  }

  function html() {
    const st = SL.store.state;
    const team = TG.team;
    const T = st.teams[team];
    const onboarding =
      !st.events.length && SL.player.kind === 'none'
        ? `<div class="card info onboard"><b>はじめかた</b>
          <ol><li>右上の「📂 動画を読み込む」で試合の動画を選びます（MP4推奨）。</li>
          <li>動画を見ながら、<kbd>背番号</kbd> → <kbd>Q</kbd>（ゴール）などでタグを付けます。マウスでもOK。</li>
          <li>「集計」「ショット」「アドバイス」「ハイライト」タブに結果が自動で出ます。</li></ol>
          <div class="row gap"><button class="btn sm" data-act="opensample">サンプル試合で試す</button><button class="btn sm ghost" data-act="rundemo">デモを見る</button></div></div>`
        : '';

    const teamSwitch = ['H', 'A']
      .map((t) => `<button class="team-btn ${t === team ? 'on' : ''}" data-act="team" data-team="${t}" style="--tc:${st.teams[t].color}"><i></i><span>${esc(st.teams[t].name)}</span>${t === 'H' ? '<em>自</em>' : '<em>相</em>'}</button>`)
      .join('');

    const rosterBtns = T.roster
      .map((p) => `<button class="pbtn ${TG.pending.num === p.num ? 'on' : ''}" data-act="player" data-team="${team}" data-num="${p.num}" style="--tc:${T.color}" title="${esc(p.name || '')} ${p.pos || ''}"><b>${p.num}</b><span>${esc(p.name)}</span>${p.pos === 'GK' ? '<em class="gkb">GK</em>' : ''}</button>`)
      .join('');
    const teamBtn = `<button class="pbtn team ${TG.pending.num === 0 ? 'on' : ''}" data-act="player" data-team="${team}" data-num="0" title="個人に付けないプレー（チーム全体のメモなど）"><b>0</b><span>チーム</span></button>`;

    const evGroups = C.EVENT_GROUPS.map((g) => {
      const btns = C.EVENT_ORDER.filter((k) => C.EVENTS[k].group === g.id)
        .map((k) => {
          const m = C.EVENTS[k];
          return `<button class="evbtn ev-${k} ${TG.pending.ev === k ? 'on' : ''}" data-act="event" data-type="${k}"><kbd>${m.kl}</kbd><span>${esc(m.label.replace(/（.*）/, ''))}</span></button>`;
        })
        .join('');
      return `<div class="evgroup"><div class="evg-title">${g.label}</div><div class="evrow g-${g.id}">${btns}</div></div>`;
    }).join('');

    const chip = (s) => `<button class="schip ${s.set ? 'set' : ''} ${TG.scene === s.id ? 'on' : ''}" data-act="scene" data-id="${s.id}" title="${esc(s.hint)}">${esc(s.short)}</button>`;
    const sceneOpen = C.SCENES.filter((s) => s.open).map(chip).join('');
    const sceneSet = C.SCENES.filter((s) => s.set && s.id !== 'pk').map(chip).join('');

    const loc = TG.attrs.loc;
    const pitchSvg = SL.pitch.full({ cls: 'pitch-svg full mini', marker: loc });

    const ps = st.periods.slice().sort((a, b) => a.start - b.start);
    const periodBtns = [1, 2, 3, 4]
      .map((q) => {
        const p = ps.find((x) => x.q === q);
        return `<button class="qbtn ${p ? 'set' : ''}" data-act="period" data-q="${q}" title="${p ? D.qLabel(q) + ' 開始：' + U.fmtTime(p.start, true) + '（クリックで現在位置に更新）' : '現在位置を' + D.qLabel(q) + 'の開始にする'}">${D.qLabel(q)}${p ? '<em>' + U.fmtTime(p.start) + '</em>' : ''}</button>`;
      })
      .join('');

    return `
      ${onboarding}
      <div class="team-switch" role="group" aria-label="チーム切り替え">${teamSwitch}<kbd class="vkey" title="V キーで切り替え">V</kbd></div>
      <div class="pending ${TG.pending.ev || TG.pending.num != null || TG.buf ? 'active' : ''}" aria-live="polite">${pendingHtml()}</div>
      ${followHtml()}
      <div class="sect">
        <h4>選手 <span class="dim">（背番号キー または クリック）</span></h4>
        <div class="roster">${rosterBtns}${teamBtn}
          <span class="addp"><input id="addNum" class="numinput" type="number" min="1" max="99" placeholder="背番号"><input id="addName" class="nameinput" type="text" placeholder="名前(任意)"><button class="btn sm" data-act="addplayer" data-team="${team}">＋追加</button></span>
        </div>
      </div>
      <div class="sect">
        <h4>プレー <span class="dim">（キー または クリック）</span></h4>
        ${evGroups}
      </div>
      <div class="sect">
        <h4>攻撃の型 <span class="dim">（シュートに付く。<kbd>,</kbd><kbd>.</kbd> で切替）</span> <button class="schip lock ${TG.lock ? 'on' : ''}" data-act="lock" title="次のシュートでも型を戻さない（L）">${TG.lock ? '🔒 固定中' : '🔓 シュートごとに戻す'}</button></h4>
        <div class="scenebar"><span class="sg-l">流れの中</span>${sceneOpen}</div>
        <div class="scenebar"><span class="sg-l">セットプレー</span>${sceneSet}</div>
      </div>
      <div class="sect attrs">
        <h4>ピッチ上の位置・ヘディング <span class="dim">（任意）</span></h4>
        <div class="attrs-row">
          <div class="minipitch">${pitchSvg}</div>
          <div class="attrs-side">
            <p class="dim loc-text">${locText()}</p>
            <div class="row gap wrap">
              <button class="btn sm ${loc ? '' : 'disabled'}" data-act="clearloc">位置をクリア</button>
              <button class="btn sm ${TG.attrs.head ? 'primary' : ''}" data-act="head" title="次のシュートをヘディングにする（H）">🗣 ヘディング（<kbd>H</kbd>）</button>
            </div>
            <p class="dim tiny">位置を入れたシュートは、xG（ゴール期待値）とショットマップに反映されます。この図は「選んでいるチームが右へ攻める」向きです。</p>
          </div>
        </div>
      </div>
      <div class="sect">
        <h4>最近のタグ <span class="grow"></span>
          <button class="btn sm" data-act="undo" ${SL.store.canUndo() ? '' : 'disabled'} title="Backspace / Ctrl+Z">↶ 取り消す</button>
          <button class="btn sm ghost" data-act="gotolog">すべて見る・編集</button></h4>
        <div class="recent">${recentHtml()}</div>
      </div>
      <div class="sect">
        <h4>前半・後半の区切り <span class="dim">（動画を該当位置で止めて押す。現在 ${U.fmtTime(SL.player.time, true)}）</span></h4>
        <div class="qrow">${periodBtns}</div>
      </div>`;
  }

  function onClick(e) {
    const svg = e.target.closest('svg.mini');
    if (svg) {
      const p = SL.pitch.fullPoint(svg, e);
      TG.setLoc({ px: p.px, py: p.py });
      return;
    }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    switch (act) {
      case 'team':
        TG.setTeam(b.dataset.team);
        break;
      case 'player':
        TG.pickPlayer(b.dataset.team, +b.dataset.num);
        break;
      case 'event':
        SL.ui.flashKey(C.EVENTS[b.dataset.type].kl);
        TG.pickEvent(b.dataset.type);
        break;
      case 'scene':
        TG.setScene(b.dataset.id);
        break;
      case 'lock':
        TG.toggleLock();
        break;
      case 'clearloc':
        TG.setLoc(null);
        break;
      case 'head':
        TG.toggleHead();
        break;
      case 'fpass':
        TG.applyPass(+b.dataset.num);
        break;
      case 'fvictim':
        TG.applyVictim(+b.dataset.num);
        break;
      case 'fsub':
        TG.applySub(b.dataset.id);
        break;
      case 'fskip':
        TG.skipFollow();
        break;
      case 'seek':
        SL.ui.selectEvent(b.dataset.id, { seek: true });
        break;
      case 'edit':
        SL.ui.openEdit(b.dataset.id);
        break;
      case 'del':
        SL.store.removeEvent(b.dataset.id);
        break;
      case 'undo':
        SL.store.undo();
        break;
      case 'gotolog':
        SL.ui.setTab('log');
        break;
      case 'period':
        TG.markPeriod(+b.dataset.q);
        break;
      case 'addplayer': {
        const numEl = U.$('#addNum');
        const nameEl = U.$('#addName');
        const num = parseInt(numEl.value, 10);
        if (!isFinite(num) || num < 0) {
          U.toast('背番号を入力してください');
          break;
        }
        const p = SL.store.ensurePlayer(b.dataset.team, num);
        if (nameEl.value.trim()) SL.store.patch(() => (p.name = nameEl.value.trim()));
        numEl.value = '';
        nameEl.value = '';
        SL.ui.renderActive(true);
        break;
      }
      case 'opensample':
        SL.app.openSample();
        break;
      case 'rundemo':
        SL.demo.start();
        break;
    }
    if (b.blur) b.blur();
  }

  SL.ui.register({
    id: 'tag',
    label: 'タグ付け',
    icon: '🏷',
    init(root) {
      root.addEventListener('click', onClick);
      root.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.target.id === 'addNum' || e.target.id === 'addName')) {
          e.preventDefault();
          U.$('[data-act="addplayer"]', root).click();
        }
      });
      TG.onChange(() => {
        if (SL.ui.tab === 'tag') SL.ui.schedule();
      });
    },
    render(root) {
      root.innerHTML = html();
    },
  });
})();

</script>
<script>
/* サッカー分析ラボ - 「集計」「場面別」タブ */
(function () {
  const SL = (window.SL = window.SL || {});
  const U = SL.util;
  const C = SL.C;
  const D = SL.derive;
  const ST = SL.stats;
  const GL = SL.goals;
  const esc = U.esc;
  const pct = ST.fmtPct;
  const num = ST.fmtNum;
  const SHOTS = C.SHOT_TYPES;

  const vs = { team: 'H', q: 0, sort: 'num', dir: 1 };
  const vsc = { team: 'H' };

  const HELP = {
    xg: 'xG（ゴール期待値）＝ そのシュートが決まる確率を、位置（距離・角度）とヘディング・攻撃の型から概算した値。合計すると「そのチームが取れるはずだった得点」の目安になります。',
    xa: 'xA ＝ アシスト／キーパスの相手が打ったシュートの xG の合計。パスの質を見る指標です。',
    big: '決定機 ＝ xG が 0.3 以上のシュート（PKを除く）。決めるべきチャンスの数です。',
    conv: 'シュート決定率 ＝ ゴール ÷ シュート。プロの目安は約10%。',
    acc: '枠内率 ＝ 枠内シュート ÷ シュート。',
    gxg: 'ゴール − xG。プラスなら期待以上に決めた（または相手GKが不調）、マイナスなら決め切れていない。',
    ga: 'G+A ＝ ゴール＋アシスト。',
    lost: 'ボールロスト ＝ ボールを失った回数（人が付けた分のみ）。',
    fouled: '受けたファウル ＝ 相手に止められた回数。',
  };
  const tip = (k) => `<span class="q" title="${esc(HELP[k])}">?</span>`;

  function scoreHeader(S, st) {
    return `<div class="scoreline"><span class="sl-team" style="--tc:${st.teams.H.color}">${esc(st.teams.H.name)}</span><b>${S.score.H}</b><i>–</i><b>${S.score.A}</b><span class="sl-team" style="--tc:${st.teams.A.color}">${esc(st.teams.A.name)}</span></div>`;
  }

  /* ---------- 得点経過 ---------- */
  function goalsList(S, st) {
    if (!S.goals.length) return '<div class="empty-note">ゴール（Q）のタグが付くと、得点経過がここに並びます。</div>';
    const rows = S.goals
      .map((g) => {
        const t = st.teams[g.team];
        const scorerTeam = g.scorerTeam;
        const kind = g.own ? 'オウンゴール' : g.pk ? 'PK' : g.body === 'head' ? 'ヘディング' : '';
        const sc = g.own ? '' : C.sceneShort(g.scene);
        return `<button class="goal-row" data-act="goalseek" data-id="${g.id}" title="このゴールの場面へ">
          <span class="gr-clock">${esc(g.clock)}</span>
          <i class="rdot" style="background:${t.color}"></i>
          <span class="gr-main"><b>${esc(SL.store.playerLabel(scorerTeam, g.scorer) || t.name)}</b>${g.assister != null ? `<small>アシスト ${esc(SL.store.playerLabel(g.team, g.assister))}</small>` : ''}</span>
          <span class="gr-tags">${kind ? `<span class="chip">${esc(kind)}</span>` : ''}${sc && !g.pk ? `<span class="chip alt">${esc(sc)}</span>` : ''}${g.xg != null ? `<span class="chip dimchip">xG ${g.xg.toFixed(2)}</span>` : ''}</span>
        </button>`;
      })
      .join('');
    return `<div class="goal-list">${rows}</div>`;
  }

  /* ---------- チーム比較 ---------- */
  function compare(S, st) {
    const H = S.team.H;
    const A = S.team.A;
    const rows = [
      { l: 'ゴール', h: S.score.H, a: S.score.A, better: 'high', fmt: (v) => v },
      { l: 'シュート', h: H.shots, a: A.shots, better: 'high' },
      { l: '枠内シュート', h: H.sot, a: A.sot, better: 'high' },
      { l: 'xG（ゴール期待値）', h: H.xg, a: A.xg, better: 'high', fmt: (v) => v.toFixed(2), help: 'xg' },
      { l: '決定機（xG 0.3以上）', h: H.big, a: A.big, better: 'high', help: 'big' },
      { l: 'コーナーキック', h: H.ck, a: A.ck, better: 'high' },
      { l: 'キーパス＋アシスト', h: H.kp + H.ast, a: A.kp + A.ast, better: 'high' },
      { l: 'タックル＋インターセプト', h: H.tkl + H.itc, a: A.tkl + A.itc, better: 'high' },
      { l: 'ボールロスト', h: H.tov, a: A.tov, better: 'low', help: 'lost' },
      { l: 'ファウル', h: H.foul, a: A.foul, better: 'low' },
      { l: 'イエローカード', h: H.yc, a: A.yc, better: 'low' },
      { l: 'レッドカード', h: H.rc, a: A.rc, better: 'low' },
      { l: 'オフサイド', h: H.off, a: A.off, better: 'low' },
      { l: 'GKのセーブ', h: H.saves, a: A.saves, better: 'high' },
    ];
    const poss = SL.store.state.cfg.possH;
    if (poss != null) rows.splice(1, 0, { l: 'ボール支配率（入力値）', h: poss, a: 100 - poss, better: 'high', fmt: (v) => v + '%' });
    return `<div class="cmp">${rows
      .map((r) => {
        const fmt = r.fmt || ((v) => String(v));
        const mx = Math.max(r.h, r.a, 0.0001);
        let cls = '';
        if (r.h !== r.a) {
          const hBetter = r.better === 'high' ? r.h > r.a : r.h < r.a;
          cls = hBetter ? 'h-win' : 'a-win';
        }
        return `<div class="cmp-row ${cls}">
          <div class="cmp-v l"><b>${fmt(r.h)}</b></div>
          <div class="cmp-bar l"><i style="width:${((r.h / mx) * 100).toFixed(0)}%;background:${st.teams.H.color}"></i></div>
          <div class="cmp-c">${esc(r.l)}${r.help ? ' ' + tip(r.help) : ''}</div>
          <div class="cmp-bar r"><i style="width:${((r.a / mx) * 100).toFixed(0)}%;background:${st.teams.A.color}"></i></div>
          <div class="cmp-v r"><b>${fmt(r.a)}</b></div>
        </div>`;
      })
      .join('')}<p class="dim tiny">左が ${esc(st.teams.H.name)}、右が ${esc(st.teams.A.name)}。緑の数字がその項目で優勢（ボールロスト・ファウル・カード・オフサイドは少ない方が優勢）です。xG は位置未入力のシュートを平均値で概算しています。</p></div>`;
  }

  /* ---------- 個人成績 ---------- */
  function playerTable(S, st, team) {
    const lines = S.players[team];
    const tot = S.team[team];
    const cols = [
      ['pos', '位置', (p) => esc(p.pos || ''), (p) => (p.pos === 'GK' ? 0 : p.pos === 'DF' ? 1 : p.pos === 'MF' ? 2 : p.pos === 'FW' ? 3 : 4), 'txt'],
      ['goals', 'G', (p) => p.goals],
      ['ast', 'A', (p) => p.ast],
      ['shots', 'SH', (p) => p.shots],
      ['sot', '枠内', (p) => p.sot],
      ['xg', 'xG', (p) => num(p.xg, 2), (p) => p.xg],
      ['xa', 'xA', (p) => num(p.xa, 2), (p) => p.xa],
      ['kp', 'KP', (p) => p.kp],
      ['tkl', 'TKL', (p) => p.tkl],
      ['itc', 'INT', (p) => p.itc],
      ['clr', 'CLR', (p) => p.clr],
      ['tov', 'LOST', (p) => p.tov],
      ['foul', 'FOUL', (p) => p.foul],
      ['fouled', '被F', (p) => p.fouled],
      ['yc', 'Y', (p) => p.yc],
      ['rc', 'R', (p) => p.rc],
      ['off', 'OFF', (p) => p.off],
    ];
    const sortCol = cols.find((c) => c[0] === vs.sort);
    const rows = lines
      .filter((p) => p.num !== 0)
      .slice()
      .sort((a, b) => {
        if (vs.sort === 'num' || !sortCol) return a.num - b.num;
        const f = sortCol[3] || sortCol[2];
        const va = f(a);
        const vb = f(b);
        return sortCol[4] === 'txt' ? (va - vb) * vs.dir : (vb - va) * vs.dir || a.num - b.num;
      });
    const teamLine = lines.find((p) => p.num === 0);
    const tops = {};
    ['goals', 'ast', 'shots', 'sot', 'xg', 'xa', 'kp', 'tkl', 'itc', 'clr'].forEach((k) => {
      const m = Math.max(0, ...rows.map((p) => p[k]));
      if (m > 0) tops[k] = m;
    });
    const th = cols.map((c) => `<th class="${c[0] === vs.sort ? 'sorted' : ''}" data-act="sort" data-key="${c[0]}" title="クリックで並べ替え">${c[1]}${c[0] === vs.sort ? '▾' : ''}</th>`).join('');
    const body = rows
      .map((p) => {
        const name = SL.store.playerName(team, p.num);
        const tds = cols
          .map((c) => {
            const key = c[0];
            const cls = ['num', 'tdnum'];
            if (tops[key] && p[key] === tops[key]) cls.push('top');
            const warnAt = { foul: 3, tov: 4, rc: 1 };
            if (warnAt[key] && p[key] >= warnAt[key]) cls.push('warn');
            return `<td class="${cls.join(' ')}">${c[2](p) === 0 && key !== 'goals' ? '<span class="zero">0</span>' : c[2](p)}</td>`;
          })
          .join('');
        return `<tr class="${p.isGK ? 'gkrow' : ''}"><td class="pnum"><b>${p.num}</b></td><td class="pname">${esc(name)}</td>${tds}<td class="act"><button class="ricon" data-act="hlplayer" data-num="${p.num}" title="${esc(SL.store.playerLabel(team, p.num))} のハイライトを見る">▶</button></td></tr>`;
      })
      .join('');
    const totCells = cols
      .map((c) => {
        const key = c[0];
        if (key === 'pos') return '<td></td>';
        const v = key === 'xg' || key === 'xa' ? num(tot[key], 2) : tot[key];
        return `<td class="num">${v}</td>`;
      })
      .join('');
    const teamRow = teamLine
      ? `<tr class="teamrow"><td class="pnum">—</td><td class="pname">チーム（個人に付かないタグ）</td><td></td><td class="num">${teamLine.goals}</td><td></td><td class="num">${teamLine.shots}</td>${'<td></td>'.repeat(cols.length - 4)}<td></td></tr>`
      : '';
    return `<div class="box-wrap"><table class="tbl box"><thead><tr><th class="${vs.sort === 'num' ? 'sorted' : ''}" data-act="sort" data-key="num" title="背番号順">#</th><th class="l">選手</th>${th}<th></th></tr></thead><tbody>${body}${teamRow}<tr class="totrow"><td class="pnum">計</td><td class="pname">${esc(st.teams[team].name)}</td>${totCells}<td></td></tr></tbody></table></div>`;
  }

  function gkBox(S, st, team) {
    const g = S.players[team].find((p) => p.isGK);
    if (!g || (!g.faced && !g.saves)) return '';
    return `<div class="gkbox"><b>🧤 GK ${esc(SL.store.playerLabel(team, g.num))}</b>
      <span>セーブ <b>${g.saves}</b> / 被枠内シュート <b>${g.faced}</b></span>
      <span>失点 <b>${g.ga}</b></span>
      <span>セーブ率 <b>${pct(g.savePct, 0)}</b></span>
      <span class="dim tiny">相手の枠内シュートから自動で数えています</span></div>`;
  }

  /* ---------- xG の推移 ---------- */
  function xgChart(S, st) {
    const tl = S.xgTl;
    if (tl.length < 2) return '<div class="empty-note">シュートのタグが付くと、xGの推移グラフが出ます。</div>';
    const dur = Math.max(SL.player.duration || 0, tl[tl.length - 1].t + 10);
    const W = 640;
    const H = 170;
    const padL = 34;
    const padR = 10;
    const padT = 12;
    const padB = 20;
    const maxV = Math.max(1, Math.ceil(Math.max(...tl.map((p) => Math.max(p.H, p.A))) * 2) / 2);
    const X = (t) => padL + (t / dur) * (W - padL - padR);
    const Y = (v) => padT + (1 - v / maxV) * (H - padT - padB);
    const line = (k) => {
      let d = `M ${X(0).toFixed(1)} ${Y(0).toFixed(1)}`;
      let last = 0;
      for (const p of tl.slice(1)) {
        d += ` L ${X(p.t).toFixed(1)} ${Y(last).toFixed(1)} L ${X(p.t).toFixed(1)} ${Y(p[k]).toFixed(1)}`;
        last = p[k];
      }
      d += ` L ${X(dur).toFixed(1)} ${Y(last).toFixed(1)}`;
      return d;
    };
    const ticks = [];
    for (let v = 0; v <= maxV + 1e-6; v += maxV > 3 ? 1 : 0.5) ticks.push(v);
    const grid = ticks.map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="xgrid"/><text x="${padL - 4}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" class="fax">${v}</text>`).join('');
    const halfLines = st.periods
      .filter((p) => p.q > 1)
      .map((p) => `<line x1="${X(p.start).toFixed(1)}" x2="${X(p.start).toFixed(1)}" y1="${padT}" y2="${H - padB}" class="fq"/><text x="${(X(p.start) + 3).toFixed(1)}" y="${padT + 9}" class="fqt">${D.qLabel(p.q)}</text>`)
      .join('');
    const goals = tl
      .filter((p) => p.goal)
      .map((p) => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p[p.team]).toFixed(1)}" r="4.6" fill="${st.teams[p.team].color}" class="xgoal"><title>${esc(D.minuteLabel(st, p.t))} ゴール（xG ${p.xg.toFixed(2)}）</title></circle>`)
      .join('');
    const last = tl[tl.length - 1];
    return `<svg class="flow-svg xg-svg" viewBox="0 0 ${W} ${H}" data-dur="${dur}" data-pad="${padL},${padR}" role="img" aria-label="xGの推移">
      ${grid}${halfLines}
      <path d="${line('H')}" fill="none" stroke="${st.teams.H.color}" stroke-width="2.4"/>
      <path d="${line('A')}" fill="none" stroke="${st.teams.A.color}" stroke-width="2.4"/>
      ${goals}
      <text x="${W - padR}" y="${(Y(last.H) - 5).toFixed(1)}" text-anchor="end" class="xgl" fill="${st.teams.H.color}">${esc(st.teams.H.name)} ${last.H.toFixed(2)}</text>
      <text x="${W - padR}" y="${(Y(last.A) + 13).toFixed(1)}" text-anchor="end" class="xgl" fill="${st.teams.A.color}">${esc(st.teams.A.name)} ${last.A.toFixed(2)}</text>
      <line class="fplay" x1="0" x2="0" y1="${padT}" y2="${H - padB}"/>
    </svg><p class="dim tiny">線は「その時点までに積み上がったxG」。●はゴール。グラフをクリックすると、その時点の映像へ移動します。線がゴールより上にあるほど「決め切れていない」、下なら「期待以上に決めた」ことになります。</p>`;
  }

  function halvesTable(S, st) {
    if (S.halves.length < 1 || !S.meta.periodsSet) return '<div class="empty-note">設定タブで後半の開始位置を入れると、前半と後半の比較が出ます。</div>';
    const rows = S.halves
      .map((r) => {
        const cell = (a) => `${a.gf == null ? a.goals : a.gf}<small>${a.shots}本 / xG ${a.xg.toFixed(1)}</small>`;
        return `<tr><td class="l"><b>${esc(D.qLabel(r.q))}</b></td><td class="num">${cell(r.H)}</td><td class="num">${cell(r.A)}</td><td class="num">${r.H.foul}<small>相手 ${r.A.foul}</small></td><td class="num">${r.H.tov}<small>相手 ${r.A.tov}</small></td></tr>`;
      })
      .join('');
    return `<div class="box-wrap"><table class="tbl qtbl"><thead><tr><th class="l"></th><th>${esc(st.teams.H.name)}<small>得点</small></th><th>${esc(st.teams.A.name)}<small>得点</small></th><th>ファウル<small>自</small></th><th>ロスト<small>自</small></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function assistMatrix(S, st, team) {
    const pairs = S.assists[team].pairs;
    const keys = Object.keys(pairs);
    if (!keys.length) return '<div class="empty-note">ゴールの後にラストパスの背番号を入力すると、「誰から誰へ」の組み合わせが出ます。</div>';
    const givers = [...new Set(keys.map((k) => +k.split('>')[0]))].sort((a, b) => a - b);
    const takers = [...new Set(keys.map((k) => +k.split('>')[1]))].sort((a, b) => a - b);
    const mx = Math.max(...keys.map((k) => pairs[k]));
    const head = takers.map((n) => `<th>${n}<small>${esc(SL.store.playerName(team, n))}</small></th>`).join('');
    const rows = givers
      .map((g) => `<tr><th class="l">${g} ${esc(SL.store.playerName(team, g))}</th>${takers.map((t) => { const v = pairs[g + '>' + t] || 0; return `<td class="num" style="${v ? `background:rgba(90,209,255,${(0.15 + (0.5 * v) / mx).toFixed(2)})` : ''}">${v || ''}</td>`; }).join('')}</tr>`)
      .join('');
    return `<div class="box-wrap"><table class="tbl matrix"><thead><tr><th class="l">パスを出す↓／決める→</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function renderStats(root) {
    const st = SL.store.state;
    const S = ST.compute(st, { q: vs.q || null });
    const all = ST.compute(st);
    const team = vs.team;
    const qBtns = ['<button class="seg ' + (!vs.q ? 'on' : '') + '" data-act="q" data-q="0">全体</button>'].concat(all.halves.map((r) => `<button class="seg ${vs.q === r.q ? 'on' : ''}" data-act="q" data-q="${r.q}">${D.qLabel(r.q)}</button>`)).join('');
    const empty = !all.events.length;
    root.innerHTML = `
      <div class="pane-head">${scoreHeader(all, st)}
        <div class="seggroup">${['H', 'A'].map((t) => `<button class="seg team ${team === t ? 'on' : ''}" data-act="steam" data-team="${t}" style="--tc:${st.teams[t].color}">${esc(st.teams[t].name)}</button>`).join('')}</div>
        <div class="seggroup">${qBtns}</div>
        <span class="grow"></span>
        <button class="btn sm" data-act="csv">CSV書き出し</button>
      </div>
      ${empty ? '<div class="card info">まだタグがありません。「タグ付け」タブで付けるか、「サンプル試合」を開いて集計の見え方を確認できます。</div>' : ''}
      <div class="sect"><h4>得点経過 <span class="dim">（クリックでその場面へ）</span></h4>${goalsList(all, st)}</div>
      <div class="sect"><h4>チーム比較${vs.q ? ' <span class="dim">— ' + D.qLabel(vs.q) + '</span>' : ''}</h4>${compare(S, st)}</div>
      <div class="sect"><h4>個人成績 <span class="dim">（見出しをクリックで並べ替え${vs.q ? '・' + D.qLabel(vs.q) : ''}）</span></h4>${playerTable(S, st, team)}${gkBox(S, st, team)}
        <p class="dim tiny">G=ゴール A=アシスト SH=シュート 枠内=枠内シュート xG=ゴール期待値 xA=アシストの期待値 KP=キーパス TKL=タックル INT=インターセプト CLR=クリア LOST=ボールロスト FOUL=ファウル 被F=受けたファウル Y/R=カード OFF=オフサイド</p></div>
      <div class="sect"><h4>xGの推移 <span class="dim">（チャンスの質と量の積み上がり）</span></h4>${xgChart(all, st)}</div>
      <div class="sect"><h4>前半・後半別</h4>${halvesTable(all, st)}</div>
      <div class="sect"><h4>アシストのつながり（${esc(st.teams[team].name)}）</h4>${assistMatrix(all, st, team)}</div>`;
  }

  function csvBox() {
    const st = SL.store.state;
    const S = ST.compute(st);
    const head = ['チーム', '背番号', '名前', '位置', 'ゴール', 'アシスト', 'シュート', '枠内', 'xG', 'xA', 'キーパス', 'タックル', 'インターセプト', 'クリア', 'ロスト', 'ファウル', '受けたファウル', 'イエロー', 'レッド', 'オフサイド', 'セーブ'];
    const rows = [head];
    for (const t of ['H', 'A']) {
      for (const p of S.players[t]) {
        rows.push([st.teams[t].name, p.num, SL.store.playerName(t, p.num), p.pos || '', p.goals, p.ast, p.shots, p.sot, p.xg.toFixed(2), p.xa.toFixed(2), p.kp, p.tkl, p.itc, p.clr, p.tov, p.foul, p.fouled, p.yc, p.rc, p.off, p.saves]);
      }
    }
    return '﻿' + rows.map((r) => r.map(U.csvCell).join(',')).join('\r\n');
  }

  SL.ui.register({
    id: 'stats',
    label: '集計',
    icon: '📊',
    init(root) {
      root.addEventListener('click', (e) => {
        const svg = e.target.closest('.xg-svg');
        if (svg) {
          const r = svg.getBoundingClientRect();
          const vb = svg.viewBox.baseVal;
          const [pl, pr] = svg.dataset.pad.split(',').map(Number);
          const x = ((e.clientX - r.left) / r.width) * vb.width;
          const t = ((x - pl) / (vb.width - pl - pr)) * +svg.dataset.dur;
          SL.ui.userSeek();
          SL.player.seek(U.clamp(t, 0, SL.player.duration || t));
          return;
        }
        const b = e.target.closest('[data-act]');
        if (!b) return;
        switch (b.dataset.act) {
          case 'steam':
            vs.team = b.dataset.team;
            break;
          case 'q':
            vs.q = +b.dataset.q;
            break;
          case 'sort':
            if (vs.sort === b.dataset.key) vs.dir = -vs.dir;
            else {
              vs.sort = b.dataset.key;
              vs.dir = 1;
            }
            break;
          case 'goalseek':
            SL.ui.selectEvent(b.dataset.id, { seek: true });
            return;
          case 'hlplayer': {
            const n = +b.dataset.num;
            SL.hl.st.presetId = 'player';
            SL.hl.st.num = n;
            SL.hl.st.filter = null;
            SL.hl.st.edits = {};
            SL.ui.setTab('hl');
            SL.hl.refresh();
            SL.hl.play(0);
            return;
          }
          case 'csv':
            U.download(csvBox(), (SL.store.state.title || 'boxscore') + '_players.csv', 'text/csv;charset=utf-8');
            return;
        }
        SL.ui.renderActive(true);
      });
      SL.player.on('time', (t) => {
        const el = root.querySelector('.fplay');
        if (!el || SL.ui.tab !== 'stats') return;
        const svg = el.ownerSVGElement;
        const [pl, pr] = svg.dataset.pad.split(',').map(Number);
        const vb = svg.viewBox.baseVal;
        const x = pl + (t / +svg.dataset.dur) * (vb.width - pl - pr);
        el.setAttribute('x1', x);
        el.setAttribute('x2', x);
      });
    },
    render: renderStats,
  });

  /* ---------- 場面別タブ ---------- */
  function breakdown(title, entries, total, labelFn, onclickAttr) {
    if (!entries.length) return '';
    const mx = Math.max(...entries.map((e) => e[1]));
    return `<div class="bd"><div class="bd-title">${title}</div>${entries
      .map(
        ([k, v]) => `<div class="bd-row"><span class="bd-l">${esc(labelFn(k))}</span><div class="bar"><i style="width:${((v / mx) * 100).toFixed(0)}%"></i></div><b>${v}</b><small>${pct(v / total, 0)}</small>${onclickAttr ? `<button class="ricon" ${onclickAttr(k)}>▶</button>` : ''}</div>`
      )
      .join('')}</div>`;
  }

  /** 得点の内訳（失点は原因、得点は型） */
  function goalsBreakdown(S, st, side) {
    const items = GL.build(st, S, { side });
    const title = side === 'against' ? `失点の原因 <span class="dim">— ${esc(st.teams.H.name)}が決められた ${items.length}点</span>` : `得点の型 <span class="dim">— ${esc(st.teams.H.name)}が決めた ${items.length}点</span>`;
    if (!items.length) {
      return `<div class="gb"><h5>${title}</h5><div class="empty-note">${side === 'against' ? '相手のゴールのタグがまだありません（V で相手に切り替え → Q）。' : 'ゴールのタグがまだありません。'}</div></div>`;
    }
    const sm = GL.summary(items);
    const rows = sm.byPrimary
      .map((b) => {
        const c = GL.cause(b.id);
        return `<div class="cd-line" style="--cc:${c.color}" title="${esc(GL.causeHint(b.id, side))}"><span class="cd-l"><i></i>${esc(GL.causeLabel(b.id, side))}</span><div class="bar"><i style="width:${((b.pts / sm.total) * 100).toFixed(0)}%"></i></div><b>${b.pts}点</b><small>${pct(b.pts / sm.total, 0)}</small><button class="ricon" data-act="glcause" data-side="${side}" data-id="${b.id}" title="この場面を映像で見る">▶</button></div>`;
      })
      .join('');
    return `<div class="gb ${side}"><h5>${title}<span class="grow"></span><button class="btn sm ${side === 'against' ? 'primary' : ''}" data-act="glopen" data-side="${side}">▶ 映像で見る</button></h5><div class="cd-lines">${rows}</div>
      ${sm.setN ? `<p class="dim tiny">セットプレー（CK・FK・スローイン・PK）が絡んだ点：${sm.setN}点（${pct(sm.setShare, 0)}）</p>` : ''}</div>`;
  }

  function sceneTable(S, st, team) {
    const rows = S.scenes[team];
    if (!rows.length) return '<div class="empty-note">シュートのタグが付くと、攻撃の型ごとの効率が出ます。</div>';
    const T = S.team[team];
    const maxX = Math.max(0.3, ...rows.map((r) => r.xgShot || 0));
    const body = rows
      .map((r) => {
        const sc = C.sceneOf(r.scene);
        const cls = r.shots < 3 ? '' : r.xgShot >= 0.16 ? 'good' : r.xgShot <= 0.06 ? 'bad' : '';
        return `<tr>
          <td class="l"><b>${esc(sc.short)}</b>${sc.set ? ' <span class="chip alt">セットプレー</span>' : ''}<small>${esc(sc.hint)}</small></td>
          <td class="num">${r.shots}<small>${pct(r.freq, 0)}</small></td>
          <td class="num">${r.sot}</td>
          <td class="num"><b>${r.goals}</b></td>
          <td class="ppp ${cls}"><div class="bar"><i style="width:${(((r.xgShot || 0) / maxX) * 100).toFixed(0)}%"></i></div><b>${num(r.xgShot, 2)}</b>${r.shots < 3 ? '<small>少数</small>' : ''}</td>
          <td class="num">${num(r.xg, 2)}</td>
          <td class="num">${pct(r.conv, 0)}</td>
          <td class="act"><button class="ricon" data-act="scenehl" data-team="${team}" data-scene="${r.scene}" title="この型のシュートを見る">▶</button></td></tr>`;
      })
      .join('');
    const o = S.play[team].open;
    const s = S.play[team].set;
    return `<div class="box-wrap"><table class="tbl scenes"><thead><tr><th class="l">攻撃の型</th><th>シュート</th><th>枠内</th><th>ゴール</th><th>xG/本 ${tip('xg')}</th><th>xG合計</th><th>決定率</th><th></th></tr></thead>
      <tbody>${body}<tr class="totrow"><td class="l">全体</td><td class="num">${T.shots}</td><td class="num">${T.sot}</td><td class="num">${T.goals}</td><td class="ppp"><b>${num(T.xgShot, 2)}</b></td><td class="num">${num(T.xg, 2)}</td><td class="num">${pct(T.conv, 0)}</td><td></td></tr></tbody></table></div>
      <p class="dim tiny">緑＝1本あたりのxGが高い（質の高いチャンスを作れている）／赤＝低い。3本未満は「少数」で参考値です。流れの中：${o.shots}本・${o.goals}点／セットプレー：${s.shots}本・${s.goals}点。</p>`;
  }

  function fieldZoneName(k) {
    return k === 'unknown' ? '場所未入力' : C.fieldZoneLabel(k).replace(/（.*）/, '');
  }

  function setpTable(S, st) {
    const row = (t) => {
      const p = S.setp[t];
      return `<tr><td class="l"><i class="rdot" style="background:${st.teams[t].color}"></i><b>${esc(st.teams[t].name)}</b></td>
        <td class="num">${p.corners}</td><td class="num">${p.corner.shots}<small>${p.corner.goals}点</small></td>
        <td class="num">${p.fk.shots}<small>${p.fk.goals}点</small></td><td class="num">${p.throw.shots}<small>${p.throw.goals}点</small></td>
        <td class="num">${p.pk.goals}/${p.pk.taken}</td></tr>`;
    };
    return `<div class="box-wrap"><table class="tbl"><thead><tr><th class="l">チーム</th><th>コーナー</th><th>CKからのシュート</th><th>FKからのシュート</th><th>スローインから</th><th>PK 成功/本数</th></tr></thead><tbody>${row('H')}${row('A')}</tbody></table></div>`;
  }

  function bucketsTable(S, st) {
    const rows = S.buckets
      .map((b) => {
        const cell = (a) => `${a.goals}<small>${a.shots}本 / xG ${a.xg.toFixed(1)}</small>`;
        return `<tr><td class="l">${esc(b.label)}</td><td class="num">${cell(b.H)}</td><td class="num">${cell(b.A)}</td></tr>`;
      })
      .join('');
    return `<div class="box-wrap"><table class="tbl qtbl"><thead><tr><th class="l">時間帯</th><th>${esc(st.teams.H.name)}<small>ゴール</small></th><th>${esc(st.teams.A.name)}<small>ゴール</small></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="dim tiny">前半・後半をそれぞれ3分割しています（ゴールは得点したチーム側に数えます）。</p>`;
  }

  function renderScenes(root) {
    const st = SL.store.state;
    const S = ST.compute(st);
    const team = vsc.team;
    const tv = S.tov[team];
    const fl = S.fouls[team];
    const other = D.other(team);
    const tvTypes = Object.entries(tv.byType).sort((a, b) => b[1] - a[1]);
    const tvZones = Object.entries(tv.byZone).sort((a, b) => b[1] - a[1]);
    const tvPlayers = Object.entries(tv.byPlayer).sort((a, b) => b[1] - a[1]);
    const flPl = Object.entries(fl.byPlayer).sort((a, b) => b[1] - a[1]);
    const flHalf = Object.entries(fl.byHalf).sort((a, b) => a[0] - b[0]);
    const flZone = Object.entries(fl.byZone).sort((a, b) => b[1] - a[1]);
    const flType = Object.entries(fl.byType).sort((a, b) => b[1] - a[1]);
    const fouledPl = S.players[team].filter((p) => p.fouled > 0).sort((a, b) => b.fouled - a.fouled);
    const cards = fl.yc.concat(fl.rc).sort((a, b) => a.t - b.t);
    root.innerHTML = `
      <div class="pane-head">${scoreHeader(S, st)}
        <div class="seggroup">${[['H', '自チーム'], ['A', '相手']].map(([t, l]) => `<button class="seg team ${team === t ? 'on' : ''}" data-act="steam" data-team="${t}" style="--tc:${st.teams[t].color}">${l}のプレー</button>`).join('')}</div>
      </div>
      <div class="sect"><h4>得点と失点の内訳 <span class="dim">— 攻撃の始まりから分類</span></h4>
        <div class="gb-grid">${goalsBreakdown(S, st, 'against')}${goalsBreakdown(S, st, 'for')}</div>
        <p class="dim tiny">1つのゴールは「主な原因（型）」1つに振り分けます（優先順：PK ＞ オウンゴール ＞ CK ＞ FK ＞ スロー ＞ ボールロスト直後 ＞ カウンター ＞ クロス ＞ 縦パス ＞ ロング ＞ ミドル ＞ 個人技 ＞ 組み立て）。映像で見ると、原因がひと目で分かります。</p></div>
      <div class="sect"><h4>攻撃の型別のシュート <span class="dim">— ${esc(st.teams[team].name)}が撃った場面</span></h4>${sceneTable(S, st, team)}
        ${team === 'A' ? '<p class="dim tiny">相手の攻撃なので、これは「自チームの守備」の成績です。xG/本が高い型ほど、守りにくかった攻め方です。</p>' : ''}</div>
      <div class="sect"><h4>ボールロストの分析 <span class="dim">— ${esc(st.teams[team].name)}のロスト ${tv.total}回</span></h4>
        ${tv.total ? `<div class="bd-grid">
          ${breakdown('種類別', tvTypes, tv.total, (k) => C.tovLabel(k).replace(/（.*）/, ''), (k) => `data-act="tovhl" data-sub="${k}" data-team="${team}" title="この種類のシーンを見る"`)}
          ${breakdown('場所別', tvZones, tv.total, fieldZoneName, (k) => (k === 'unknown' ? '' : `data-act="tovzone" data-zone="${k}" data-team="${team}" title="この場所のロストを見る"`))}
          ${breakdown('選手別', tvPlayers, tv.total, (k) => (+k ? SL.store.playerLabel(team, +k) : 'チーム'), (k) => `data-act="tovplayer" data-num="${k}" data-team="${team}" title="この選手のロストを見る"`)}
        </div>
        <div class="callout ${tv.toShots ? 'bad' : ''}">ロスト直後（12秒以内）に${esc(st.teams[other].name)}が打ったシュート：<b>${tv.toShots}本</b>（うち得点 ${tv.toGoals}点）
          ${tv.toShots ? `<button class="btn sm" data-act="toallowed" data-team="${team}">▶ ロスト → ピンチの場面を見る</button>` : ''}
          <span class="dim tiny">ボールを失った直後の切り替えの質を表します。${tv.own3 ? `自陣でのロスト：${tv.own3}回。` : ''}</span></div>` : '<div class="empty-note">ボールロストのタグがありません。（Z キー）</div>'}
      </div>
      <div class="sect"><h4>ファウル・カードの分析 <span class="dim">— ${esc(st.teams[team].name)}のファウル ${fl.total}回</span></h4>
        ${fl.total ? `<div class="bd-grid">
          ${breakdown('選手別（犯した）', flPl, fl.total, (k) => SL.store.playerLabel(team, +k), (k) => `data-act="foulplayer" data-num="${k}" data-team="${team}"`)}
          ${breakdown('場所別', flZone, fl.total, fieldZoneName, (k) => (k === 'unknown' ? '' : `data-act="foulzone" data-zone="${k}" data-team="${team}"`))}
          ${breakdown('前半・後半別', flHalf.map(([q, n]) => [D.qLabel(+q), n]), fl.total, (k) => k)}
          ${breakdown('種類別', flType, fl.total, (k) => C.foulLabel(k).replace(/（.*）/, ''))}
        </div>
        <div class="callout ${fl.setShots ? 'bad' : ''}">自陣付近でのファウル：<b>${fl.own3}回</b>／ファウルの後に${esc(st.teams[other].name)}が撃ったFK・PK：<b>${fl.setShots}本</b>（うち得点 ${fl.setGoals}点）${fl.pkConceded ? `／PKを与えた：<b>${fl.pkConceded}回</b>` : ''}
          ${fl.setShots ? `<button class="btn sm" data-act="foulset" data-team="${team}">▶ ファウル → FK/PKの場面を見る</button>` : ''}</div>
        <div class="cardline">${cards.length ? cards.map((e) => `<span class="cardchip ${e.type === 'rc' ? 'red' : 'yellow'}" title="${esc(D.clockFull(st, e.t))}"><i></i>${esc(SL.store.playerLabel(team, e.num))} <small>${esc(D.minuteLabel(st, e.t))}</small></span>`).join('') : '<span class="dim">カード：なし</span>'}</div>
        ${fouledPl.length ? `<div class="bd-grid">${breakdown('受けたファウル（相手に止められた回数）', fouledPl.map((p) => [p.num, p.fouled]), fouledPl.reduce((a, p) => a + p.fouled, 0), (k) => SL.store.playerLabel(team, +k))}</div>` : ''}` : '<div class="empty-note">ファウルのタグがありません。（X キー）</div>'}
      </div>
